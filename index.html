<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COPERO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column (max 880px). Top bar with wordmark and tab nav, then a list/detail/compare/form view. Dark pitch-ink ground, green accent, condensed numerals. */
:root{
  --bg:#0E1116; --surface:#171B22; --surface2:#1F2630; --line:#262D38;
  --fg:#EEF1F5; --muted:#9099A8; --accent:#2FD38A; --on-accent:#06281A; --accent-soft:#16221D;
  --gold:#E6B84A; --gold-soft:#2A2414; --warn:#E5A23C; --warn-soft:#2D2416; --bad:#E0674F;
  --bar-lose:#3A4350;
  --sky:#5CC8FF; --sky-soft:#12283A; --pur:#C08BFF; --pur-soft:#261A3A; --gld:#FFD24A; --gld-soft:#3A2E10;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E8ECF1; --line:#D9DFE7;
    --fg:#12161C; --muted:#586272; --accent:#087A4C; --on-accent:#FFFFFF; --accent-soft:#E0F2E9;
    --gold:#8A5F00; --gold-soft:#FBF1D6; --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B23A24;
    --bar-lose:#C2CAD6; --sky:#0A6FA8; --sky-soft:#DDF1FF; --pur:#6A2FB8; --pur-soft:#EDE0FF; --gld:#7A5200; --gld-soft:#FFEFB8; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E8ECF1; --line:#D9DFE7;
  --fg:#12161C; --muted:#586272; --accent:#087A4C; --on-accent:#FFFFFF; --accent-soft:#E0F2E9;
  --gold:#8A5F00; --gold-soft:#FBF1D6; --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B23A24;
  --bar-lose:#C2CAD6; --sky:#0A6FA8; --sky-soft:#DDF1FF; --pur:#6A2FB8; --pur-soft:#EDE0FF; --gld:#7A5200; --gld-soft:#FFEFB8; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:880px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 10px;position:sticky;top:0;z-index:45;background:var(--bg);border-bottom:1px solid transparent}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0 8px}
.pager .btn{min-width:84px}
.pager span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.hero .xl{margin-left:auto;align-self:flex-start}
.rtabs{display:flex;gap:6px;padding:4px 0 12px;position:sticky;top:60px;z-index:30;background:var(--bg)}
.rtabs .tab{flex:1;padding:0 8px;border-radius:12px;min-width:0}
.logo{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.08em;line-height:1;background:none;border:none;padding:6px 0;min-height:44px;color:var(--fg)}
.logo span{color:var(--accent)}
.nav{display:flex;gap:6px}
.tab{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
h2{font-size:18px}
h3{font-size:15px}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.search input{flex:1;min-width:0;height:44px;background:none;border:none;outline:none;font-size:15px}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px;flex-wrap:wrap}
.sel{display:flex;align-items:center;gap:8px;color:var(--muted)}
select,.inp{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
select{padding-right:8px}
.list{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:720px){.list{grid-template-columns:1fr 1fr}}
.row{display:grid;grid-template-columns:26px 44px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:68px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.rk{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.av{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.av.big{width:84px;height:84px;font-size:34px;border:2px solid var(--accent)}
.nm{display:flex;flex-direction:column;min-width:0}
.nm b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rt small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.ovr{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;min-width:46px;text-align:center;padding:1px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.back{min-height:44px;background:none;border:none;color:var(--muted);padding:0 4px;display:inline-flex;align-items:center;gap:6px}
.hero{display:flex;align-items:center;gap:16px;padding:8px 0 16px;flex-wrap:wrap}
.hero h1{font-size:26px;line-height:1.15}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);margin-top:4px}
.pos{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile,.m{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile span,.m span{display:block;font-size:12px;color:var(--muted)}
.tile b,.m b{display:block;font-family:var(--display);font-size:34px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.tile b.g,.m b.g{color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:20px;overflow-x:auto}
.dt{min-height:44px;padding:0 14px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.dt[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{gap:8px}.tile{padding:12px 10px}.tile b{font-size:27px}}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr) 40px;align-items:center;gap:10px}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.bt{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bt i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar b{font-family:var(--display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ch h3{overflow-wrap:anywhere}
.ch small{color:var(--muted);display:block}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.st div{background:var(--surface2);border-radius:10px;padding:6px 4px}
.st b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.st span{font-size:11px;color:var(--muted)}
.rc{display:inline-block;min-width:40px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;border-radius:7px;padding:1px 6px;font-variant-numeric:tabular-nums}
.r1{background:var(--accent);color:var(--on-accent)}
.r2{background:var(--accent-soft);color:var(--accent)}
.r3{background:var(--surface2);color:var(--fg)}
.r4{background:var(--warn-soft);color:var(--warn)}
.tag{font-style:normal;padding:2px 8px;border-radius:7px;background:var(--surface2);font-size:12px;display:inline-block}
.tag.ind{background:var(--gold-soft);color:var(--gold)}
.tag.neg{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:24px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:10px}
.pick select{width:100%}
.cmph{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);gap:4px;align-items:start;padding:18px 0 8px;text-align:center}
.cmph .p{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cmph .p b{overflow-wrap:anywhere}
.vs{font-family:var(--display);font-size:20px;color:var(--muted);padding-top:22px}
.cr{padding:9px 0;border-top:1px solid var(--line)}
.cr .l{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:baseline}
.cr .l span{color:var(--muted);font-size:12px}
.cr .l b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.cr .l b:last-child{text-align:right}
.cr .l b.w{color:var(--accent)}
.cb{display:flex;gap:6px;margin-top:5px}
.cb div{flex:1;display:flex}
.cb div:first-child{justify-content:flex-end}
.cb i{display:block;height:6px;border-radius:3px;background:var(--bar-lose)}
.cb i.w{background:var(--accent)}
/* detail season table */
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.tb{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tb th{font-weight:500;color:var(--muted);font-size:11px;text-align:right;padding:4px 6px;white-space:nowrap}
.tb td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
.tb th:first-child,.tb td:first-child{text-align:left;font-family:var(--display);font-size:16px}
.tb th:last-child,.tb td:last-child{text-align:left}
.tb td.chp{min-width:150px}
.tb td.chp .tag{margin:0 4px 4px 0}
/* form */
.fs{display:flex;flex-direction:column;gap:12px;padding-top:28px}
.fh{display:flex;align-items:center;gap:10px}
.fh i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.fg{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lb{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{min-height:46px;width:100%;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.fld textarea{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);outline:none}
.n6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.n6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.n6 .fld input{text-align:center;font-family:var(--display);font-size:20px;padding:0 4px}
.n4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.n4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.n4 .fld input{text-align:center;font-family:var(--display);font-size:20px;padding:0 4px}
.seg{display:flex;gap:8px}
.seg .chip{flex:1;border-radius:12px}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.clubs .chip{border-radius:12px;white-space:normal;text-align:left;padding:6px 10px;display:flex;align-items:center;gap:8px}
.clubs .chip b.no{font-family:var(--display);font-size:16px;min-width:20px;color:var(--muted);font-weight:600}
.clubs .chip[aria-pressed="true"] b.no{color:var(--accent)}
.addc{display:flex;gap:8px}
.addc input{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.err{color:var(--bad);font-size:13px}
.fld input.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.namerow{display:flex;gap:8px;align-items:stretch}.namerow input{flex:1;min-width:0}.namerow .btn{white-space:nowrap;flex:0 0 auto;min-height:44px}
.atag{font-size:11px;font-weight:700;color:var(--accent);margin-left:4px}
.aggbox{padding:10px 12px;border:1px dashed var(--line);border-radius:12px;margin:10px 0}
.hint{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 10px}
.natbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;width:100%;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.natbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:8px}
.natbox input{min-height:42px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.natlist{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain}
.natlist h4{position:sticky;top:0;margin:0;padding:4px 8px;font-size:12px;color:var(--accent);background:var(--surface);font-weight:700}
.natlist button{min-height:42px;text-align:left;padding:0 10px;border:none;border-radius:8px;background:none;display:flex;gap:10px;align-items:center}
.natlist button:hover,.natlist button[aria-selected="true"]{background:var(--accent-soft)}
.season{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.season .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.season .sh b{font-family:var(--display);font-size:22px}
.season .sh b small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.pbtn{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.pbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pbtn i{font-style:normal;font-family:var(--display);font-weight:700;margin-left:4px;color:var(--fg)}
.pn{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.pn h4{margin:0;font-size:12px;color:var(--muted);font-weight:500}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted)}
.pchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pchip[disabled]{opacity:.38;cursor:not-allowed}
.pchip small{font-size:11px;opacity:.8}
.ro{min-height:44px;display:flex;align-items:center;padding:0 12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}
.pchip.x{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.awadd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:480px){.awadd{grid-template-columns:1fr 1fr}.awadd .btn{grid-column:1/-1}}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.sum{background:var(--accent-soft);border-radius:12px;padding:10px 12px;color:var(--accent);font-size:13px}

.ovr.o-sky{background:var(--sky-soft);color:var(--sky)}
.ovr.o-pur{background:var(--pur-soft);color:var(--pur)}
.ovr.o-gold{background:var(--gld-soft);color:var(--gld);box-shadow:inset 0 0 0 1px var(--gld)}
.tile b.g.o-sky{color:var(--sky)}.tile b.g.o-pur{color:var(--pur)}.tile b.g.o-gold{color:var(--gld)}
.natwrap{position:relative}
.natbox{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.nn{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.nn .fld input{text-align:center;font-family:var(--display);font-size:20px;padding:0 4px}
.nn .fld input::placeholder{color:var(--muted);opacity:.55}
.cf{color:var(--muted);font-style:italic}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.kv div{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid var(--line);padding:3px 0}
.kv span{color:var(--muted)}.kv b{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.detgrid{display:grid;grid-template-columns:1fr;gap:10px;padding-top:8px}
@media (min-width:720px){.detgrid{grid-template-columns:1fr 1fr}}
summary.sm{cursor:pointer;min-height:36px;display:flex;align-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:500;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.row,.chip,.tab,.pchip{transition:border-color .15s,background .15s}}

/* ===== round 3 ===== */
body{word-break:keep-all;overflow-wrap:break-word}
.ovr.o-gray{background:var(--surface2);color:var(--muted)}
.tile b.g.o-gray{color:var(--muted)}
.clubs{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.clubs .chip{line-height:1.25;min-height:46px}
.clubs .chip span{text-wrap:balance;word-break:keep-all;overflow-wrap:break-word}
.bar .bl{white-space:normal;line-height:1.25}
.nm b{white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nm small{white-space:normal;line-height:1.25}
.nn{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.nn .fld label{min-height:2.5em;display:flex;align-items:flex-end;line-height:1.25;text-wrap:balance}

<script>/* COPERO 단독 실행용 연결 코드 — Supabase(Google 로그인 + 사용자별 저장). claude.ai 안에서는 사용되지 않음 */
(function(){
if(window.claude)return;
var CFG=window.__COPERO_CFG||{};
var URL_=(CFG.url||'').replace(/\/+$/,''),KEY=CFG.anon||'';
var LS='copero.auth',sess=null,authErr='';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function lsSet(v){try{if(v)localStorage.setItem(LS,JSON.stringify(v));else localStorage.removeItem(LS)}catch(e){}}
function jwt(t){try{var p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}
function setSess(a,r){var p=jwt(a);if(!p)return false;sess={access:a,refresh:r,exp:(p.exp||0)*1000,uid:p.sub,name:((p.user_metadata||{}).full_name||(p.user_metadata||{}).name||p.email||'')};lsSet({access:a,refresh:r});return true}
function parseHash(){
  var h=(location.hash||'').replace(/^#/,''),q=(location.search||'').replace(/^\?/,'');
  var P=new URLSearchParams(h||q);
  if(P.get('error_description')||P.get('error')){authErr=P.get('error_description')||P.get('error');cleanUrl();return}
  if(P.get('access_token')){setSess(P.get('access_token'),P.get('refresh_token')||'');cleanUrl()}
}
function cleanUrl(){try{history.replaceState(null,'',location.pathname)}catch(e){}}
async function refresh(){
  if(!sess||!sess.refresh)return false;
  try{
    var r=await fetch(URL_+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh})});
    if(!r.ok)return false;var j=await r.json();return setSess(j.access_token,j.refresh_token);
  }catch(e){return false}
}
async function token(){
  if(!sess)throw new Error('로그인이 필요합니다.');
  if(sess.exp&&sess.exp-Date.now()<60000){if(!(await refresh()))throw new Error('로그인이 만료되었습니다. 다시 로그인해 주세요.')}
  return sess.access;
}
async function rest(path,opt){
  opt=opt||{};var t=await token();
  var h=Object.assign({apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},opt.headers||{});
  var r=await fetch(URL_+'/rest/v1/'+path,{method:opt.method||'GET',headers:h,body:opt.body});
  if(!r.ok){var m='';try{m=(await r.json()).message}catch(e){}throw new Error(m||('저장소 오류 ('+r.status+')'))}
  return r.status===204?null:r.text().then(function(s){return s?JSON.parse(s):null});
}
var auth=window.__auth={logged:false,name:'',err:'',
  login:function(){location.href=URL_+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname)},
  logout:async function(){try{if(sess)await fetch(URL_+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sess.access}})}catch(e){}lsSet(null);sess=null;location.href=location.pathname}};
auth.ready=(async function(){
  var saved=lsGet();if(saved&&saved.access)setSess(saved.access,saved.refresh);
  parseHash();
  if(sess&&sess.exp&&sess.exp<Date.now()+5000){if(!(await refresh()))sess=null}
  auth.logged=!!sess;auth.name=sess?sess.name:'';auth.err=authErr;
})();

/* ---- 저장소: Firestore 비슷한 인터페이스 ---- */
var SEED=window.__SEED_APP||{config:{countries:[]},players:{}};
var cache=null,subs=[];
function notify(){subs.slice().forEach(function(f){try{f()}catch(e){}})}
async function load(){
  if(cache)return cache;
  var rows=await rest('player_docs?select=id,data');cache={};(rows||[]).forEach(function(r){cache[r.id]=r.data});return cache;
}
function uidOf(path){var m=path.match(/^data\/users\/([^\/]+)/);return m?m[1]:null}
var rnd=function(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
var db={
  collection:function(col){
    if(col==='players')return{onSnapshot:function(cb){setTimeout(function(){cb({docs:Object.keys(SEED.players).map(function(id){return{id:id,data:function(){return JSON.parse(JSON.stringify(SEED.players[id]))}}})})},0);return function(){}}};
    return{
      onSnapshot:function(cb,err){
        var f=function(){cb({docs:Object.keys(cache||{}).map(function(id){return{id:id,data:function(){return JSON.parse(JSON.stringify(cache[id]))}}})})};
        load().then(function(){subs.push(f);f()},function(e){if(err)err(e)});return function(){}
      },
      add:async function(doc){await load();var id=rnd();await rest('player_docs?on_conflict=uid,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({uid:sess.uid,id:id,data:doc})});cache[id]=JSON.parse(JSON.stringify(doc));setTimeout(notify,0);return{id:id}}
    };
  },
  doc:function(path){
    var parts=path.split('/'),id=parts[parts.length-1];
    if(path==='config/app')return{onSnapshot:function(cb){setTimeout(function(){cb({exists:true,data:function(){return JSON.parse(JSON.stringify(SEED.config))}})},0)}};
    return{
      set:async function(doc){await load();await rest('player_docs?on_conflict=uid,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({uid:sess.uid,id:id,data:doc})});cache[id]=JSON.parse(JSON.stringify(doc));setTimeout(notify,0)},
      delete:async function(){await load();await rest('player_docs?id=eq.'+encodeURIComponent(id),{method:'DELETE'});delete cache[id];setTimeout(notify,0)}
    };
  }
};
var user={canEdit:async function(){return true},id:async function(){return sess?sess.uid:''},me:async function(){return{id:sess?sess.uid:'',name:sess?sess.name:''}}};
var dl={save:async function(o){
  var blob=new Blob([o.data],{type:o.mime||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename||'COPERO.xlsx';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}};
window.claude={use:async function(n){return n==='db'?db:n==='user'?user:n==='downloads'?dl:null}};
})();
</script>

function parseAges(s){
  const r=[];
  String(s||'').split(/\s*[\/,]\s*/).forEach(part=>{
    const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)return;
    let a=+m[1],b=+(m[2]||m[1]);if(b<a){const t=a;a=b;b=t}if(b-a>45)b=a+45;
    for(let i=a;i<=b;i++)r.push(i);
  });
  return Array.from(new Set(r)).sort((x,y)=>x-y);
}

    const L={c:c,rows:rows,nat:isNat,T:{},label:isNat?'국가대표':c.club};
    const ag=c.agg||{};['g','gl','as','cs','ga','rt'].forEach(k=>{if(num(ag[k])>0&&(c.aau||[]).indexOf(k)<0&&!(gk&&(k==='gl'||k==='as')))L.T[k]=num(ag[k])});
    lvl.push(L);
  };
  club.forEach(c=>prep(c,false));nat.forEach(c=>prep(c,true));
  const act=lvl.filter(L=>L.nat===(scope==='nat'));
  /* 전성기 판단 */
  const crow=[];lvl.forEach(L=>{if(!L.nat)L.rows.forEach(r=>crow.push(r))});
  let pc=26.5,peakRow=null;
  if(crow.length>=3){
    const mo=Math.max.apply(null,crow.map(r=>r.ovrE));peakRow=crow.filter(r=>r.ovrE===mo&&!r.s.inj)[0]||null;
    if(peakRow){pc=peakRow.a;peakRow.q=clamp(peakRow.q+.15,0,1)}
    else{const mx=Math.max.apply(null,crow.map(r=>r.q)),top=crow.filter(r=>r.q>=mx-0.04);pc=clamp(top.reduce((t,r)=>t+r.a,0)/top.length,24,29.5)}
  }
  crow.forEach(r=>{r.pw=r.s.inj?0:Math.exp(-Math.pow((r.a-pc)/3.0,2)/2)});
  let made=0;
  /* 쓰기 가능: 빈 칸, 또는 자동 생성된 칸(다시 설정 · 경기수를 다시 만든 시즌 · 합계가 지정된 항목) */
  const canW=(s,k)=>!has(s[k])||(isAuto(s,k)&&(overwrite||s._rg));
  const cw=(L,s,k)=>!has(s[k])||(isAuto(s,k)&&(overwrite||s._rg||L.T[k]>0));
  const wr=(L,s,k,v)=>{if(v===undefined||v===null||v===''||(typeof v==='number'&&!isFinite(v))||String(v)==='NaN')return false;if(cw(L,s,k)){s[k]=String(v);markAuto(s,k);return true}return false};
  const userCell=(s,k)=>has(s[k])&&!isAuto(s,k);
  /* 0) 국가대표: 국제대회 시즌 판정 (직접 지정 > 대표팀 트로피 > 2년 주기 자동 배정) */
  act.forEach(L=>{
    if(!L.nat)return;
    L.rows.forEach(r=>{r.intl=natIntl(r.s);r.canFlip=r.s.intl===undefined&&!r.intl});
  });
  /* 1) 경기수 */
  act.forEach(L=>{
    L.rows.forEach(r=>{
      const s=r.s;
      r.cap=L.nat?(r.intl?20:10):70;
      r.lock=L.T.g?userCell(s,'g'):!canW(s,'g');
      if(r.lock){r.g=num(s.g)}
      else if(L.nat){
        const f=r.a<20?.5:r.a>35?.6:1;
        r.g=r.intl?clamp(Math.round((5+r.q*11+gauss(r.rng)*2.4)*f),1,20):clamp(Math.round((1+r.q*7+gauss(r.rng)*1.6)*f),0,10);
      }else r.g=pickGames(r.rng,r.a,r.q,70,r.pw==null?0.5:r.pw);
      if(s.inj&&!r.lock)r.g=Math.max(1,Math.round(r.g*(.2+.3*r.rng())));
    });
  });
  /* 2) 합계 경기수가 있으면 합계에 정확히 맞춰 나눔 (직접 입력한 경기수는 고정) */
  act.forEach(L=>{
    if(!L.T.g)return;
    const free=L.rows.filter(r=>!r.lock),fix=L.rows.filter(r=>r.lock).reduce((t,r)=>t+r.g,0),R=L.T.g-fix;
    if(R<0){errs.push(`${L.label}: 직접 입력한 경기수의 합(${fix})이 합계(${L.T.g})보다 큽니다.`);return}
    if(!free.length){if(R!==0)errs.push(`${L.label}: 모든 시즌의 경기수가 직접 입력되어 있어 합계(${L.T.g})와 맞출 수 없습니다. (현재 ${fix}경기)`);return}
    if(L.nat){let cap0=free.reduce((t,r)=>t+r.cap,0);const cand=free.filter(r=>r.canFlip).sort((x,y)=>y.q-x.q);while(cap0<R&&cand.length){const r=cand.shift();r.intl=true;r.flip=true;r.cap=20;cap0+=10}}
    const capS=free.reduce((t,r)=>t+r.cap,0);
    if(R>capS){errs.push(`${L.label}: 합계 경기수(${L.T.g})를 시즌별 최대 경기수로는 나눌 수 없습니다. ${L.nat?'(국제대회 시즌 20경기, 그 외 10경기) 국제대회 시즌을 늘리거나 합계를 줄여 주세요.':'(1년 최대 70경기) 합계를 줄이거나 활동 기간을 늘려 주세요.'}`);return}
    const o=distribute(free.map(r=>Math.max(1,r.g)),R,free.map(r=>r.cap),true);
    free.forEach((r,i)=>{r.g=o[i]});
  });
  /* 3) 클럽: 시즌 56경기 이상이 선수 생활 중 1~3번 (합계가 허용하는 범위에서) */
  if(scope==='club'){
    const cr=[];act.forEach(L=>L.rows.forEach(r=>cr.push(r)));
    const hi=()=>cr.filter(r=>r.g>=56);
    let guard=0;
    while(hi().length>3&&guard++<50){
      const cand=hi().filter(r=>!r.lock).sort((x,y)=>x.q*x.pw-y.q*y.pw)[0];if(!cand)break;
      const old=cand.g;let rem=old-55;cand.g=55;
      const rec=[];
      cr.filter(r=>r.c===cand.c&&!r.lock&&r!==cand&&r.g<55).sort((x,y)=>x.g-y.g).forEach(r=>{if(rem>0){const t=Math.min(rem,55-r.g);r.g+=t;rem-=t;rec.push([r,t])}});
      if(rem>0){rec.forEach(x=>{x[0].g-=x[1]});cand.g=old;break}
    }
    if(hi().length===0&&cr.length>=5){
      const cands=cr.filter(r=>!r.lock&&r.a>=18&&r.a<=38&&r.g>0).sort((x,y)=>y.pw*(.5+y.q)-x.pw*(.5+x.q));
      for(let i=0;i<cands.length;i++){
        const cand=cands[i],need=56+Math.floor(hstr(d.name+cand.a)%5)-cand.g;
        if(need<=0)break;
        const L=act.find(l=>l.c===cand.c);
        if(L.T.g){const don=cr.filter(r=>r.c===cand.c&&!r.lock&&r!==cand&&r.g-need>=12).sort((x,y)=>y.g-x.g)[0];if(don){don.g-=need;cand.g+=need;break}}
        else{cand.g+=need;break}
      }
    }
  }
  /* 경기수를 새로 정하는 시즌은 그 시즌의 자동 생성 스탯도 모두 다시 만든다 */
  act.forEach(L=>L.rows.forEach(r=>{if(!r.lock)r.s._rg=true}));
  /* 4) 나머지 스탯 */
  act.forEach(L=>{
    const gen=[];
    L.rows.forEach(r=>{
      const s=r.s,g=r.g,rng=r.rng;
      if(g<=0){r.clear=true;return}
      const mult=(k)=>{const e=RATE[k];return Math.max(.35,1+e[1]*(2*r.q-1))*e[0][pi]};
      /* 출전 시간: 경기당 최소 1분, 평균 최대 90분 (연장전·추가시간을 감안해도 리그는 100분을 넘지 않음) */
      const mpg=gk?clamp(88+gauss(rng)*1.5,80,90):clamp((g>=30?70+18*r.q:g>=15?58+22*r.q:28+30*r.q)+gauss(rng)*3,12,90);
      const mins=clamp(Math.round(g*mpg),g,Math.round(g*90)),nine=mins/90;
      const noise=()=>clamp(1+gauss(rng)*.10,.72,1.35);
      const v={};
      Object.keys(RATE).forEach(k=>{v[k]=Math.max(0,Math.round(nine*mult(k)*noise()))});
      const aw=(s.aw||[]).map(awType);
      if(!gk&&aw.indexOf('골든부츠')>=0)v.gl=Math.max(v.gl,Math.round(g*.85));
      if(!gk&&aw.indexOf('도움왕')>=0)v.as=Math.max(v.as,Math.round(g*.55));
      if(!gk&&aw.indexOf('발롱도르')>=0&&pi<=1)v.gl=Math.max(v.gl,Math.round(g*.7));
      v.gl=Math.min(v.gl,Math.ceil(g*1.6));v.as=Math.min(v.as,Math.ceil(g*1.2));
      v.sh=Math.max(v.sh,Math.round(v.gl*1.6));
      v.sot=clamp(Math.round(v.sh*(.32+.2*r.q+gauss(rng)*.03)),Math.min(v.gl,v.sh),v.sh);
      v.pg=0;
      const csr=(gk?.18+.30*r.q:.2+.25*r.q)*noise();
      v.cs=clamp(Math.round(g*(mpg/90)*csr),0,g);
      if(gk&&aw.indexOf('골든 글러브')>=0)v.cs=Math.max(v.cs,Math.round(g*.5));
      v.ga=Math.max(0,Math.round(nine*(gk?1.55-.85*r.q:1.45-.8*r.q)*noise()));
      v.yc=Math.round(g*YC[pi]*noise());v.rd=rng()<g*.006?1:0;v.min=mins;
      if(gk){v.gl=0;v.as=0}
      v.rt=clamp(Math.round((6.1+3.5*Math.pow(r.q,1.15))*10)/10,5.8,9.9);
      if(L.T.rt)v.rt=clamp(L.T.rt+gauss(rng)*.35+(r.q-.5)*.5,5.8,9.9);
      r.v=v;gen.push(r);
    });
    /* 개인 최고 시즌: 합계가 지정되지 않은 항목만 최고 기록으로 보정 */
    if(!L.nat&&peakRow&&gen.indexOf(peakRow)>=0){
      const pr=peakRow,oth=L.rows.filter(r=>r!==pr),val=(r,k)=>r.v?r.v[k]:num(r.s[k]);
      if(!gk&&!L.T.gl&&!L.T.as){const bo=Math.max.apply(null,oth.map(r=>val(r,'gl')+val(r,'as')).concat([0])),cur=pr.v.gl+pr.v.as;if(cur<=bo)pr.v.gl=Math.min(Math.ceil(pr.g*1.6),pr.v.gl+bo-cur+1)}
      if(!L.T.rt){const br=Math.max.apply(null,oth.map(r=>val(r,'rt')).concat([0]));if(pr.v.rt<=br)pr.v.rt=Math.min(9.9,Math.round((br+.1)*10)/10)}
      if(gk&&!L.T.cs){const bc=Math.max.apply(null,oth.map(r=>val(r,'cs')/Math.max(1,num(r.s.g)||r.g)).concat([0]));const g1=Math.max(1,pr.g);if(pr.v.cs/g1<=bc)pr.v.cs=Math.min(pr.g,Math.round((bc+.03)*g1))}
    }
    /* 합계에 정확히 맞춤: 직접 입력한 칸은 고정, 나머지 시즌이 (합계 − 고정 합)을 나눠 가짐 */
    ['gl','as','cs','ga'].forEach(k=>{
      const T=L.T[k];if(!T)return;
      let F=0;const free=[];
      L.rows.forEach(r=>{const s=r.s;if(userCell(s,k)){F+=num(s[k]);return}if(r.v)free.push(r)});
      const R=T-F;
      if(R<0){errs.push(`${L.label}: 직접 입력한 ${SL[k]}의 합(${F})이 합계(${T})보다 큽니다.`);return}
      if(!free.length){if(R!==0)errs.push(`${L.label}: ${SL[k]}을(를) 나눌 시즌이 없습니다. 경기수가 있는 시즌이 필요합니다. (합계 ${T})`);return}
      const capK=r=>k==='cs'?r.g:k==='ga'?r.g*4:k==='gl'?Math.ceil(r.g*1.6):Math.ceil(r.g*1.2);
      const capS=free.reduce((t,r)=>t+capK(r),0);
      if(R>capS){errs.push(`${L.label}: 합계 ${SL[k]}(${T})를 시즌별 경기수로는 나눌 수 없습니다. 경기수 합계를 늘리거나 ${SL[k]} 합계를 줄여 주세요.`);return}
      const o=distribute(free.map(r=>r.v[k]+0.01*r.g+0.001),R,free.map(capK),false);
      free.forEach((r,i)=>{r.v[k]=o[i]});
    });
    if(L.T.rt){
      const T=L.T.rt,u=Math.abs(T*10-Math.round(T*10))<1e-9?0.1:0.01,inv=Math.round(1/u);
      let nfix=0,Ff=0;const free=[];
      L.rows.forEach(r=>{const s=r.s;if(userCell(s,'rt')&&num(s.rt)>0){nfix++;Ff+=Math.round(num(s.rt)*inv);return}if(r.v)free.push(r)});
      const n=nfix+free.length;
      if(n>0){
        const tot=Math.round(T*n*inv),R=tot-Ff,lo=Math.round(5*inv),hi=Math.round(10*inv);
        if(!free.length){if(R!==0)errs.push(`${L.label}: 평점 합계(${T})와 직접 입력한 평점이 맞지 않습니다.`)}
        else if(R<free.length*lo||R>free.length*hi)errs.push(`${L.label}: 평점 ${T}에 맞게 시즌 평점을 나눌 수 없습니다. 직접 입력한 평점과 합계의 차이가 너무 큽니다.`);
        else{
          let vals=free.map(r=>clamp(Math.round(r.v.rt*inv),lo,hi));
          const shift=(R-vals.reduce((a,b)=>a+b,0))/free.length;vals=vals.map(x=>clamp(Math.round(x+shift),lo,hi));
          let diff=R-vals.reduce((a,b)=>a+b,0),gi=0;const ord=free.map((r,i)=>i).sort((a,b)=>free[b].g-free[a].g);
          while(diff!==0&&gi++<200000){const i=ord[gi%ord.length],st=diff>0?1:-1,nv=vals[i]+st;if(nv>=lo&&nv<=hi){vals[i]=nv;diff-=st}}
          free.forEach((r,i)=>{r.rtS=(vals[i]/inv).toFixed(u===0.1?1:2)});
        }
      }
    }
    /* 합계 보정 후 세부 스탯의 앞뒤 관계 재정리 */
    gen.forEach(r=>{const v=r.v;
      v.cs=Math.min(v.cs,r.g);v.sh=Math.max(v.sh,Math.round(v.gl*1.6));v.sot=clamp(v.sot,Math.min(v.gl,v.sh),v.sh);
      v.pg=(pi<=3&&v.gl>=6)?Math.min(v.gl,Math.round(v.gl*(.03+r.rng()*.12))):0;
      v.kp=Math.max(v.kp,Math.round(v.as*1.3));v.bc=clamp(v.bc,Math.min(Math.round(v.as*.35),v.kp),v.kp);v.pp=Math.max(v.pp,v.lp*3);
      if(r.rtS==null)v.rtS=v.rt.toFixed(1);else v.rtS=r.rtS;
      if(gk){v.sh=0;v.sot=0;v.pg=0}
    });
  });
  if(errs.length)return{n:0,err:errs[0]+(errs.length>1?` (외 ${errs.length-1}건)`:'')};
  /* 5) 쓰기 */
  let flipped=0;
  act.forEach(L=>{
    L.rows.forEach(r=>{
      const s=r.s;
      if(r.flip){s.intl=true;flipped++}
      if(!r.lock)wr(L,s,'g',r.g);
      if(r.clear){SKEYS.forEach(k=>{if(isAuto(s,k)&&(overwrite||s._rg||L.T[k]>0)){s[k]='';s.au=(s.au||[]).filter(x=>x!==k)}});return}
      SKEYS.forEach(k=>{wr(L,s,k,k==='rt'?r.v.rtS:r.v[k])});
      made++;
    });
  });
  d.careers.forEach(c=>c.seasons.forEach(s=>{delete s._rg}));
  return{n:made,err:'',flipped:flipped};
}

/* ---------- OVR · 몸값 자동 생성 ---------- */
/* 기존 등록 선수(36명) 클럽 시즌 분포에서 뽑은 분위(0,10,…,100%) 기준표 */
const REF={rt:[6.1,7.2,7.3,7.6,7.8,8,8.1,8.3,8.4,8.8,9.7],
  FW:[0,.346,.388,.561,.611,.76,.819,.904,1.024,1.175,1.341],MF:[0,.083,.201,.364,.515,.609,.676,.784,.894,1.202,2.066],DF:[0,.061,.09,.114,.158,.182,.241,.27,.365,.63,1.21],
  GKcs:[0,.27,.295,.319,.355,.362,.372,.473,.478,.805,.851],GKga:[.362,.489,.536,.568,.653,.697,.761,.955,1.096,1.333,1.391]};
const pct=(t,v)=>{if(v<=t[0])return 0;if(v>=t[10])return 1;for(let i=0;i<10;i++){if(v<=t[i+1]){const d=t[i+1]-t[i];return(i+(d>0?(v-t[i])/d:0))/10}}return 1};
const lerpT=(T,x)=>{if(x<=T[0][0])return T[0][1];for(let i=1;i<T.length;i++){if(x<=T[i][0]){const a=T[i-1],b=T[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}}return T[T.length-1][1]};
/* 종합 점수(0~1) → OVR. 기존 선수 분포 기준: 0.5 ≈ 기존 선수 중앙값 */
const S2O=[[0,55],[.1,68],[.2,74],[.3,79],[.4,83],[.5,86],[.6,89],[.7,91],[.8,93],[.9,95],[.96,97],[.985,98],[1,99]];
/* OVR → 전성기 몸값(€M). 기존 선수(OVR 90≈€100M, 98≈€290M)와 실제 이적시장 시세(OVR 80≈€30~45M, 85≈€70M) 참고 */
const O2V=[[55,.3],[60,.6],[65,1.8],[70,5],[75,14],[80,32],[83,50],[85,68],[88,90],[90,105],[92,122],[94,140],[95,155],[96,175],[97,225],[98,290],[99,330]];
const AGE_VM={16:1.6,17:1.6,18:1.6,19:1.5,20:1.4,21:1.3,22:1.2,23:1.1,24:1,25:1,26:1,27:.97,28:.9,29:.8,30:.68,31:.56,32:.45,33:.36,34:.28};
const ageVM=a=>a<=16?1.6:a>=35?.2:AGE_VM[a];
const AGE_CAP=a=>a<=16?84:a===17?88:a===18?91:a===19?93:a===20?95:99;
const TW={'챔스':.5,'클럽 월드컵':.15,'인터콘티넨탈컵':.1,'유로파':.2,'컨퍼런스리그':.1,'UEFA 슈퍼컵':.08,'월드컵':.6,'올림픽':.25,'유로컵':.4,'코파 아메리카':.4,'아시안컵':.3,'아프리카 네이션스컵':.3,'CONCACAF 골드컵':.25,'AFC 챔스':.3,'코파 리베르타도레스':.35,'CAF 챔피언스리그':.25,'CONCACAF 챔피언스컵':.2};
const AWW={'발롱도르':1,'FIFA 올해의 선수':.8,'UEFA 올해의 선수':.8,'골든부츠':.6,'MVP(올해의 선수)':.6,'골든 글러브':.6,'도움왕':.4,'푸스카스상':.3,'영플레이어상':.3};
const PERF_KEYS={0:['gl','as','sh','kp'],1:['gl','as','kp','dr'],2:['gl','as','kp','bc'],3:['as','kp','pp','tk'],4:['tk','ic','rc','pp'],5:['tk','ic','cr','kp'],6:['tk','ic','cl','ad'],7:['cs']};
function perfIdx(s,pi){
  const g=num(s.g),parts=[];
  if(g>0){
    const mins=num(s.min)||g*70,nine=mins/90;
    PERF_KEYS[pi].forEach(k=>{
      if(!has(s[k]))return;
      const base=k==='cs'?.3*g*(mins/g/90):nine*(RATE[k]?RATE[k][0][pi]:0);
      if(base<=0)return;
      parts.push(clamp(Math.log2((num(s[k])/base+.2)/1.2),-1,1));
    });
  }
  return parts.length?parts.reduce((a,b)=>a+b,0)/parts.length:null;
}
const fmtVal=v=>v>=100?String(Math.round(v)):v>=10?String(Math.round(v*2)/2):String(Math.round(v*10)/10);
function clubSeq(d){const q=[];d.careers.forEach(c=>{if(c.kind!=='nat')c.seasons.forEach(s=>q.push(s))});return q.sort((a,b)=>num(a.a)-num(b.a))}
function ovAnchor(d){const q=clubSeq(d);return q.length&&has(q[0].ovr)&&has(q[0].val)?q[0]:null}
/* 시즌 종합 점수: 통계(기존 선수 분포와 비교) · 개인수상 · 팀 우승 */
function seasonScore(s,c,gkf,pi,grpName,dom){
  const g=num(s.g),parts=[];
  if(num(s.rt)>0)parts.push([pct(REF.rt,num(s.rt)),.5]);
  if(g>0){
    if(gkf){const cs=has(s.cs)?num(s.cs)/g:null,ga=has(s.ga)?num(s.ga)/g:null;
      if(cs!=null||ga!=null)parts.push([((cs!=null?.6*pct(REF.GKcs,cs):0)+(ga!=null?.4*(1-pct(REF.GKga,ga)):0))/((cs!=null?.6:0)+(ga!=null?.4:0)),.3])}
    else if(has(s.gl)||has(s.as))parts.push([pct(REF[grpName],(num(s.gl)+num(s.as))/g),.3]);
    const pf=perfIdx(s,pi);if(pf!=null)parts.push([clamp((pf+1)/2,0,1),.2]);
  }
  let stat=null;if(parts.length){const w=parts.reduce((t,x)=>t+x[1],0);stat=parts.reduce((t,x)=>t+x[0]*x[1],0)/w}
  let tm=0;(s.tr||[]).forEach(t=>{if(TR_REC.indexOf(t)>=0)return;let w=TW[t];if(w==null)w=dom[0]===t?.35:dom[1]===t?.15:.07;tm+=w});tm=Math.min(1,tm);
  const ws=(s.aw||[]).map(a=>AWW[awType(a)]||0.2).sort((x,y)=>y-x);
  const aw=ws.length?Math.min(1,ws[0]+.15*(ws.slice(1).reduce((t,x)=>t+x,0))):0;
  return{stat:stat,tm:tm,aw:aw};

/* OVR → 그 OVR에서 기대되는 시즌 성적 점수(0~1). seasonScore의 분포(기존 선수 기준)와 맞춘 역변환표 */
const O2S=[[55,0],[68,.1],[74,.2],[79,.3],[83,.4],[86,.5],[89,.6],[91,.7],[93,.8],[95,.9],[97,.96],[98,.985],[99,1]];
const expScore=o=>lerpT(O2S,o);
function seasonCtx(d){const m=new Map();d.careers.forEach(c=>{const co=(cfgIdx().lg2co||{})[c.league];c.seasons.forEach(s=>m.set(s,{c:c,dom:c.kind==='nat'?[]:(co?(TR_DOM[co.n]||[]):[])}))});return m}
function natByAge(d){const m={};d.careers.forEach(c=>{if(c.kind==='nat')c.seasons.forEach(s=>{(m[s.a]=m[s.a]||[]).push(s)})});return m}
/* 시즌 성과: 클럽 스탯 + 같은 나이 국가대표 스탯(경기수 가중) + 개인 수상 + 팀 우승 */
function perfOf(d,s,ctx,nb){
  const gkf=d.pos==='GK',pi=PI[d.pos]==null?3:PI[d.pos],gname=GRP[d.pos]||'MF',ci=ctx.get(s)||{c:null,dom:[]};
  const sc=seasonScore(s,ci.c,gkf,pi,gname,ci.dom),parts=[];let aw=sc.aw,tm=sc.tm;
  if(sc.stat!=null)parts.push([sc.stat,Math.max(1,num(s.g))]);
  ((nb||{})[s.a]||[]).forEach(ns=>{const n=seasonScore(ns,null,gkf,pi,gname,[]);if(n.stat!=null)parts.push([n.stat,1.5*Math.max(1,num(ns.g))]);aw=Math.max(aw,n.aw);tm=Math.min(1,tm+n.tm)});
  const w=parts.reduce((t,x)=>t+x[1],0);

}
/* 성과가 그 시즌 OVR에서 기대되는 수준보다 얼마나 좋았는가 (+이면 기대 이상) */

const PRIME_W=a=>a<=21?.12:a<=23?.9:a<=29?2:a===30?1:a<=32?.4:a===33?.15:.02;

function ovTraj(d,seq,userO,M,lo){
  lo=lo||0;
  const n=seq.length,ages=seq.map(s=>num(s.a)),rnd=mulberry(hstr(d.name+'|ovt|'+GSEED())),ctx=seasonCtx(d);
  const topCap=Math.max(M-1,lo);
  const anch=[];seq.forEach((s,i)=>{if(userO.has(s))anch.push({i:i,o:num(s.ovr)})});
  if(!anch.length||anch[0].i!==0)return{err:'첫 시즌의 OVR이 필요합니다.'};
  let warn='';
  if(!anch.some(x=>x.o>=M)){
    /* 앞뒤 입력값과 이어질 수 있는 시즌만 후보: 연 +4.5 이하 상승, 연 -3 이하 하락. 개인 수상·우승이 많은 시즌일수록 최고 시즌이 될 가능성이 높다 */
    const feas=i=>{let pr=anch[0],nx=null;anch.forEach(x=>{if(x.i<i)pr=x;else if(x.i>i&&!nx)nx=x});
      const g=(M-pr.o)/Math.max(1,ages[i]-ages[pr.i]);if(g>4.5)return .002;
      if(nx&&(M-nx.o)/Math.max(1,ages[nx.i]-ages[i])>3)return .002;return 1};
    const hon=i=>{const ci=ctx.get(seq[i]),sc=seasonScore(seq[i],null,false,0,'MF',ci?ci.dom:[]);return Math.min(1,.6*sc.aw+.4*sc.tm)};
    const cand=[];for(let i=anch[0].i+1;i<n;i++)if(!userO.has(seq[i])&&!seq[i].inj)cand.push([i,PRIME_W(ages[i])*feas(i)*(1+2.5*hon(i))]);
    if(!cand.length){for(let i=1;i<n;i++)if(!userO.has(seq[i]))cand.push([i,PRIME_W(ages[i])*feas(i)])}
    if(cand.length){
      const tot=cand.reduce((t,c)=>t+c[1],0);let u=rnd()*tot,pk=cand[cand.length-1][0];
      for(const c of cand){u-=c[1];if(u<=0){pk=c[0];break}}
      anch.push({i:pk,o:M});anch.sort((x,y)=>x.i-y.i);
    }else warn='최대 OVR을 달성할 수 있는 시즌이 없어 첫 시즌 기준으로만 생성했습니다.';
  }
  const out=new Array(n).fill(null);anch.forEach(x=>{out[x.i]=x.o});
  const pkI=anch.filter(x=>x.o>=M).map(x=>x.i)[0];

      const t=(ages[i]-a1)/(a2-a1),young=a1<=21;
      const f=dl>=0?1-Math.pow(1-t,young?1.7:1.25):Math.pow(t,1.35);

      else{o=Math.min(prev,Math.round(o));if(rnd()<.08)o=prev+1}
      o=clamp(o,Math.max(40,lo),Math.max(B.o,A.o)+(dl>=0?0:1));
      if(dl>=0)o=Math.min(o,prev+(ages[i]<=19?6:5));
      if(i!==pkI)o=Math.min(o,topCap);
      o=Math.max(o,lo);
      out[i]=o;prev=o;
    }
  }
  const L=anch[anch.length-1];let cur=L.o;
  for(let i=L.i+1;i<n;i++){
    cur=cur-Math.max(0,DECL(ages[i])+gauss(rnd)*.55);
    out[i]=Math.max(Math.min(Math.round(cur),topCap),Math.max(40,lo));
  }
  return{o:out,warn:warn};
}
/* 몸값: OVR·나이 기준표 × 직전 시즌 대비 변화 제한. 스탯(클럽+대표팀)·수상·우승 성과가 있으면 반영 */
function valPass(d,seq,userV,final){
  const ctx=seasonCtx(d),nb=natByAge(d);
  const P=seq.map(s=>final?perfOf(d,s,ctx,nb):null);
  const S_=P.map(p=>p&&p.stat!=null?.5*p.stat+.25*p.aw+.25*p.tm:null);
  const ks=S_.filter(x=>x!=null),mean=ks.length?ks.reduce((a,b)=>a+b,0)/ks.length:null;
  let pv=Math.max(.1,num(seq[0].val));
  for(let i=1;i<seq.length;i++){
    const s=seq[i];
    if(userV.has(s)){pv=Math.max(.1,num(s.val));continue}
    let tv=lerpT(O2V,num(s.ovr))*ageVM(num(s.a));
    if(final&&P[i]){
      let f=0;
      if(S_[i]!=null&&mean!=null)f+=.5*clamp(S_[i]-mean,-.3,.3);
      if(!s.inj)f+=.4*clamp(perfResid(P[i],num(s.ovr)),-.25,.3);
      tv*=Math.exp(f);
    }
    const v=clamp(clamp(tv,pv*.55,pv*2.3),.1,400);
    s.val=fmtVal(v);markAuto(s,'val');pv=num(s.val)||v;
  }
}
/* 최종 OVR: 최대 OVR 시즌(1회)과 직접 입력값은 고정하고, 나머지는 '이전 시즌 성과'에 따라 오르내린다.
   이전 시즌 성과가 OVR 기대치보다 크게 좋으면 크게 상승, 비슷하거나 조금 좋으면 소폭 상승, 조금 나쁘면 유지, 많이 나쁘면 하락.
   최소~최대 OVR 범위를 벗어나지 않고, 이후 고정 시즌(최대 OVR 등)에 자연스럽게 이어질 수 있는 범위로 제한한다. */
function ovrFinal(d,seq,fixed,M,lo){
  const n=seq.length,ages=seq.map(s=>+s.a),ctx=seasonCtx(d),nb=natByAge(d);
  const base=seq.map(s=>num(s.ovr)),fx=seq.map((s,i)=>fixed.has(s)||base[i]>=M);
  /* 성과 잔차: 경기수가 적은 시즌은 신뢰도를 낮추고(표본 부족), 선수 본인의 평균 잔차로 일부 보정(생성 기준과 기대치의 편차 제거) */
  const raw=seq.map((s,i)=>{if(s.inj)return null;const p=perfOf(d,s,ctx,nb),gg=num(s.g)+1.5*((nb[s.a]||[]).reduce((t,x)=>t+num(x.g),0));return perfResid(p,base[i])*Math.min(1,gg/22)});
  const ok=raw.filter(x=>x!=null),mean=ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:0;
  const rs=raw.map(x=>x==null?0:x-.6*mean);

  for(let i=1;i<n;i++){
    if(fx[i])continue;
    const prev=out[i-1],rp=rs[i-1],dB=base[i]-base[i-1],a=ages[i];
    let step;
    if(rp>=.24)step=Math.max(dB+2,3);                                  /* 이전 시즌 성과가 기대보다 크게 좋음 → 크게 상승 */
    else if(rp>=.10)step=Math.max(dB+1,2);                             /* 좋음 → 상승 */
    else if(rp>=-.06)step=a<=31?Math.max(dB,1):dB;                     /* 비슷하거나 조금 좋음 → 소폭 상승 */
    else if(rp>=-.16)step=a<=21?Math.min(dB,1):(a<=33?0:dB);           /* 조금 나쁨 → 유지 */
    else step=a<=21?Math.min(dB,0):Math.min(dB,-1)-(rp<-.30?1:0);      /* 많이 나쁨 → 하락 */
    let v=clamp(prev+step,prev-4,prev+G(a)),lw=Math.max(lo,40),hi=topCap;
    let nx=-1;for(let j=i+1;j<n;j++)if(fx[j]){nx=j;break}
    /* 기본 곡선(나이·최대 OVR 시즌)에서 벗어날 수 있는 폭: 고정 시즌에 가까울수록 좁게 */
    const dist=nx>=0?nx-i:9;
    lw=Math.max(lw,base[i]-Math.min(3,dist));hi=Math.min(hi,base[i]+2);
    if(nx>=0){const gap=ages[nx]-a;lw=Math.max(lw,out[nx]-G(a)*gap);hi=Math.min(hi,out[nx]+Dn*gap)}
    if(lw>hi)lw=hi;
    out[i]=clamp(Math.round(v),lw,hi);
  }
  seq.forEach((s,i)=>{if(!fixed.has(s)&&base[i]<M&&out[i]!==base[i]){s.ovr=String(out[i]);markAuto(s,'ovr')}});
}
function ovvalPass(d,userO,userV,kind,M,lo){
  const seq=clubSeq(d);
  if(kind==='prelim'){
    const r=ovTraj(d,seq,userO,M,lo);if(r.err)return r;
    seq.forEach((s,i)=>{if(!userO.has(s)&&r.o[i]!=null){
      /* 개인 수상·우승이 많은 시즌은 +1 (최대 OVR 미만) */
      const sc=seasonScore(s,null,false,0,'MF',[]);let o=r.o[i];
      if(sc.aw+sc.tm>=.7&&o<M-1&&o>=num(seq[0].ovr))o+=1;
      s.ovr=String(Math.max(o,lo||0));markAuto(s,'ovr')}});
    valPass(d,seq,userV,false);
    return r;
  }
  if(kind==='ovr'){ovrFinal(d,seq,userO,M,lo||0);return{}}
  valPass(d,seq,userV,true);
  return{};
}
/* 자동 생성 한 번에. scope='club': 클럽 OVR · 몸값 · 스탯 (국가대표 값은 건드리지 않음, 대표팀 성적은 OVR 계산에 반영)
   scope='nat': 국가대표 스탯만 (클럽 값은 건드리지 않음). 오류가 나면 아무 값도 바꾸지 않는다. 직접 입력한 값은 항상 유지 */
function autoAll(d,mode,scope){
  scope=scope==='nat'?'nat':'club';
  const all=mode==='all',snap=JSON.parse(JSON.stringify(d.careers));
  const fail=m=>{d.careers=snap;return{n:0,err:m}};
  if(scope==='nat'){
    if(!d.careers.some(c=>c.kind==='nat'&&c.seasons.length))return{n:0,err:'국가대표 나이별 칸이 없습니다. 입단 나이와 활동 기간을 먼저 입력하세요.'};
    if(all)S.genSeed++;
    carryAll(d.careers);
    const g=autoGen(d,all,'nat');if(g.err)return fail(g.err);
    carryAll(d.careers);syncAggAuto(d,'nat',true);
    return{n:g.n,err:'',warn:g.flipped?`합계 경기수에 맞추기 위해 국제대회 시즌 ${g.flipped}개를 추가로 지정했습니다.`:''};
  }
  const seq=clubSeq(d);
  if(!seq.length)return{n:0,err:'클럽 경력의 나이별 칸이 없습니다. 클럽을 선택하고 활동 기간을 입력하세요.'};
  const f=seq[0],M=num(d.ovr0),lo=has(d.ovrMin)?num(d.ovrMin):0;
  if(!(M>0))return{n:0,err:'선수 정보의 ‘최대 OVR’을 먼저 입력하세요.'};
  if(M>99)return{n:0,err:'최대 OVR은 99 이하로 입력하세요.'};
  if(lo>M)return{n:0,err:`최소 OVR(${lo})이 최대 OVR(${M})보다 높습니다.`};
  if(!has(f.ovr)||!has(f.val))return{n:0,err:`첫 시즌(${f.a}세)의 OVR과 몸값을 먼저 입력하세요.`};
  if(M<num(f.ovr))return{n:0,err:`최대 OVR(${M})이 첫 시즌 OVR(${num(f.ovr)})보다 낮습니다.`};
  const userO=new Set(),userV=new Set(),out=s=>has(s.ovr)&&(num(s.ovr)>M||(lo>0&&num(s.ovr)<lo));
  seq.forEach(s=>{

    if(s===f||keepO)userO.add(s);

  for(const s of userO){if(out(s))return{n:0,err:`${s.a}세 OVR(${num(s.ovr)})이 최소~최대 OVR 범위(${lo||'–'}~${M})를 벗어났습니다. 먼저 바로잡아 주세요.`}}
  if(all)S.genSeed++;
  const r=ovvalPass(d,userO,userV,'prelim',M,lo);if(r.err)return fail(r.err);
  carryAll(d.careers);
  const g=autoGen(d,all,'club');if(g.err)return fail(g.err);
  carryAll(d.careers);
  ovvalPass(d,userO,userV,'ovr',M,lo);
  carryAll(d.careers);
  ovvalPass(d,userO,userV,'final',M,lo);
  carryAll(d.careers);syncAggAuto(d,'club',true);
  return{n:g.n,err:'',warn:r.warn||''};
}
/* 자동 생성된 값만 지우기 (scope: club | nat) */
function clearAuto(d,scope){
  let n=0;
  d.careers.forEach(c=>{
    if(scope==='club'&&c.kind==='nat')return;if(scope==='nat'&&c.kind!=='nat')return;
    c.seasons.forEach(s=>{(s.au||[]).forEach(k=>{if(has(s[k])){s[k]='';n++}});s.au=[]});
    (c.aau||[]).forEach(k=>{if(has(c.agg[k])){c.agg[k]='';n++}});c.aau=[];
  });
  return n;
}
/* ---------- 합계 칸 자동 입력 (자동 표시) ---------- */
const AGGK=gk=>gk?['g','cs','ga','rt']:['g','gl','as','rt'];
function aggSum(c,k){
  const ss=c.seasons||[];
  if(k==='rt'){const r=ss.map(s=>num(s.rt)).filter(v=>v>0);return r.length?Math.round(r.reduce((a,b)=>a+b,0)/r.length*100)/100:0}
  return ss.reduce((t,s)=>t+num(s[k]),0);
}
/* 자동 입력된 합계 칸을 시즌 합과 맞춘다. adopt=true(자동 생성 직후)면 비어 있는 합계 칸도 자동 입력한다. 사용자가 직접 입력/수정한 칸은 건드리지 않는다 */
function syncAggAuto(d,scope,adopt){
  const gk=d.pos==='GK';
  d.careers.forEach(c=>{
    if(scope&&((scope==='nat')!==(c.kind==='nat')))return;
    c.aau=c.aau||[];
    AGGK(gk).forEach(k=>{
      const isA=c.aau.indexOf(k)>=0;
      if(!isA&&!(adopt&&!has(c.agg[k])))return;
      const v=aggSum(c,k);
      if(v>0){c.agg[k]=String(v);if(!isA)c.aau.push(k)}else if(isA)c.agg[k]='';
    });
  });

/* 국적에 맞는 이름 하나를 무작위로 만든다. taken: 이미 쓰인 이름(대문자) 집합 */
function randomName(nation,taken){
  const g=NGRP[nation]||'en',P=NPOOL[g];
  for(let i=0;i<60;i++){
    const sn=rpick(P[0]).replace(/-/g,' ');let nm;
    if(g==='kr')nm=`${sn} ${rpick(P[1])} ${rpick(P[2])}`;
    else if(g==='jp'||g==='cn'||g==='vn'||g==='th'){const fn=rpick(P[1]);nm=Math.random()<.6?`${sn} ${fn}`:`${fn.charAt(0)}.${sn}`}
    else{const fn=rpick(P[1]),u=Math.random();nm=u<.45?sn:u<.75?`${fn.charAt(0)}.${sn}`:`${fn} ${sn}`}
    if(!taken||!taken.has(nm))return nm;
  }
  return rpick(P[0]).replace(/-/g,' ');
}

function natSum(p){
  const o={g:0,gl:0,as:0,cs:0,ga:0,rt:0,t:0,caps:[]},r=[];
  nats(p).forEach(c=>{const s=cst(c);SUMK.forEach(k=>{o[k]+=s[k]});if(s.rt>0)r.push(s.rt);
    (c.seasons||[]).forEach(se=>(se.tr||[]).forEach(t=>{if(TR_REC.indexOf(t)<0)o.t++}));(c.lt||[]).forEach(t=>{o.t+=num(t.c)});
    capText(c).forEach(t=>o.caps.push(t))});
  o.rt=r.length?r.reduce((a,b)=>a+b,0)/r.length:0;return o;
}
function ensureCmp(){
  if(S.players.length<2)return;
  const top=S.players.slice().sort((x,y)=>num(y.ovr)-num(x.ovr));
  if(!byId(S.a)||S.a===S.b){const c=top.find(p=>p.id!==S.b);S.a=c.id}
  if(!byId(S.b)||S.b===S.a){const c=top.find(p=>p.id!==S.a);S.b=c.id}
}
/* 범위별 집계: all(통산) · club · nat · age:N */
function cmpAgg(p,scope){
  const o={g:0,gl:0,as:0,cs:0,ga:0,rt:0,det:{},ovr:0,val:0,tr:0,aw:0},rts=[];
  if(scope.indexOf('age:')===0){
    const A=+scope.slice(4);
    clubsOf(p).forEach(c=>(c.seasons||[]).forEach(s=>{
      if(+s.a!==A)return;
      SUMK.forEach(k=>{o[k]+=num(s[k])});if(num(s.rt)>0)rts.push(num(s.rt));
      DETK.forEach(k=>{if(k!=='cs'&&k!=='ga')o.det[k]=(o.det[k]||0)+num(s[k])});
      o.ovr=Math.max(o.ovr,num(s._o||s.ovr));o.val=Math.max(o.val,num(s._v||s.val));
      o.tr+=(s.tr||[]).filter(t=>TR_REC.indexOf(t)<0).length;o.aw+=(s.aw||[]).length}));
  }else{
    const list=scope==='club'?clubsOf(p):scope==='nat'?nats(p):(p.careers||[]);
    list.forEach(c=>{
      const st=cst(c);SUMK.forEach(k=>{o[k]+=st[k]});if(st.rt>0)rts.push(st.rt);
      Object.keys(st.det).forEach(k=>{o.det[k]=(o.det[k]||0)+st.det[k]});
      o.ovr=Math.max(o.ovr,st.ovr);o.val=Math.max(o.val,st.val);
      (c.seasons||[]).forEach(s=>{o.tr+=(s.tr||[]).filter(t=>TR_REC.indexOf(t)<0).length;o.aw+=(s.aw||[]).length});
      (c.lt||[]).forEach(t=>{o.tr+=num(t.c)});
    });
    if(scope==='all'||scope==='club'){o.aw+=Object.keys(p.awx||{}).reduce((t,k)=>t+num(p.awx[k]),0)}
    if(scope==='all'){o.ovr=num(p.ovr);o.val=num(p.value)}
  }
  o.rt=rts.length?rts.reduce((a,b)=>a+b,0)/rts.length:0;
  o.min=num(o.det.min);
  return o;
}

  return secs;
}

function seasonText(c){

    (c.lt||[]).forEach(t=>{if(num(t.c)>0)m[t.n]=(m[t.n]||0)+num(t.c)});

async function exportPlayers(list,filename){
  if(!list.length){toast('변환할 선수가 없습니다.');return}
  try{
    const out=makeXlsx(buildBook(list));
    const dl=await window.claude.use('downloads');
    if(!dl){toast('이 화면에서는 파일 저장을 사용할 수 없습니다.');return}
    await dl.save({filename:filename,data:out});
    toast('엑셀 파일을 저장했습니다.');
  }catch(e){
    if(e&&e.code==='declined')return;
    toast((e&&e.message)||'엑셀 변환에 실패했습니다.');
  }
}

function ageConflict(d,ci){

  const oob=mine.filter(a=>a<AGE_MIN||a>AGE_MAX);
  if(oob.length)return `나이는 ${AGE_MIN}세부터 ${AGE_MAX}세까지 입력할 수 있습니다. (${oob.slice(0,3).join(', ')}세${oob.length>3?' 외':''})`;
  if(c.kind==='nat')return '';
  for(let j=0;j<d.careers.length;j++){

function stintChange(ci,kf){
  capture();S.stTok=(S.stTok||0)+1;const tok=S.stTok;
  const d=S.draft,c=d.careers[ci],old=c._ps||[],nw=c.stints;
  let idx=-1;
  if(old.length===nw.length)for(let i=0;i<nw.length;i++){if(old[i].s!==nw[i].s||old[i].y!==nw[i].y){idx=i;break}}
  const os=idx>=0&&num(old[idx].s)>0?Math.floor(num(old[idx].s)):null,oe=idx>=0?stEnd(old[idx],c.kind!=='nat'):null;
  const ns=idx>=0&&num(nw[idx].s)>0?Math.floor(num(nw[idx].s)):null,ne=idx>=0?stEnd(nw[idx],c.kind!=='nat'):null;
  setTimeout(()=>{
    if(tok!==S.stTok)return;

        x.stints.forEach((t,ti)=>{if(xi===ci&&ti===idx)return;const st=Math.floor(num(t.s));if(num(t.s)>0&&st>oe)t.s=String(st+delta)});
        x.seasons.forEach(se=>{const a=+se.a;if(xi===ci&&a>=os&&a<=oe)se.a=a+mv;else if(a>oe)se.a=a+delta});

    for(let i=0;i<trial.length&&!err;i++){const e=ageConflict(tmp,i);if(e)err=(trial[i].kind==='nat'?'국가대표':trial[i].club)+': '+e}
    if(err){toast(err);c.stints=JSON.parse(JSON.stringify(old.length?old:[{s:'',y:''}]));c.ages=stintsToAges(c.stints,c.kind!=='nat');draw();return}
    const b=tc.seasons.filter(seasonHas).length;

}

function validateDraft(d){
  CYC=natCycle(d);
  const errs=[],keys=new Set();
  const add=(k,m)=>{if(k)keys.add(k);if(m)errs.push(m)};
  const mn=has(d.ovrMin)?num(d.ovrMin):null,mx=has(d.ovr0)?num(d.ovr0):null;
  if(mn!=null&&(mn<0||mn>99))add('ovrMin','최소 OVR은 0~99 사이로 입력하세요.');
  if(mx!=null&&mx>99)add('ovr0','최대 OVR은 99 이하로 입력하세요.');
  if(mn!=null&&mx!=null&&mn>mx){add('ovrMin',`최소 OVR(${mn})이 최대 OVR(${mx})보다 높습니다.`);add('ovr0','')}
  d.careers.forEach((c,ci)=>{
    const nt=c.kind==='nat';
    c.seasons.forEach((s,si)=>{
      const pf='careers.'+ci+'.seasons.'+si+'.',lb=`${nt?'국가대표':c.club} ${s.a}세`,g=num(s.g);
      if(!nt&&has(s.ovr)){
        const v=num(s.ovr);
        if(mn!=null&&v<mn)add(pf+'ovr',`${lb}: OVR ${v}은(는) 최소 OVR ${mn}보다 낮아 저장할 수 없습니다.`);
        else if(mx!=null&&v>mx)add(pf+'ovr',`${lb}: OVR ${v}은(는) 최대 OVR ${mx}보다 높아 저장할 수 없습니다.`);
      }
      if(!nt&&g>70)add(pf+'g',`${lb}: 클럽 경기수는 1년에 최대 70경기입니다.`);
      if(nt){const cap=natCapOf(s);if(g>cap)add(pf+'g',`${lb}: 국제대회가 ${natIntl(s)?'있는':'없는'} 시즌은 대표팀 경기수가 최대 ${cap}경기입니다.${natIntl(s)?'':' (국제대회 시즌이라면 ‘기타’에서 ‘국제대회 참가’를 켜 주세요)'}`)}
      if(has(s.min)&&num(s.min)>0){
        const m=num(s.min),mxg=nt?(natIntl(s)?120:100):120;
        if(!(g>0))add(pf+'min',`${lb}: 경기수가 0인데 출전 시간이 입력되어 있습니다.`);
        else if(m<g)add(pf+'min',`${lb}: 출전 시간은 1경기당 최소 1분입니다. (${g}경기 → ${g}분 이상)`);
        else if(m>g*mxg)add(pf+'min',`${lb}: 출전 시간이 경기수에 비해 너무 큽니다. (1경기 최대 ${mxg}분 → ${g*mxg}분 이하)`);
      }
    });
  });
  return{errs:errs,keys:keys};
}
/* 합계 입력과 연도별 합이 맞는지 안내 */
function aggCheck(c,gk){
  const ag=c.agg||{},keys=gk?['g','cs','ga','rt']:['g','gl','as','rt'],LB={g:'경기',gl:'골',as:'어시',cs:'클린시트',ga:'실점',rt:'평점'};
  const act=keys.filter(k=>num(ag[k])>0&&(c.aau||[]).indexOf(k)<0);
  if(!act.length||!c.seasons.some(s=>keys.some(k=>has(s[k]))))return '';
  const diff=[];

    let sum,tgt=num(ag[k]);
    if(k==='rt'){const r=c.seasons.map(s=>num(s.rt)).filter(v=>v>0);sum=r.length?r.reduce((a,b)=>a+b,0)/r.length:0;if(Math.abs(sum-tgt)>=.005)diff.push(`${LB[k]} ${Math.round(sum*100)/100}/${tgt}`)}

  return diff.length?`<div class="hint" style="color:var(--bad)">연도별 합이 입력한 합계와 다릅니다 (연도별/합계): ${diff.join(' · ')} — ‘자동 생성’ 또는 ‘다시 설정’을 누르면 합계에 맞춰 다시 나눕니다.</div>`:`<div class="hint" style="color:var(--good,#2a9d6f)">✓ 연도별 합이 입력한 합계와 정확히 일치합니다.</div>`;
}

async function save(){
  const d=S.draft;S.formErr='';
  if(!d.name.trim())S.formErr='이름을 입력하세요.';
  else if(!d.nation.trim())S.formErr='국적을 선택하세요.';
  if(!S.formErr){
    for(let i=0;i<d.careers.length&&!S.formErr;i++){
      const c=d.careers[i],e=ageConflict(d,i);
      if(e)S.formErr=(c.kind==='nat'?'국가대표':c.club)+': '+e;
      else{
        const oob=c.seasons.find(s=>seasonHas(s)&&(+s.a<AGE_MIN||+s.a>AGE_MAX));
        if(oob)S.formErr=`${c.kind==='nat'?'국가대표':c.club} ${oob.a}세: 나이는 ${AGE_MIN}~${AGE_MAX}세만 가능합니다. 해당 나이 칸을 삭제해 주세요.`;
      }
    }
    if(!S.formErr){const ve=validateDraft(d).errs;if(ve.length)S.formErr=ve[0]+(ve.length>1?` (외 ${ve.length-1}건)`:'')}
  }
  if(S.formErr){render();return}
  if(!DB||!S.col){S.formErr='데이터베이스에 연결되지 않았습니다. 로그인 상태를 확인하세요.';render();return}
  S.saving=true;
  try{
    const doc=buildDoc();delete doc.trophyMap;delete doc.det;delete doc.capN;let id=d.id;
    doc.careers.forEach(c=>c.seasons.forEach(s=>{delete s._o;delete s._co;delete s._v;delete s._cv;delete s._s;delete s._cs}));
    const clean=JSON.parse(JSON.stringify(doc));
    if(id)await DB.doc(S.col+'/'+id).set(clean);else{const ref=await DB.collection(S.col).add(clean);id=ref.id}
    const local=derive(Object.assign({id:id},JSON.parse(JSON.stringify(clean))));
    S.players=S.players.filter(p=>p.id!==id).concat([local]);
    S.saving=false;S.draft=null;S.preview=false;S.pid=id;S.view='detail';S.tab='overview';toast('저장했습니다. 등록한 선수 화면으로 이동했습니다.');render();window.scrollTo(0,0);
  }catch(e){S.saving=false;S.formErr='저장하지 못했습니다. '+((e&&e.message)||'');render()}
}
/* 내 클럽 목록(직접 추가한 클럽)을 설정에 병합 */
function applyCfg(){
  if(!S.cfg0)return;
  const cfg=JSON.parse(JSON.stringify(S.cfg0));
  ((S.meta&&S.meta.clubs)||[]).forEach(x=>cfg.countries.forEach(co=>co.leagues.forEach(l=>{if(l.n===x.l&&!(l.c||[]).concat(l.x||[]).includes(x.n))l.x=(l.x||[]).concat([x.n])})));
  S.cfg=cfg;
}
async function saveClubToCfg(league,name){
  S.meta=S.meta||{};S.meta.clubs=(S.meta.clubs||[]).concat([{l:league,n:name}]);applyCfg();
  try{await DB.doc(S.col+'/_meta').set(JSON.parse(JSON.stringify(S.meta)))}catch(e){toast('클럽을 저장하지 못했습니다. 이 선수에게만 적용됩니다.')}
}
async function importSeed(){
  try{
    const seed=S.seed||[];
    await Promise.all(seed.map(x=>DB.doc(S.col+'/'+x.id).set(x.data)));
    S.meta=Object.assign({},S.meta,{imported:true});await DB.doc(S.col+'/_meta').set(JSON.parse(JSON.stringify(S.meta)));
    S.importAvail=0;toast(seed.length+'명을 내 목록으로 가져왔습니다.');
  }catch(e){toast('가져오지 못했습니다: '+((e&&e.message)||''))}
}
async function skipSeed(){
  S.importAvail=0;renderList();render();
  try{S.meta=Object.assign({},S.meta,{imported:true});await DB.doc(S.col+'/_meta').set(JSON.parse(JSON.stringify(S.meta)))}catch(e){}

  if(e.key==='Escape'){if(S.preview){S.preview=false;render()}else if(S.cmp.pick){S.cmp.pick=null;render()}}
  if(e.key==='Enter'&&e.target.hasAttribute){
    if(e.target.hasAttribute('data-ages')){e.preventDefault();capture(true);applyAges(+e.target.getAttribute('data-ages'),true)}
    else if(e.target.hasAttribute('data-stint')){e.preventDefault();stintChange(+e.target.getAttribute('data-stint'),false)}
  }
});
document.addEventListener('change',e=>{
  if(S.inR)return;
  const id=e.target.id;
  if(id==='sort'){S.sort=e.target.value;S.page=0;renderList()}
  else if(id==='cmpnat'){S.cmp.nat=e.target.value;render()}
  else if(id==='cmpage'){S.cmp.age=e.target.value;render()}
  else if(id==='f-pos'&&S.view==='register'){capture();render()}
  else if(id==='awType'){S.awSel.type=e.target.value;render()}
  else if(id==='awScope'){S.awSel.scope=e.target.value}
  else if(S.view==='register'&&S.draft&&e.target.hasAttribute('data-ages')){capture(true);applyAges(+e.target.getAttribute('data-ages'),true,true)}
  else if(S.view==='register'&&S.draft&&e.target.hasAttribute('data-stint')){stintChange(+e.target.getAttribute('data-stint'),true)}
  else if(S.view==='register'&&S.draft&&(/\.(ovr|val|g|min)$/.test(e.target.getAttribute('data-f')||'')||['ovr0','ovrMin'].indexOf(e.target.getAttribute('data-f'))>=0)){capture();renderKF()}
  else if(S.view==='register'&&S.draft&&e.target.hasAttribute('data-rerender')){capture();render()}
});

/* ---------- boot: 로그인한 사용자별 저장 공간 ---------- */
(async function boot(){
  render();
  if(window.__auth){await window.__auth.ready;if(!window.__auth.logged){S.loginNeeded=true;S.loaded=true;render();return}}
  try{DB=await window.claude.use('db')}catch(e){DB=null}
  let U=null;
  try{U=await window.claude.use('user')}catch(e){}
  if(U){try{S.uid=await U.id()}catch(e){}
    try{const me=await U.me();S.uname=(me&&me.name)||''}catch(e){}}
  if(!DB){S.err='claude.ai에 로그인한 상태로 발행된 링크를 열어야 선수 데이터를 저장하고 불러올 수 있습니다.';S.loaded=true;render();return}
  if(!S.uid){S.err='이 계정에서는 개인 저장 공간을 사용할 수 없습니다. claude.ai 계정으로 로그인해 주세요.';S.loaded=true;render();return}
  S.col='data/users/'+S.uid;render();
  const fail=e=>{S.err=(e&&e.message)||'연결에 실패했습니다.';S.loaded=true;render()};
  const upd=()=>{S.importAvail=(!S.meta||!S.meta.imported)&&S.seed&&S.seed.length&&S.players.length===0?S.seed.length:((!S.meta||!S.meta.imported)&&S.seed&&S.seed.length?S.seed.length:0);};
  DB.collection(S.col).onSnapshot(snap=>{
    const mine=[];let meta=null;
    snap.docs.forEach(d=>{if(d.id==='_meta'){meta=d.data()}else if(d.id.charAt(0)!=='_')mine.push(derive(Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data())))))});
    S.players=mine;S.meta=meta?JSON.parse(JSON.stringify(meta)):(S.meta||{});S.loaded=true;applyCfg();upd();
    if(S.view==='home')render();else if(S.view!=='register')render();
  },fail);
  DB.doc('config/app').onSnapshot(s=>{
    const first=!S.cfg;S.cfg0=s.exists?JSON.parse(JSON.stringify(s.data())):{countries:[]};applyCfg();
    if(first&&S.view==='register')render();
  },fail);
  try{
    DB.collection('players').onSnapshot(snap=>{
      S.seed=snap.docs.map(d=>({id:d.id,data:JSON.parse(JSON.stringify(d.data()))}));upd();if(S.view==='home')render();
    },()=>{S.seed=[]});
  }catch(e){S.seed=[]}
  window.__S=S;
})();
})();
</script>
