<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COPERO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column (max 880px). Top bar with wordmark and tab nav, then a list/detail/compare/form view. Dark pitch-ink ground, green accent, condensed numerals. */
:root{
  --bg:#0E1116; --surface:#171B22; --surface2:#1F2630; --line:#262D38;
  --fg:#EEF1F5; --muted:#9099A8; --accent:#2FD38A; --on-accent:#06281A; --accent-soft:#16221D;
  --gold:#E6B84A; --gold-soft:#2A2414; --warn:#E5A23C; --warn-soft:#2D2416; --bad:#E0674F;
  --bar-lose:#3A4350;
  --sky:#5CC8FF; --sky-soft:#12283A; --pur:#C08BFF; --pur-soft:#261A3A; --gld:#FFD24A; --gld-soft:#3A2E10;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E8ECF1; --line:#D9DFE7;
    --fg:#12161C; --muted:#586272; --accent:#087A4C; --on-accent:#FFFFFF; --accent-soft:#E0F2E9;
    --gold:#8A5F00; --gold-soft:#FBF1D6; --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B23A24;
    --bar-lose:#C2CAD6; --sky:#0A6FA8; --sky-soft:#DDF1FF; --pur:#6A2FB8; --pur-soft:#EDE0FF; --gld:#7A5200; --gld-soft:#FFEFB8; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E8ECF1; --line:#D9DFE7;
  --fg:#12161C; --muted:#586272; --accent:#087A4C; --on-accent:#FFFFFF; --accent-soft:#E0F2E9;
  --gold:#8A5F00; --gold-soft:#FBF1D6; --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B23A24;
  --bar-lose:#C2CAD6; --sky:#0A6FA8; --sky-soft:#DDF1FF; --pur:#6A2FB8; --pur-soft:#EDE0FF; --gld:#7A5200; --gld-soft:#FFEFB8; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:880px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.top{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:8px;padding-block:10px 6px;position:sticky;top:0;z-index:45;background:var(--bg);border-bottom:1px solid transparent}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0 8px}
.pager .btn{min-width:84px}
.pager span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.hero .xl{margin-left:auto;align-self:flex-start}
.rtabs{display:flex;gap:6px;padding:4px 0 12px;position:sticky;top:var(--hh,64px);z-index:30;background:var(--bg)}
.rtabs .tab{flex:1;padding:0 8px;border-radius:12px;min-width:0}
.logo{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.08em;line-height:1;background:none;border:none;padding:6px 0;min-height:44px;color:var(--fg)}
.logo span{color:var(--accent)}
.top .logo{justify-self:center}
.menubtn{width:48px;height:48px;display:grid;place-items:center;border:none;background:none;color:var(--fg);border-radius:14px;padding:0}
.menubtn:hover{background:var(--surface2)}
.chip .cn{margin-left:7px;font-size:12px;font-weight:700;color:var(--accent)}
.chip[aria-pressed="true"] .cn{color:inherit;opacity:.85}
.cctl{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;flex:none}
.cctl .btn{white-space:nowrap;padding:0 11px}
.ch>div:first-child{min-width:0}
.btn.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.btn.dng:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 14%,transparent)}
.btn.dngf{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.ibtn{flex:none;width:44px;height:44px;margin:-6px -8px -6px 0;display:grid;place-items:center;border:none;background:none;color:var(--muted);border-radius:50%;padding:0}
.ibtn:hover{color:var(--accent);background:var(--surface2)}
.cfm .box.scr{max-height:min(82vh,640px);overflow-y:auto;max-width:460px}
.infob p{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}.infob b{color:var(--fg)}
.season .sh{flex-wrap:nowrap}
.season .sh b{margin-right:auto}
.season.hs{padding:8px 10px}
.n3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fhx{margin-left:auto;display:flex;align-items:center;gap:6px}
.ibtn.sm{width:44px;height:44px;margin:-12px -10px -12px 0}
.fg .fld>label{min-height:24px;display:flex;align-items:center;justify-content:space-between}
.autosv{display:flex;align-items:center;font-size:13px;color:var(--muted);padding:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sact{display:flex;gap:6px;flex:none}
.pbs{display:flex;gap:6px;flex-wrap:wrap}
.cctl .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card.hidc{opacity:.92}
.pbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:58;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s .28s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .28s ease}
.drawer{position:fixed;left:0;top:0;bottom:0;width:max(52vw,min(86vw,340px));z-index:59;background:var(--surface);border-right:1px solid var(--line);box-shadow:8px 0 32px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateX(-102%);visibility:hidden;transition:transform .3s cubic-bezier(.22,.8,.3,1),visibility 0s .3s;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.22,.8,.3,1)}
.drtop{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px}
.drtop b{font-family:var(--display);font-size:22px;letter-spacing:.08em}
.drx{width:44px;height:44px;border:none;background:none;color:var(--fg);font-size:22px;border-radius:12px}
.drnav{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.dritem{min-height:52px;text-align:left;padding:0 14px;border:none;border-radius:12px;background:none;color:var(--fg);font-size:16px;font-weight:600}
.dritem:hover,.dritem:active{background:var(--surface2)}
.dritem .drsub{color:var(--muted);font-weight:500}
.drfoot{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.prof{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 12px;border:none;border-radius:14px;background:none;color:var(--fg);text-align:left}
.prof:hover{background:var(--surface2)}
.prof .pnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pav{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800}
.profpanel{margin:0 2px 8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.profpanel .pr{display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.profpanel .pr b{color:var(--fg);font-size:15px;overflow-wrap:anywhere}
body.drawopen{overflow:hidden}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none!important}}
.tab{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
h2{font-size:18px}
h3{font-size:15px}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.search input{flex:1;min-width:0;height:44px;background:none;border:none;outline:none;font-size:15px}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px;flex-wrap:wrap}
.sel{display:flex;align-items:center;gap:8px;color:var(--muted)}
select,.inp{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
select{padding-right:8px}
.list{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:720px){.list{grid-template-columns:1fr 1fr}}
.row{display:grid;grid-template-columns:26px 44px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:68px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.rk{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.av{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.av.big{width:84px;height:84px;font-size:34px;border:2px solid var(--accent)}
.nm{display:flex;flex-direction:column;min-width:0}
.nm b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rt small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.ovr{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;min-width:46px;text-align:center;padding:1px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.back{min-height:44px;background:none;border:none;color:var(--muted);padding:0 4px;display:inline-flex;align-items:center;gap:6px}
.hero{display:flex;align-items:center;gap:16px;padding:8px 0 16px;flex-wrap:wrap}
.hero h1{font-size:26px;line-height:1.15}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);margin-top:4px}
.pos{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile,.m{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile span,.m span{display:block;font-size:12px;color:var(--muted)}
.tile b,.m b{display:block;font-family:var(--display);font-size:34px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.tile b.g,.m b.g{color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:20px;overflow-x:auto}
.dt{min-height:44px;padding:0 14px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.dt[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{gap:8px}.tile{padding:12px 10px}.tile b{font-size:27px}}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr) 40px;align-items:center;gap:10px}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.bt{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bt i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar b{font-family:var(--display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ch h3{overflow-wrap:anywhere}
.ch small{color:var(--muted);display:block}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.st div{background:var(--surface2);border-radius:10px;padding:6px 4px}
.st b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.st span{font-size:11px;color:var(--muted)}
.rc{display:inline-block;min-width:40px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;border-radius:7px;padding:1px 6px;font-variant-numeric:tabular-nums}
.r1{background:var(--accent);color:var(--on-accent)}
.r2{background:var(--accent-soft);color:var(--accent)}
.r3{background:var(--surface2);color:var(--fg)}
.r4{background:var(--warn-soft);color:var(--warn)}
.tag{font-style:normal;padding:2px 8px;border-radius:7px;background:var(--surface2);font-size:12px;display:inline-block}
.tag.ind{background:var(--gold-soft);color:var(--gold)}
.tag.neg{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:24px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:10px}
.pick select{width:100%}
.cmph{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);gap:4px;align-items:start;padding:18px 0 8px;text-align:center}
.cmph .p{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cmph .p b{overflow-wrap:anywhere}
.vs{font-family:var(--display);font-size:20px;color:var(--muted);padding-top:22px}
.cr{padding:9px 0;border-top:1px solid var(--line)}
.cr .l{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:baseline}
.cr .l span{color:var(--muted);font-size:12px}
.cr .l b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.cr .l b:last-child{text-align:right}
.cr .l b.w{color:var(--accent)}
.cb{display:flex;gap:6px;margin-top:5px}
.cb div{flex:1;display:flex}
.cb div:first-child{justify-content:flex-end}
.cb i{display:block;height:6px;border-radius:3px;background:var(--bar-lose)}
.cb i.w{background:var(--accent)}
/* detail season table */
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.tb{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tb th{font-weight:500;color:var(--muted);font-size:11px;text-align:right;padding:4px 6px;white-space:nowrap}
.tb td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
.tb th:first-child,.tb td:first-child{text-align:left;font-family:var(--display);font-size:16px}
.tb th:last-child,.tb td:last-child{text-align:left}
.tb td.chp{min-width:150px}
.tb td.chp .tag{margin:0 4px 4px 0}
/* form */
.fs{display:flex;flex-direction:column;gap:12px;padding-top:28px}
.fh{display:flex;align-items:center;gap:10px}
.fh i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lb{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{min-height:46px;width:100%;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.fld textarea{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);outline:none}
.n6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.n6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.n6 .fld input{text-align:center;font-family:var(--display);font-size:20px;padding:0 4px}
.n4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.n4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.n4 .fld input{text-align:center;font-family:var(--display);font-size:20px;padding:0 4px}
.seg{display:flex;gap:8px}
.seg .chip{flex:1;border-radius:12px}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.clubs .chip{border-radius:12px;white-space:normal;text-align:left;padding:6px 10px;display:flex;align-items:center;gap:8px}
.clubs .chip b.no{font-family:var(--display);font-size:16px;min-width:20px;color:var(--muted);font-weight:600}
.clubs .chip[aria-pressed="true"] b.no{color:var(--accent)}
.addc{display:flex;gap:8px}
.addc input{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.err{color:var(--bad);font-size:13px}
.fld input.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.namerow{display:flex;gap:8px;align-items:stretch}.namerow input{flex:1;min-width:0}.namerow .btn{white-space:nowrap;flex:0 0 auto;min-height:44px}
.atag{font-size:11px;font-weight:700;color:var(--accent);margin-left:4px}
.aggbox{padding:10px 12px;border:1px dashed var(--line);border-radius:12px;margin:10px 0}
.hint{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 10px}
.natbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;width:100%;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.natbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:8px}
.natbox input{min-height:42px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.natlist{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain}
.natlist h4{position:sticky;top:0;margin:0;padding:4px 8px;font-size:12px;color:var(--accent);background:var(--surface);font-weight:700}
.natlist button{min-height:42px;text-align:left;padding:0 10px;border:none;border-radius:8px;background:none;display:flex;gap:10px;align-items:center}
.natlist button:hover,.natlist button[aria-selected="true"]{background:var(--accent-soft)}
.season{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}

.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted)}

.chk{display:flex;align-items:center;gap:10px;min-height:44px}

.sum{background:var(--accent-soft);border-radius:12px;padding:10px 12px;color:var(--accent);font-size:13px}

.ovr.o-sky{background:var(--sky-soft);color:var(--sky)}
.ovr.o-pur{background:var(--pur-soft);color:var(--pur)}

.natbox{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.nn .fld input{text-align:center;font-family:var(--display);font-size:20px;padding:0 4px}

.cf{color:var(--muted);font-style:italic}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}

summary.sm{cursor:pointer;min-height:36px;display:flex;align-items:center}

@media (prefers-reduced-motion:no-preference){.row,.chip,.tab,.pchip{transition:border-color .15s,background .15s}}

/* ===== round 3 ===== */
body{word-break:keep-all;overflow-wrap:break-word}
.ovr.o-gray{background:var(--surface2);color:var(--muted)}
.tile b.g.o-gray{color:var(--muted)}
.clubs{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.clubs .chip{line-height:1.25;min-height:46px}
.clubs .chip span{text-wrap:balance;word-break:keep-all;overflow-wrap:break-word}
.bar .bl{white-space:normal;line-height:1.25}
.nm b{white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nm small{white-space:normal;line-height:1.25}
.nn{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.nn .fld label{min-height:2.5em;display:flex;align-items:flex-end;line-height:1.25;text-wrap:balance}
.kv span{text-wrap:balance;line-height:1.25}
.ccrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,200px);gap:8px;align-items:end}

.stint{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.stint .fld input{text-align:center;font-family:var(--display);font-size:20px}
.stline{display:flex;flex-direction:column;gap:8px}
.cap.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:700}
.modal{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 40px}
.modal .mi{max-width:880px;margin:0 auto}
.mbar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mbar b{font-size:15px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}
.acct{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.acct .an{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpsel{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:6px;align-items:stretch;padding-top:12px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:14px 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0;width:100%}
.pcard:hover{border-color:var(--accent)}
.pcard b.nmx{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.pcard .ovr{font-size:30px;margin-top:4px}
.pcard small{color:var(--muted)}
.vsb{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;color:var(--muted)}
.seg2{display:flex;gap:6px;flex-wrap:wrap;padding-top:12px}
.cmpsec{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.cmpsec>h3{padding:10px 14px;background:var(--surface2);font-size:13px;color:var(--muted)}
.fr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:6px;padding:9px 12px;border-top:1px solid var(--line)}
.fr:first-of-type{border-top:none}
.fr .lb2{text-align:center;font-size:12px;color:var(--muted);line-height:1.25;text-wrap:balance}
.fr .v{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;display:flex}
.fr .v.a{justify-content:flex-start}.fr .v.b{justify-content:flex-end}
.fr .v span{min-width:48px;text-align:center;padding:1px 8px;border-radius:999px;color:var(--muted)}
.fr .v.w span{background:var(--accent);color:var(--on-accent);font-weight:700}
.fr .v.l span{color:var(--muted)}
.pk{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.pk .row{min-height:60px}
.pkl{display:flex;flex-direction:column;gap:6px}
.pkb{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.pkb:hover{border-color:var(--accent)}
/* 메인 화면에서만 검색/비교/등록 메뉴 표시 */
body.nomain .nav{display:none}
.autobar{display:none;grid-column:1/-1;gap:6px;align-items:center;padding:2px 0 4px;margin:0}
.autobar.show{display:flex}
.autobar .btn{min-height:42px;padding:0 8px;flex:1;white-space:nowrap;font-size:14px}
.cfm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.cfm .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5)}
/* FotMob식 세부 스탯 · 몸값 그래프 */
.dsh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dsh select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 10px}
.radar{display:block;width:100%;max-width:440px;margin:6px auto 0;height:auto;overflow:visible}
.radar .rg{fill:none;stroke:var(--line);stroke-width:1.5}
.radar .rd{stroke-dasharray:4 4}
.radar .ra{stroke:var(--line);stroke-width:1.5}
.radar .rp{fill:var(--accent);fill-opacity:.55;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar .rl{fill:var(--fg);font-size:15px;font-weight:600}
.radar .rv{fill:var(--muted);font-size:15px;font-weight:600}
.fmsec{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px}
.fmsec h4{margin:0 0 4px;font-size:14px}
.fmr{padding:9px 0;border-top:1px solid var(--line)}
.fmsec h4+.fmr{border-top:0}
.fml{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fml b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.fmb{height:6px;border-radius:3px;background:var(--surface2);margin:6px 0 4px;overflow:hidden}
.fmb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.fms{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.vwrap{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.vax{flex:none;border-right:1px solid var(--line)}
.vax text{fill:var(--fg);font-size:12px;font-weight:600}
.vscroll{overflow:hidden;flex:1;min-width:0}
.vsvg{display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.vsvg .vbd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.vsvg .vcur{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3;pointer-events:none}
.vsvg .vtip{pointer-events:none}.vsvg .vtip rect{fill:var(--accent)}.vsvg .vtip text{fill:#fff;font-size:13px;font-weight:800}
.poscard{display:flex;gap:14px;align-items:stretch;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px}
.poscard .pl{flex:1;min-width:0}.poscard h3{margin:0 0 10px}
.pp1{margin-bottom:12px;font-size:14px;line-height:1.5}.ppl{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
.pp1 b{font-size:16px}
.pitch{position:relative;width:132px;flex:none;aspect-ratio:100/135;background:#2f8f4e;border-radius:10px}
.pitch.ed{width:min(100%,300px);aspect-ratio:100/150;margin:10px 0}
.pitch .pit{position:absolute;inset:0;width:100%;height:100%}
.pitch .pit *{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.9}
.pb{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:22px;padding:0 5px;border-radius:12px;border:0;font:800 10px/22px inherit;font-size:10px;text-align:center;color:#fff;background:#6b7280;box-sizing:border-box}
.pb.main{background:#e5383b}.pb.sub{background:#6b7280;outline:2px solid rgba(255,255,255,.6)}
.pitch.ed .pb{min-width:46px;height:36px;line-height:36px;border-radius:18px;font-size:13px;cursor:pointer;background:rgba(0,0,0,.28);color:rgba(255,255,255,.85)}
.pitch.ed .pb.main{background:#e5383b;color:#fff}.pitch.ed .pb.sub{background:#2563eb;color:#fff;outline:2px solid #fff}

.vsvg text{fill:var(--muted);font-size:12px;font-weight:600}
.vsvg .vbg{fill:var(--surface2);opacity:.55}
.vsvg .vgr{stroke:var(--muted);stroke-opacity:.5;stroke-dasharray:4 4}
.vsvg .vl{fill:none;stroke:var(--fg);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.vsvg .vsep{stroke:var(--line);stroke-width:2}
.vsvg .vbd circle{fill:var(--surface);stroke:var(--line);stroke-width:2}
.vsvg .vbd text{fill:var(--fg);font-size:13px;font-weight:700}
.vsvg .vpg{cursor:pointer;outline:none}
.vsvg .vpg .hit{fill:transparent}
.vsvg .vpg .dot{fill:var(--fg)}
.vsvg .vpg .ring{display:none;fill:none;stroke:var(--accent);stroke-width:2.5}
.vsvg .vpg.sel .ring{display:block}
.vsvg .vpg.sel .dot{fill:var(--accent)}
.vsvg .vpg:focus-visible .ring{display:block;stroke:var(--fg)}
.aglist{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.agrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.agage{font-family:var(--display);font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.clubbox{max-height:min(46vh,340px);overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px;overscroll-behavior:contain;margin-top:8px}
.clubbox h4{position:sticky;top:0;margin:0;padding:6px 8px;font-size:12px;color:var(--accent);background:var(--surface);font-weight:700;z-index:1}
.cbrow{width:100%;min-height:46px;text-align:left;padding:0 10px;border:none;border-radius:8px;background:none;display:flex;gap:10px;align-items:center}
.cbrow .no{font-family:var(--display);font-size:16px;min-width:22px;color:var(--muted);font-weight:600}
.cbrow span{flex:1;min-width:0;overflow-wrap:anywhere}
.cbrow .ck{font-style:normal;color:var(--accent);font-weight:700;min-width:18px;text-align:center}
.cbrow[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.pkd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px}
.chip.sm{min-height:34px;padding:0 12px;font-size:13px}
@media (max-width:640px){
  body{padding-bottom:28px}
  body.mainv,body.inreg{padding-bottom:84px}
  .top{padding-block:10px 4px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
  .nav .tab{flex:1;padding:0 6px;border-radius:12px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  /* 선수 등록 화면: 메인 메뉴(검색/비교/등록)는 위로, 섹션 탭(선수 정보/클럽/국가대표/메모)은 아래 엄지 영역으로 — 오클릭 방지 */
  body.inreg .nav{display:none}
  body.inreg .rtabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));margin:0}
  body.inreg .rtabs .tab{min-height:48px}
  .fld input,.fld select,.fld textarea,.natbox input,.search input,.addc input,select{font-size:16px}
  .hero h1{font-size:22px}
  .n4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fr{padding:9px 8px}
  .fr .v span{min-width:40px;padding:1px 6px}
  .stint{grid-template-columns:1fr 1fr}
  .stint .btn{grid-column:1/-1}
}

.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

<script>/* COPERO 단독 실행용 연결 코드 — Supabase(Google 로그인 + 사용자별 저장). claude.ai 안에서는 사용되지 않음 */
(function(){
if(window.claude)return;
var CFG=window.__COPERO_CFG||{};
var URL_=(CFG.url||'').replace(/\/+$/,''),KEY=CFG.anon||'';
var LS='copero.auth',sess=null,authErr='';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function lsSet(v){try{if(v)localStorage.setItem(LS,JSON.stringify(v));else localStorage.removeItem(LS)}catch(e){}}
function jwt(t){try{var p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}
function setSess(a,r){var p=jwt(a);if(!p)return false;sess={access:a,refresh:r,exp:(p.exp||0)*1000,uid:p.sub,email:p.email||'',name:((p.user_metadata||{}).full_name||(p.user_metadata||{}).name||p.email||'')};lsSet({access:a,refresh:r});return true}
function parseHash(){
  var h=(location.hash||'').replace(/^#/,''),q=(location.search||'').replace(/^\?/,'');
  var P=new URLSearchParams(h||q);
  if(P.get('error_description')||P.get('error')){authErr=P.get('error_description')||P.get('error');cleanUrl();return}
  if(P.get('access_token')){setSess(P.get('access_token'),P.get('refresh_token')||'');cleanUrl()}
}
function cleanUrl(){try{history.replaceState(null,'',location.pathname)}catch(e){}}
async function refresh(){
  if(!sess||!sess.refresh)return false;
  try{
    var r=await fetch(URL_+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh})});
    if(!r.ok)return false;var j=await r.json();return setSess(j.access_token,j.refresh_token);
  }catch(e){return false}
}
async function token(){
  if(!sess)throw new Error('로그인이 필요합니다.');
  if(sess.exp&&sess.exp-Date.now()<60000){if(!(await refresh()))throw new Error('로그인이 만료되었습니다. 다시 로그인해 주세요.')}
  return sess.access;
}
async function rest(path,opt){
  opt=opt||{};var t=await token();
  var h=Object.assign({apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},opt.headers||{});
  var r=await fetch(URL_+'/rest/v1/'+path,{method:opt.method||'GET',headers:h,body:opt.body});
  if(!r.ok){var m='';try{m=(await r.json()).message}catch(e){}throw new Error(m||('저장소 오류 ('+r.status+')'))}
  return r.status===204?null:r.text().then(function(s){return s?JSON.parse(s):null});
}
var auth=window.__auth={logged:false,name:'',err:'',
  login:function(){location.href=URL_+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname)},
  logout:async function(){try{if(sess)await fetch(URL_+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sess.access}})}catch(e){}lsSet(null);sess=null;location.href=location.pathname}};
auth.ready=(async function(){
  var saved=lsGet();if(saved&&saved.access)setSess(saved.access,saved.refresh);
  parseHash();
  if(sess&&sess.exp&&sess.exp<Date.now()+5000){if(!(await refresh()))sess=null}
  auth.logged=!!sess;auth.name=sess?sess.name:'';auth.email=sess?sess.email:'';auth.err=authErr;
})();

/* ---- 저장소: Firestore 비슷한 인터페이스 ---- */
var SEED=window.__SEED_APP||{config:{countries:[]},players:{}};
var cache=null,subs=[];
function notify(){subs.slice().forEach(function(f){try{f()}catch(e){}})}
async function load(){
  if(cache)return cache;
  var rows=await rest('player_docs?select=id,data');cache={};(rows||[]).forEach(function(r){cache[r.id]=r.data});return cache;
}
function uidOf(path){var m=path.match(/^data\/users\/([^\/]+)/);return m?m[1]:null}
var rnd=function(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
var db={
  collection:function(col){
    if(col==='players')return{onSnapshot:function(cb){setTimeout(function(){cb({docs:Object.keys(SEED.players).map(function(id){return{id:id,data:function(){return JSON.parse(JSON.stringify(SEED.players[id]))}}})})},0);return function(){}}};
    return{
      onSnapshot:function(cb,err){
        var f=function(){cb({docs:Object.keys(cache||{}).map(function(id){return{id:id,data:function(){return JSON.parse(JSON.stringify(cache[id]))}}})})};
        load().then(function(){subs.push(f);f()},function(e){if(err)err(e)});return function(){}
      },
      add:async function(doc){await load();var id=rnd();await rest('player_docs?on_conflict=uid,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({uid:sess.uid,id:id,data:doc})});cache[id]=JSON.parse(JSON.stringify(doc));setTimeout(notify,0);return{id:id}}
    };
  },
  doc:function(path){
    var parts=path.split('/'),id=parts[parts.length-1];
    if(path==='config/app')return{onSnapshot:function(cb){setTimeout(function(){cb({exists:true,data:function(){return JSON.parse(JSON.stringify(SEED.config))}})},0)}};
    return{
      set:async function(doc){await load();await rest('player_docs?on_conflict=uid,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({uid:sess.uid,id:id,data:doc})});cache[id]=JSON.parse(JSON.stringify(doc));setTimeout(notify,0)},
      delete:async function(){await load();await rest('player_docs?id=eq.'+encodeURIComponent(id),{method:'DELETE'});delete cache[id];setTimeout(notify,0)}
    };
  }
};
var user={canEdit:async function(){return true},id:async function(){return sess?sess.uid:''},me:async function(){return{id:sess?sess.uid:'',name:sess?sess.name:''}}};
var dl={save:async function(o){
  var blob=new Blob([o.data],{type:o.mime||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename||'COPERO.xlsx';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}};
window.claude={use:async function(n){return n==='db'?db:n==='user'?user:n==='downloads'?dl:null}};
})();
</script>

function parseAges(s){
  const r=[];
  String(s||'').split(/\s*[\/,]\s*/).forEach(part=>{
    const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)return;
    let a=+m[1],b=+(m[2]||m[1]);if(b<a){const t=a;a=b;b=t}if(b-a>45)b=a+45;
    for(let i=a;i<=b;i++)r.push(i);
  });
  return Array.from(new Set(r)).sort((x,y)=>x-y);
}

/* ---------- 데이터 정규화: 예전 x/y 필드를 골·어시 / 클린시트·실점으로 이동 ---------- */

    if(c.kind==='nat'&&(c.cap||c.vice)){const cp=parseAges(c.cap),vc=parseAges(c.vice);(c.seasons||[]).forEach(s=>{if(cp.indexOf(+s.a)>=0)s.cap=true;else if(vc.indexOf(+s.a)>=0)s.vice=true});c.cap='';c.vice=''}

      if(gk){if(o.x!=null)o.cs=o.x;if(o.y!=null)o.ga=o.y}else{if(o.x!=null)o.gl=o.x;if(o.y!=null)o.as=o.y}

function carryRoles(careers){

    const ss=(c.seasons||[]).slice().sort((a,b)=>num(a.a)-num(b.a));let pc=false,pv=false,pa=null;
    ss.forEach(s=>{
      const adj=pa!=null&&num(s.a)===pa+1;let cap,vice;
      if(s.cap===true){cap=true;vice=false}else if(s.vice===true){vice=true;cap=false}
      else{cap=s.cap===false?false:(adj&&pc);vice=s.vice===false?false:(adj&&pv)}

}
function roleRuns(c,key){
  const a=(c.seasons||[]).filter(s=>s[key]).map(s=>num(s.a)).sort((x,y)=>x-y),r=[];
  a.forEach(x=>{const l=r[r.length-1];if(l&&l[1]===x-1)l[1]=x;else r.push([x,x])});

function carryAll(careers){

    const seq=[];list.forEach(c=>(c.seasons||[]).forEach(s=>seq.push(s)));
    seq.sort((a,b)=>num(a.a)-num(b.a));

}

/* ---------- 경력 집계 (연도별 기록이 있으면 합산, 없으면 기존 합계 사용) ---------- */
function cst(c){
  const ss=c.seasons||[],ag=c.agg||{};
  const any=ss.some(s=>SUMK.some(k=>num(s[k]))||num(s.rt));
  const o={any:any};
  SUMK.forEach(k=>{o[k]=any?ss.reduce((t,s)=>t+num(s[k]),0):num(ag[k])});
  if(any){const r=ss.map(s=>num(s.rt)).filter(v=>v>0);o.rt=r.length?r.reduce((a,b)=>a+b,0)/r.length:num(ag.rt)}else o.rt=num(ag.rt);

  o.ovr=ov.length?Math.max.apply(null,ov):0;o.val=vv.length?Math.max.apply(null,vv):0;
  const sh=Array.from(new Set(ss.map(s=>String(s._s==null?(s.shirt==null?'':s.shirt):s._s).trim()).filter(Boolean)));
  o.shirt=sh.length?sh.join(', '):String(ag.shirt||'');

function trCount(p){

    (c.seasons||[]).forEach(s=>(s.tr||[]).forEach(t=>{if(TR_REC.indexOf(t)<0)m[t]=(m[t]||0)+1}));
    if(c.kind==='nat')(c.lt||[]).forEach(t=>{m[t.n]=(m[t.n]||0)+num(t.c)});

function derive(p){
  norm(p);carryAll(p.careers||[]);
  let tot={g:0,gl:0,as:0,cs:0,ga:0},ovr=0,val=0,bd=0,gb=0,gg=0,cp=0,vp=0,ip=0;const rts=[],det={};
  (p.careers||[]).forEach(c=>{
    const s=cst(c);SUMK.forEach(k=>{tot[k]+=s[k]});if(s.rt>0)rts.push(s.rt);ovr=Math.max(ovr,s.ovr);val=Math.max(val,s.val);
    Object.keys(s.det).forEach(k=>{det[k]=(det[k]||0)+s.det[k]});
    (c.seasons||[]).forEach(se=>{if(se._cap)cp++;if(se._vice)vp++;(se.aw||[]).forEach(a=>{const t=awType(a);if(t==='발롱도르')bd++;else if(t==='골든부츠')gb++;else if(t==='골든 글러브')gg++})});

  p.rating=rts.length?Math.round(rts.reduce((a,b)=>a+b,0)/rts.length*100+1e-7)/100:0;

function distribute(w,total,caps,min1){

  const cp=Array.isArray(caps)?caps.slice():w.map(()=>caps==null?1e9:caps);

  if(min1&&total>=n){base=cp.map(c=>c>=1?1:0);rest=total-base.reduce((a,b)=>a+b,0)}

  const out=ww.map((x,i)=>Math.min(room[i],Math.floor(rest*x/sw)));

  while(rem>0&&guard++<200000){let best=-Infinity,bi=-1;for(let i=0;i<n;i++){if(out[i]<room[i]){const fr=rest*ww[i]/sw-out[i];if(fr>best){best=fr;bi=i}}}if(bi<0)break;out[bi]++;rem--}

/* 경기수 분포 (클럽 시즌)
   · 30~55경기가 대부분  · 56~59경기는 전성기에 자주, 그 밖의 시기에는 드물게
   · 0~10경기, 60~70경기는 모든 시기에 아주 낮은 확률(불가능하지는 않음)
   · 11~29경기는 어린 나이(점점 늘어남)·많은 나이(점점 줄어듦)일수록 확률이 높아짐 */

  /* 어린 나이(18세 이하)에 처음 뛰는 클럽: 첫 시즌은 경기수가 적고 해마다 점점 늘어남 */

  x-=pHi;

  return clamp(Math.round(center+gauss(r)*6),30,55);

const TOUR_OFF={'월드컵':0,'FIFA 컨페더레이션스컵':3,'유로컵':1,'코파 아메리카':1,'아시안컵':1,'아프리카 네이션스컵':1,'CONCACAF 골드컵':1,'OFC 네이션스컵':1};

let CYC=null;

/* scope: 'club' = 클럽 시즌만, 'nat' = 국가대표 시즌만. 반환: {n,err} (err가 있으면 아무것도 쓰지 않음) */

  const known=[];d.careers.forEach(c=>c.seasons.forEach(s=>{if(has(s.ovr))known.push(num(s.ovr))}));

  const debutAge=(()=>{let m=99;club.forEach(c=>c.seasons.forEach(s=>{m=Math.min(m,num(s.a))}));return m})();

  const prep=(c,isNat)=>{
    const rows=c.seasons.slice().sort((a,b)=>num(a.a)-num(b.a)).map(s=>{

      const qAbs=clamp((ovrE-60)/39,0,1),qRel=hiO>loO?clamp((ovrE-loO)/(hiO-loO),0,1):qAbs,qO=.5*qAbs+.5*qRel,qR=rt0?clamp((rt0-6.5)/3.3,0,1):qO,qV=valE?clamp(Math.log10(valE+1)/Math.log10(250),0,1):qO;

        fit:isNat?0:fitOf(ovrE,c.club,c.league),dbt:(!isNat&&debutAge<=18)?a-debutAge:null,ni:isNat?a-natDebut:null};

    const ag=c.fx?{}:(c.agg||{});['g','gl','as','cs','ga','rt'].forEach(k=>{if(has(ag[k])&&(k==='rt'?num(ag[k])>0:num(ag[k])>=0)&&(c.aau||[]).indexOf(k)<0&&!(gk&&(k==='gl'||k==='as')))L.T[k]=num(ag[k])});

  act.forEach(L=>{

        if(wonC&&bern(clamp((z-.7)/.25,0,1)*.5))aw('MVP(올해의 선수)',cg);
      }
    }
    /* 세계 개인상 (발롱도르 · FIFA · UEFA 올해의 선수는 국가대표 대회까지 정한 뒤 아래에서 종합 판단) */
    bdRows.push({c:c,s:s,a:a,z:z,o:o,reg:reg,t:t,rk:rk,aw:aw,isGK:isGK});
    if(!isGK&&pi<=2&&o>=78&&gl>=8&&bern(.006))aw('푸스카스상');
  });
  /* 국가대표: 월드컵 · 대륙 대회 · 네이션스리그 · 올림픽 · 아시안게임 */
  const nc=d.careers.find(c=>c.kind==='nat');
  const cap0={};if(nc)nc.seasons.forEach(s=>{cap0[s.a]=natCapOf(s)});
  if(nc)nc.seasons.slice().sort((x,y)=>num(x.a)-num(y.a)).forEach(s=>{
    const a=+s.a,g=num(s.g);if(!(g>0)||s.tr.length||s.aw.length)return;
    const k=natKind(s);if(k==null)return;
    const z=zAge[a]!=null?zAge[a]:.5,o=oAge[a]||num(s.ovr),nt=ntOf(s);
    let id=null,p=0;
    if(nt==='A'){
      if(k==='WC'||k==='MAJ'&&CYC&&CYC(a)==='WC'){id='월드컵';p=.20*fgNS(d.nation)*(.35+1.3*z)}
      else if(k==='CONT'||k==='MAJ'){id=FG_CONT_TR[cont]||null;p=.24*fgNSC(d.nation,cont)*(.35+1.3*z)}
      else if(k==='NL'){id='UEFA 네이션스리그';p=.16*fgNS(d.nation)*(.35+1.3*z)}
    }else if(k==='YT'){
      if(CYC&&CYC(a-2)==='WC'){id='올림픽';p=.10*fgNS(d.nation)*(.35+1.3*z)}
      else if(cont==='아시아'&&CYC&&CYC(a)==='WC'){id='아시안게임';p=.14*fgNSC(d.nation,cont)*(.35+1.3*z)}
    }
    let won=false;
    if(id&&natOK(id,cont)&&natTrOK(id,nt)&&bern(p)){if(fgGive(s,'tr',id)){n++;won=true}}
    if(nt!=='A'||!id)return;
    const sp=posOfS(d,s),isGK=sp==='GK',pi=PI[sp]==null?3:PI[sp],gl=num(s.gl),as=num(s.as),cs=num(s.cs);
    const scope=(AW_SC_NAT.find(x=>x[1]===id)||[])[0];if(!scope||awScopesNat(cont).indexOf(scope)<0)return;
    const wc=id==='월드컵',aw=type=>{if(fgGive(s,'aw',type+'|'+scope))n++};
    if(!isGK&&pi<=3&&bern(clamp((gl-(wc?4:3))/4,0,.8)))aw('골든부츠');
    if(!isGK&&bern(clamp((as-(wc?3:2))/4,0,.7)))aw('도움왕');
    if(isGK&&bern(clamp((cs-3)/4,0,.6)*(won?1:.4)))aw('골든 글러브');
    if(bern(won?clamp((z-.6)/.3,0,1)*.4:clamp((z-.85)/.15,0,1)*.12))aw('MVP(올해의 선수)');
    if((won||z>=.7)&&bern(.2))aw(AW_POS[GRP[sp]||'FW']);
    if(+s.a<=21&&bern(clamp((o-74)/10,0,1)*.3))aw('영플레이어상');
  });
  /* 발롱도르: 그 시즌의 스탯 · 개인 수상 · 우승 트로피(클럽 + A대표팀)를 종합. 5대 리그 · 빅클럽은 가산,
     그 밖의 리그는 매우 낮지만 챔피언스리그 · 월드컵 같은 큰 대회에서 엄청난 활약 + 우승이면 빅리그와 같거나 더 높게,
     클럽에서 활약이 없어도 월드컵을 캐리해 우승하면 높은 확률 */
  bdRows.forEach(R=>{
    const s=R.s,a=R.a,c=R.c,tr=s.tr||[],awT=(s.aw||[]).map(x=>{const q=String(x).split('|');return{t:q[0],sc:q[1]||''}});
    const big5=R.t===1&&R.reg==='유럽',bigC=FG_BIGC.has(c.club);
    let cAw=0;awT.forEach(x=>{const w=x.sc==='UEFA 챔피언스리그'?{'MVP(올해의 선수)':.35,'골든부츠':.25,'도움왕':.12}[x.t]:{'MVP(올해의 선수)':.25,'골든부츠':.2,'도움왕':.1,'골든 글러브':.15,'최우수 공격수':.08,'최우수 미드필더':.08,'최우수 수비수':.08,'최우수 골키퍼':.08,'영플레이어상':.03}[x.t];cAw+=w||0});cAw=Math.min(.6,cAw);
    const ucl=tr.indexOf('챔스')>=0,lgW=tr.indexOf(c.league)>=0,contCl=['코파 리베르타도레스','AFC 챔스','CAF 챔피언스리그','CONCACAF 챔피언스컵'].some(x=>tr.indexOf(x)>=0);
    let cTr=(ucl?.45:0)+(lgW?.2:0)+(tr.indexOf('유로파')>=0?.12:0)+(contCl?.12:0)+(tr.indexOf('클럽 월드컵')>=0?.05:0)+.04*tr.filter(x=>TR_REC.indexOf(x)<0&&x!==c.league&&['챔스','유로파','클럽 월드컵'].indexOf(x)<0).length;cTr=Math.min(.75,cTr);
    /* 같은 나이 A대표팀 */
    const ns=(nc?nc.seasons:[]).find(x=>+x.a===a&&ntOf(x)==='A'),ng=ns?num(ns.g):0,ntr=ns?(ns.tr||[]):[];
    const wc=ntr.indexOf('월드컵')>=0,contN=ntr.some(x=>x!=='월드컵'&&x!=='UEFA 네이션스리그'&&TR_NAT.indexOf(x)>=0);
    let nAw=0,wcAw=0;(ns?ns.aw||[]:[]).forEach(x=>{const q=String(x).split('|'),w={'MVP(올해의 선수)':.4,'골든부츠':.3,'도움왕':.15,'골든 글러브':.2}[q[0]]||.05;if(q[1]==='월드컵'){wcAw+=w;nAw+=w}else nAw+=w*.5});nAw=Math.min(.6,nAw);
    const nGA=ns?(R.isGK?num(ns.cs)*1.2:num(ns.gl)+.7*num(ns.as)):0,carry=wc&&ng>=4&&(nGA>=5||wcAw>=.3);
    const nTr=(wc?.55:0)+(contN?.25:0)+(ntr.indexOf('UEFA 네이션스리그')>=0?.06:0);
    const T=.95*R.z+cAw+cTr+nAw+nTr+(wc?clamp(nGA/8,0,.4):0);
    const of=clamp((R.o-80)/10,.12,1);
    let p=Math.pow(clamp((T-1.15)/1.25,0,1),1.4)*.85*of;
    const elite=(ucl&&R.z>=.7&&cAw>=.25)||(wc&&(carry||(R.z>=.7&&nAw>=.2)));
    p*=big5?(bigC?1.3:1):bigC?1.05:elite?1.2:.22;     /* 빅리그 · 빅클럽 가산 / 그 외는 매우 낮음, 큰 대회에서 엄청난 활약이면 오히려 더 높게 */
    if(carry)p=Math.max(p,clamp(.5+.08*(nGA-5)+wcAw*.4,.5,.85)*clamp((R.o-74)/10,.35,1));   /* 월드컵 캐리 우승 */
    p=clamp(p,0,.92);
    const bd=bern(p);
    if(bd)R.aw('발롱도르');
    if(bd?bern(.75):bern(p*.25))R.aw('FIFA 올해의 선수');
    if(R.reg==='유럽'&&(bd?bern(.6):bern(p*.2)))R.aw('UEFA 올해의 선수');
  });
  /* 네이션스리그 트로피는 국제대회 주기를 바꿀 수 있다 → 이미 만든 국가대표 경기수와 어긋나면 해당 트로피를 뺀다 */
  if(nc){
    CYC=natCycle(d);
    if(nc.seasons.some(s=>natCapOf(s)!==cap0[s.a])){
      nc.seasons.forEach(s=>{if(s.tr.indexOf('UEFA 네이션스리그')>=0&&(s.ta||[]).indexOf('tr:UEFA 네이션스리그')>=0){s.tr=s.tr.filter(t=>t!=='UEFA 네이션스리그');s.ta=(s.ta||[]).filter(x=>x!=='tr:UEFA 네이션스리그');n--}});
      CYC=natCycle(d);
    }
  }
  return n;
}

/* ---------- 경력 시뮬레이션: 시즌(나이)마다 폼을 정하고, 그 시즌 스탯에 따라 이적 · 임대 · 유망주 · 스타 선수를 정한다 ---------- */
/* 2부 리그 목록 (임대 행선지) */
function fgLeagues2(L){
  const out=[];((S.cfg||{}).countries||[]).forEach(co=>{if(co.n==='기타')return;const l=co.leagues[1];if(!l)return;const cl=(l.c||[]).concat(l.x||[]);if(!cl.length)return;
    const top=L.find(x=>x.co===co.n);out.push({co:co.n,n:l.n,clubs:cl,t:clamp(FG_TIER[l.n]||((top?top.t:3)+1),1,4),reg:co.reg,second:true})});
  return out;
}
const fgMean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
/* 리그 안에서 클럽 수준(top/mid/low) 가중치로 클럽 하나 고르기 */
function fgClubIn(rnd,lg,wf,used,excl){
  const rk=wpick(rnd,['top','mid','low'],wf);
  let c=lg.clubs.filter(x=>!used.has(x)&&x!==excl&&clubRank(x,lg.n)===rk);
  if(!c.length){const alt=['top','mid','low'].filter(r=>r!==rk&&wf(r)>0.02);for(const r of alt){c=lg.clubs.filter(x=>!used.has(x)&&x!==excl&&clubRank(x,lg.n)===r);if(c.length)break}}
  if(!c.length)return null;
  const club=c[Math.floor(rnd()*c.length)];return{lg:lg,club:club,rk:clubRank(club,lg.n)};
}
/* 반환: 시즌별 [{a, lg, club, rk, loan, f(폼), ps(상태)}] */
function fgSim(rnd,L,home,a0,end,start,peak,forced){
  const tl=[],used=new Set();
  let pB=0;
  const eoAt=a=>Math.min(peak,fgExpO(a,a0,start,peak)+pB);
  let cur=fgPickClub(rnd,L,home,eoAt(a0),used,true);if(!cur)return tl;used.add(cur.club);
  let par=null,loanLeft=0,loanF=[],atClub=0,clubF=[],plan=1+Math.floor(Math.pow(rnd(),.9)*6),f=0;
  let P=false,Sx=false,pBad=0,prove=0,nLoan=0;
  const L2=fgLeagues2(L);
  /* 더 강한 리그 · 클럽으로 이적 (스탯이 좋은 시즌이 이어질수록 확률이 높음) */
  const moveUp=(a,eo,avgR,veryHigh)=>{
    const t=cur.lg.t,lvNow=fgLvl(cur.club,cur.lg.n);
    let pk=null;
    if(P&&a<=21){
      /* 유망주: 같은 리그 상위권(지금 클럽이 하위권일 때) 또는 다른 빅리그의 하위 · 중위권(상위권은 비교적 낮은 확률) */
      const big=L.filter(l=>l.t<=Math.max(1,t-1)&&l.co!==cur.lg.co);
      if(cur.rk==='low'&&(rnd()<.5||!big.length))pk=fgClubIn(rnd,cur.lg,r=>r==='top'?.65:r==='mid'?.35:0,used,cur.club);
      if(!pk&&big.length){const lg=wpick(rnd,big,l=>(l.t===1?2:1)*(l.reg===cur.lg.reg?1.6:1));pk=fgClubIn(rnd,lg,r=>r==='top'?(veryHigh?.35:.2):r==='mid'?.4:.4,used)}
    }else{
      /* 스탯 · OVR을 함께 보고 행선지 결정. 종합적으로 매우 높으면 빅리그 상위권 클럽 */
      const eoX=eo+6*avgR;
      const cands=L.filter(l=>l.t<t||(l.t===t&&l.t===1));
      if(cands.length){
        const lg=wpick(rnd,cands,l=>Math.exp(-.5*Math.pow((eoX-FG_REF.mid[l.t-1])/7,2))*(l.reg===cur.lg.reg?1.8:1)*(l===cur.lg?1.5:1)+.02);
        const wf=veryHigh?(r=>r==='top'?.65:r==='mid'?.28:.07):(r=>Math.exp(-.5*Math.pow((eoX-FG_REF[r][lg.t-1])/6,2))+.06);
        pk=fgClubIn(rnd,lg,r=>{const lvT=fgLvl('',lg.n)-1+({top:2,mid:1,low:0}[r]);return lvT>lvNow?wf(r):0},used,cur.club);
      }
    }
    if(!pk)return false;
    if(Sx)prove=2;                       /* 스타 선수: 새 리그 · 클럽에서 다시 증명해야 함 */
    cur=pk;used.add(pk.club);atClub=0;clubF=[];plan=Sx||veryHigh?3+Math.floor(rnd()*4):2+Math.floor(rnd()*4);return true;
  };
  /* 임대: 다른 하위 리그(같은 나라 2부 포함) 또는 같은 리그 하위권 클럽으로 1~2년 */
  const startLoan=(a)=>{
    const opts=[];
    const lowSame=cur.lg.clubs.filter(x=>x!==cur.club&&!used.has(x)&&clubRank(x,cur.lg.n)==='low');
    if(lowSame.length&&cur.rk!=='low')opts.push(['same',1]);
    const weaker=L.concat(L2).filter(l=>l.t>cur.lg.t||(l.second&&l.co===cur.lg.co));
    if(weaker.length)opts.push(['down',1.2]);
    if(!opts.length)return false;
    let pk=null;
    if(wpick(rnd,opts,o=>o[1])[0]==='same')pk={lg:cur.lg,club:lowSame[Math.floor(rnd()*lowSame.length)],rk:'low'};
    else{const lg=wpick(rnd,weaker,l=>l.co===cur.lg.co?3:l.reg===cur.lg.reg?1:.05);pk=fgClubIn(rnd,lg,r=>r==='low'?.25:r==='mid'?.45:.3,used,cur.club)}
    if(!pk)return false;
    nLoan++;par={c:cur,atClub:atClub};cur=pk;loanLeft=Math.max(1,Math.min(rnd()<.55?1:2,end-a));loanF=[];return true;
  };
  for(let a=a0;a<=end;a++){
    /* 개인 수상 · 트로피를 직접 고른 자동 클럽은 그 나이에 그대로 둔다 */
    const fz=forced&&forced[a];
    if(fz&&(cur.club!==fz.club||par)){cur={lg:fz.lg,club:fz.club,rk:clubRank(fz.club,fz.lg.n)};par=null;atClub=0;clubF=[];used.add(fz.club)}
    const eo=eoAt(a),fit=fitOf(eo,cur.club,cur.lg.n);
    /* 시즌 폼: 직전 시즌과 이어지는 경향 + 출전 여건(클럽 적합도) + 유망주 · 스타 보정 */
    let nf=clamp(.42*f+.14*fit+(P?.1:0)+(Sx?.28:0)+gauss(rnd)*.33,-1,1);
    if(Sx&&rnd()<.75)nf=Math.max(nf,clamp(.42+gauss(rnd)*.1,0,1));
    f=nf;
    const good=f>=.3,great=f>=.6,insane=f>=.9;
    const loan=!!par;
    tl.push({a:a,lg:cur.lg,club:cur.club,rk:cur.rk,loan:loan,f:Math.round(f*100)/100,ps:'',forced:!!fz});
    const rec=tl.slice(-3).map(x=>x.f),avgR=fgMean(rec);
    let streak=0;for(let k=tl.length-1;k>=0&&tl[k].f>=.3;k--)streak++;
    /* 유망주 판정: 20세 이하 · OVR(몸값) 낮은데 스탯 좋은 시즌 → 유망주. 좋은 시즌이 이어지지 않으면 해제 */
    if(!P&&a<=20&&eo<=76&&good&&rnd()<(great?.85:.45))P=true;
    else if(P){pBad=good?0:pBad+1;if(pBad>=2||a>23){P=false;pBad=0}}
    if(P)pB=Math.min(5,pB+.8);
    /* 스타 선수: OVR 85 이상 + 좋은 시즌이 많을수록 (빅리그 · 빅클럽이 가장 높음), 말도 안 되는 시즌이면 어디서든 가능 */
    const lv=fgLvl(cur.club,cur.lg.n),gc=tl.slice(-4).filter(x=>x.f>=.3).length;
    if(Sx&&prove>0){if(f>=.42)prove=0;else if(--prove===0)Sx=false}
    if(!Sx&&!loan){
      let p=0;
      if(eo>=85&&gc>=2)p=(lv>=14?.38:cur.lg.t===1?.25:cur.rk==='top'?.16:.1)*(gc>=3?1.35:1);
      if(insane&&eo>=74&&a>=19)p=Math.max(p,lv>=12?.45:.3);
      if(rnd()<p)Sx=true;
    }
    tl[tl.length-1].ps=Sx?'S':P?'P':'';
    if(a>=end)break;
    /* ---- 다음 시즌 소속 ---- */
    if(par){
      loanF.push(f);if(--loanLeft>0)continue;
      const lf=fgMean(loanF);
      if(rnd()<(lf>=.4?.55:lf>=.25?.4:lf>=.1?.12:0)){par=null;used.add(cur.club);atClub=0;clubF=[];plan=2+Math.floor(rnd()*4);continue}   /* 임대 클럽으로 완전 이적 */
      const back=par.c;par=null;
      if(lf<.25&&a<=23&&nLoan<3&&rnd()<.25){cur=back;if(startLoan(a+1))continue}   /* 복귀 후 곧바로 다시 임대 */
      cur=back;atClub=0;clubF=[];plan=Math.max(plan,1+Math.floor(rnd()*3));continue;   /* 원 소속 클럽 복귀 */
    }
    atClub++;clubF.push(f);
    /* 1~2시즌 뛰었는데 스탯이 좋아지지 않음 → 임대 */
    if(a<=24&&nLoan<3&&atClub<=2&&fgMean(clubF)<.05&&fit<.25&&rnd()<((atClub===1?.16:.32)+(a<=21?.06:0))*(nLoan?.6:1)){if(startLoan(a))continue}
    /* 스탯이 좋은 시즌 → 더 강한 리그 · 클럽 (지속될수록 확률이 매우 높아짐) */
    const canUp=cur.lg.t>1||cur.rk!=='top';
    if(canUp&&a<=31){
      let p=streak>=1?[0,.22,.5,.8][Math.min(streak,3)]:0;
      p*=clamp(.35+.65*avgR+.3*clamp((eo-FG_REF.low[cur.lg.t-1])/10,0,1),.2,1.2);
      if(P&&good)p=Math.max(p,streak>=2?.8:.45);
      if(Sx)p=Math.max(p,.7);
      const veryHigh=avgR>=.55&&eo>=FG_REF.mid[0]-3;
      if(rnd()<p&&moveUp(a,eo,avgR,veryHigh))continue;
    }
    /* 계약 만료: 기존 방식으로 이적 (스탯이 좋으면 더 강한 리그로 갈 확률이 높아짐) */
    if(atClub>=plan&&!(Sx&&lv>=13&&rnd()<.75)){
      /* 지금 리그 수준을 기준으로 OVR · 최근 스탯에 맞는 리그 (나이가 들어 실력이 떨어지면 더 약한 리그 · 자국 리그로) */
      const eoN=eoAt(a+1)+5*avgR;
      const lg=wpick(rnd,L,l=>Math.exp(-.5*Math.pow((eoN-FG_REF.mid[l.t-1])/6,2))*(l===cur.lg?3:l.co===(home||{}).co?1.6:l.reg===cur.lg.reg?1.2:.5)+.005);
      const pk=fgClubIn(rnd,lg,r=>Math.exp(-.5*Math.pow((eoN-FG_REF[r][lg.t-1])/6,2))+(r==='top'?.02:.08),used,cur.club);
      if(pk){cur=pk;used.add(pk.club);atClub=0;clubF=[];plan=1+Math.floor(Math.pow(rnd(),.9)*6)}
    }
  }
  return tl;
}
/* 시뮬레이션 결과 → 클럽 경력 행 (같은 클럽의 여러 구간은 한 행의 여러 기간, 임대 시즌은 '임대' 표시) */
function fgSimRows(d,rnd,tl,kept){
  const rows=[],byKey={},chg=new Set();
  (kept||[]).forEach(r=>{r.stints=runs(r.ages).map(t=>({s:t.s,y:t.y}));byKey[r.club+'|'+r.league]=r});
  tl.forEach(x=>{
    if(x.forced)return;
    const k=x.club+'|'+x.lg.n;let r=byKey[k];
    if(!r){r=blankCareer(x.club,x.lg.n);r.fa=true;r.stints=[];byKey[k]=r;rows.push(r)}
    chg.add(r);
    const lst=r.stints[r.stints.length-1];
    if(lst&&+lst.s+(+lst.y)===x.a)lst.y=String(+lst.y+1);else r.stints.push({s:String(x.a),y:'1'});
  });
  const sh=FG_SHIRT[d.pos]||[7,8,9,10,11];
  rows.concat(kept||[]).forEach(r=>{
    const isK=(kept||[]).indexOf(r)>=0;
    if(chg.has(r)){
      const st=r.stints.slice().sort((x,y)=>+x.s-+y.s);r.stints=st;r.ages=stintsToAges(st,true);r._ps=JSON.parse(JSON.stringify(st));
      const old=new Set(r.seasons.map(z=>+z.a));syncSeasons(r,!isK);
      st.forEach(t=>{const se=r.seasons.find(z=>+z.a===+t.s);if(se&&!old.has(+se.a)&&!has(se.shirt)){se.shirt=String(rnd()<.8?sh[Math.floor(rnd()*sh.length)]:2+Math.floor(rnd()*38));markAuto(se,'shirt')}});
    }
    r.seasons.forEach(se=>{const x=tl.find(y=>y.a===+se.a);if(!x)return;se.pf=x.f;if(x.ps)se.ps=x.ps;else delete se.ps;if(x.loan&&!x.forced&&se.tr.indexOf('임대')<0)se.tr.push('임대')});
  });
  return rows;
}

/* 직접 입력한 선수 정보 · 직접 고른 클럽 · 직접 입력한 시즌 값은 그대로 두고, 비어 있거나 자동으로 채운 칸만 새로 만든다 */
function fullGen(d){
  const rnd=mulberry(hstr(Date.now()+'|'+Math.random()));
  const ia=new Set(d.iau||[]),free=k=>!has(d[k])||ia.has(k),put=(k,v)=>{d[k]=String(v);ia.add(k)};
  fgClearHonors(d);

  const uh=s=>(s.tr||[]).some(t=>TR_REC.indexOf(t)<0)||(s.aw||[]).length>0;
  d.careers.forEach(c=>c.seasons.forEach(s=>{if((s.au||[]).indexOf('pos')>=0){s.pos='';s.au=s.au.filter(x=>x!=='pos')}}));
  /* 1) 선수 정보 */
  if(free('nation'))put('nation',NAT[Math.floor(rnd()*NAT.length)].n);
  if(free('name')){const taken=new Set(S.players.filter(p=>p.id!==d.id).map(p=>String(p.name).toUpperCase()));put('name',randomName(d.nation,taken))}
  if(free('foot')){const u=rnd();put('foot',u<.55?'오른발':u<.9?'왼발':'양발')}
  const posFree=ia.has('pos')||(!d.id&&d.pos==='ST'&&!(d.subpos||[]).length);
  if(posFree){const g=genPositions(rnd,d.foot);d.pos=g.pos;d.subpos=g.subs;ia.add('pos')}
  if(free('height')||free('weight')){const b=genBody(rnd,d.pos);if(free('height'))put('height',b.h);if(free('weight'))put('weight',b.w)}
  ['ovr0','ovrMin','valMin','valMax'].forEach(k=>{if(ia.has(k)){d[k]='';ia.delete(k)}});
  const start=has(d.ovrMin)?num(d.ovrMin):drawStart(rnd,has(d.ovr0)?num(d.ovr0):99);
  if(!has(d.ovrMin))put('ovrMin',start);
  if(!has(d.ovr0))put('ovr0',drawPeak(rnd,start));
  const peak=num(d.ovr0);
  d.iau=Array.from(ia);
  CYC=natCycle(d);
  /* 2) 클럽 경력: 직접 고른 클럽이 없을 때만 자동 구성 (자동으로 만든 클럽은 다시 누르면 새로 만든다) */
  /* 자동으로 만든 클럽이라도 직접 고른 개인 수상 · 트로피가 있으면 그 클럽 · 나이는 그대로 둔다 */
  d.careers=d.careers.filter(c=>!c.fa||c.seasons.some(uh));
  const gk=d.pos==='GK';
  const kept=d.careers.filter(c=>c.fa&&c.kind!=='nat'),forced={};
  /* 고정하는 것은 직접 고른 수상 · 트로피가 있는 시즌(나이)만. 나머지 나이는 새로 만든다 */
  kept.forEach(c=>{c.seasons=c.seasons.filter(uh);c.stints=runs(c.seasons.map(x=>x.a).join(','));c.ages=stintsToAges(c.stints,true);c._ps=JSON.parse(JSON.stringify(c.stints))});
  let a0=wpick(rnd,[16,17,18,19],a=>({16:60,17:25,18:12,19:3})[a]);
  let end=clamp(Math.round(34+(gk?2:0)+gauss(rnd)*2.3),Math.max(a0+8,30),AGE_MAX);
  const L=fgLeagues(),home=fgHome(L,d.nation),L2=fgLeagues2(L);
  kept.forEach(c=>{const lg=L.concat(L2).find(l=>l.n===c.league)||{co:'',n:c.league,clubs:[c.club],t:clamp(FG_TIER[c.league]||3,1,4),reg:''};parseAges(c.ages).forEach(a=>{forced[a]={club:c.club,lg:lg};a0=Math.min(a0,a);end=Math.max(end,a)})});
  if(!d.careers.some(c=>c.kind!=='nat'&&!c.fa)){
    const rows=fgSimRows(d,rnd,fgSim(rnd,L,home,a0,end,start,peak,forced),kept);
    const ni=d.careers.findIndex(c=>c.kind==='nat');
    if(ni>=0)d.careers.splice(ni,0,...rows);else d.careers=d.careers.concat(rows);
    {const cl=d.careers.filter(c=>c.kind!=='nat').sort((x,y)=>(parseAges(x.ages)[0]||99)-(parseAges(y.ages)[0]||99)),nt=d.careers.filter(c=>c.kind==='nat');d.careers=cl.concat(nt)}
  }else{
    /* 직접 고른 클럽 중 활동 기간이 비어 있는 클럽: 앞 클럽 다음 나이부터 순서대로 채운다 */
    const need=d.careers.filter(c=>c.kind!=='nat'&&!parseAges(c.ages).length);
    if(need.length){
      let a=d.careers.some(c=>c.kind!=='nat'&&parseAges(c.ages).length)?nextStart(d):a0;
      need.forEach((c,i)=>{
        const last=i===need.length-1,len=last?Math.max(1,Math.min(end-a+1,6)):1+Math.floor(Math.pow(rnd(),.9)*5);
        if(a>AGE_MAX)return;
        const ln=Math.min(len,AGE_MAX-a+1);
        c.stints=[{s:String(a),y:String(ln)}];c.ages=stintsToAges(c.stints,true);c._ps=JSON.parse(JSON.stringify(c.stints));syncSeasons(c,false);
        const sh=FG_SHIRT[d.pos]||[7,8,9,10,11];if(c.seasons[0]&&!has(c.seasons[0].shirt)){c.seasons[0].shirt=String(sh[Math.floor(rnd()*sh.length)]);markAuto(c.seasons[0],'shirt')}
        a+=ln;
      });

  }
  /* 3) 국가대표: 비어 있거나 자동으로 만든 경우에만. 최대 OVR이 높을수록 발탁될 확률이 높다 */
  let nc=d.careers.find(c=>c.kind==='nat');
  if(!nc){nc=blankCareer('','','nat');d.careers.push(nc)}
  if((nc.fa&&!nc.seasons.some(uh))||!nc.seasons.length){
    nc.fa=true;nc.seasons=[];nc.stints=[{s:'',y:''}];nc.ages='';
    const call=clamp((peak-66)/16,0,1),cq=clubSeq(d),lastA=cq.length?num(cq[cq.length-1].a):33;
    if(cq.length&&rnd()<call){
      const debut=clamp(Math.round(23-(peak-70)/5+gauss(rnd)*1.2),17,27);
      const s0=peak>=76&&debut>18?Math.max(17,debut-2-Math.floor(rnd()*3)):debut;
      const e=clamp(Math.min(lastA,Math.round(33+(peak-78)/6+gauss(rnd)*1.5)),debut,lastA);
      nc.stints=[{s:String(s0),y:String(e-s0+1)}];nc.ages=stintsToAges(nc.stints,false);nc._ps=JSON.parse(JSON.stringify(nc.stints));syncSeasons(nc,true);
      nc.seasons.forEach(s=>{const x=+s.a;if(x<debut&&x<24){s.nt=x<=20?'U20':'U23';
        /* 청소년 대표 대회: 올림픽(월드컵 2년 뒤) · 아시안게임(월드컵과 같은 해, 아시아 국가만) */
        if(CYC(x-2)==='WC'||(natCont(d)==='아시아'&&CYC(x)==='WC'))s.intl=true}});
    }else{nc.fa=false}
  }
  /* 4) 서브 포지션: 클럽이든 국가대표든 선택한 서브 포지션이 최소 한 시즌(나이)에는 나오게 (직접 정한 시즌 포지션은 유지), 대표 포지션이 대부분 */
  {
    const cs=[],ns=[];d.careers.forEach(c=>c.seasons.forEach(s=>{(c.kind==='nat'?ns:cs).push(s)}));
    const subs=(d.subpos||[]).filter(p=>p&&p!==d.pos&&PPOS[p]);
    const all=cs.concat(ns),setP_=(s,p)=>{s.pos=p;markAuto(s,'pos')};
    subs.forEach(p=>{
      if(all.some(s=>s.pos===p))return;
      const cf=cs.filter(s=>!s.pos),nf=ns.filter(s=>!s.pos);

  const restore=()=>{const s=new Set(d.iau||[]);keepIa.forEach(k=>{if(has(d[k]))s.add(k)});d.iau=Array.from(s)};
  const rc=autoAll(d,'all','club');if(rc.err){restore();return rc}

  restore();

}

const rpick=a=>a[Math.floor(Math.random()*a.length)];
/* 국적에 맞는 이름 하나를 무작위로 만든다. taken: 이미 쓰인 이름(대문자) 집합 */
function randomName(nation,taken){
  const g=NGRP[nation]||'en',P=NPOOL[g];
  for(let i=0;i<60;i++){
    const sn=rpick(P[0]).replace(/-/g,' ');let nm;
    if(g==='kr')nm=`${sn} ${rpick(P[1])} ${rpick(P[2])}`;
    else if(g==='jp'||g==='cn'||g==='vn'||g==='th'){const fn=rpick(P[1]);nm=Math.random()<.6?`${sn} ${fn}`:`${fn.charAt(0)}.${sn}`}
    else{const fn=rpick(P[1]),u=Math.random();nm=u<.45?sn:u<.75?`${fn.charAt(0)}.${sn}`:`${fn} ${sn}`}
    if(!taken||!taken.has(nm))return nm;
  }
  return rpick(P[0]).replace(/-/g,' ');
}
/* ---------- FotMob식 세부 스탯(레이더 · 백분위) / 몸값 추이 그래프 ---------- */
const initOf=s=>{const t=String(s||'').trim();return /^[A-Za-z]/.test(t)?t.slice(0,2).toUpperCase():t.charAt(0)};
const dget=(o,k)=>k==='gl'?o.gl:k==='as'?o.as:k==='cs'?o.cs:k==='ga'?o.ga:num(o.det[k]);
/* 90분당 값 (출전 시간이 없으면 null). 클린 시트·실점은 경기당 */
function rateOf(o,k){
  if(k==='cs'||k==='ga')return o.g>0?dget(o,k)/o.g:null;
  return o.min>0?dget(o,k)/o.min*90:null;
}
/* 레이더 축: [줄바꿈 라벨, 값 함수(90분당), 낮을수록 좋음] — 위쪽 꼭짓점부터 시계 방향 */
const RADAR_F=[[['터치'],o=>o.min>0?dget(o,'tc')/o.min*90:null],[['기회 창출'],o=>o.min>0?dget(o,'kp')/o.min*90:null],[['공중 볼','경합 성공'],o=>o.min>0?dget(o,'ad')/o.min*90:null],
  [['수비적 행동'],o=>o.min>0?(dget(o,'tk')+dget(o,'ic')+dget(o,'bs')+dget(o,'cl'))/o.min*90:null],[['득점'],o=>o.min>0?o.gl/o.min*90:null],[['슛 시도'],o=>o.min>0?dget(o,'sh')/o.min*90:null]];
const RADAR_G=[[['클린 시트'],o=>o.g>0?o.cs/o.g:null],[['실점 억제'],o=>o.g>0?o.ga/o.g:null,1],[['성공한 패스'],o=>o.min>0?dget(o,'pp')/o.min*90:null],
  [['정확한 긴 패스'],o=>o.min>0?dget(o,'lp')/o.min*90:null],[['걷어내기'],o=>o.min>0?dget(o,'cl')/o.min*90:null],[['공중 볼','경합 성공'],o=>o.min>0?dget(o,'ad')/o.min*90:null]];
const FSEC=[['슈팅',[['득점','gl',1],['패널티 득점','pg',1],['슛','sh',1],['유효 슈팅','sot',1]]],
  ['패스',[['어시스트','as',1],['성공한 패스','pp',1],['정확한 긴 패스','lp',1],['기회 창출','kp',1],['큰 기회 만듦','bc',1],['성공한 크로스','cr',1]]],
  ['점유율',[['드리블 성공','dr',1],['볼 경합 성공','du',1],['공중 볼 경합 성공','ad',1],['터치','tc',1],['상대편 박스 내 터치','tb',1],['볼 뺏김','dl',-1],['획득한 파울','fw',1]]],
  ['수비',[['태클','tk',1],['가로채기','ic',1],['막힌 슛','bs',1],['반칙','fc',-1],['볼 회수','rc',1],['공격 지역 볼 탈취','pw',1],['드리블 허용','db',-1],['걷어내기','cl',1],['클린 시트','cs',1],['출전 시 실점','ga',-1]]],

/* 같은 포지션 그룹의 다른 선수들과 비교한 백분위 (0~100). 비교 대상이 없으면 null */
function pctIn(peers,fn,mine,invert){
  if(mine==null)return null;
  if(invert&&!(mine>0))return null;
  const vals=[];peers.forEach(o=>{const v=fn(o);if(v!=null&&v>0)vals.push(v)});
  if(vals.length<2)return null;
  let less=0,eq=0;vals.forEach(v=>{if(v<mine)less++;else if(v===mine)eq++});
  const p=(less+eq/2)/vals.length;
  return Math.round((invert?1-p:p)*100);
}
function peerList(p,scope){
  const g=grp(p),out=[];
  S.players.forEach(q=>{if(q.id!==p.id&&grp(q)===g){const o=cmpAgg(q,scope);if(o.min>0||o.g>0)out.push(o)}});
  return out;
}
function radarSVG(axes){
  const W=360,H=330,cx=180,cy=168,R=92,n=axes.length;
  const ang=i=>(-90+i*(360/n))*Math.PI/180,pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  const poly=r=>axes.map((a,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
  let s=`<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="세부 스탯 레이더 차트: ${axes.map(a=>a.l.join(' ')+' '+(a.p==null?'-':a.p+'%')).join(', ')}">`;
  [1,2/3,1/3].forEach((f,k)=>{s+=`<polygon class="rg${k?' rd':''}" points="${poly(R*f)}"/>`});
  axes.forEach((a,i)=>{const e=pt(i,R);s+=`<line class="ra" x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}"/>`});
  s+=`<polygon class="rp" points="${axes.map((a,i)=>pt(i,R*Math.max(.02,(a.p||0)/100)).map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`;
  axes.forEach((a,i)=>{
    const e=pt(i,R+22),c=Math.cos(ang(i)),anc=c>.3?'start':c<-.3?'end':'middle';
    const lines=a.l.length,top=e[1]-(Math.sin(ang(i))<-.5?(lines-1)*17+14:Math.sin(ang(i))>.5?-4:(lines-1)*8);
    s+=`<text x="${e[0].toFixed(1)}" y="${top.toFixed(1)}" text-anchor="${anc}">`+a.l.map((t,j)=>`<tspan class="rl" x="${e[0].toFixed(1)}" dy="${j?17:0}">${esc(t)}</tspan>`).join('')+`<tspan class="rv" x="${e[0].toFixed(1)}" dy="19">${a.p==null?'-':a.p+'%'}</tspan></text>`;
  });
  return s+'</svg>';
}
function dsScopes(p){
  const ages=new Set();clubsOf(p).forEach(c=>(c.seasons||[]).forEach(s=>{if(STATK.some(k=>k!=='ovr'&&k!=='val'&&k!=='shirt'&&has(s[k])))ages.add(+s.a)}));
  return [['all','통산'],['club','클럽 통산'],['nat','국가대표 통산']].concat(Array.from(ages).sort((a,b)=>a-b).map(a=>['age:'+a,a+'세 시즌']));
}
function fmStatsHTML(p){
  const gk=grp(p)==='GK',scs=dsScopes(p);
  let scope=S.ds||'all';if(!scs.some(x=>x[0]===scope))scope='all';
  const o=cmpAgg(p,scope),hasDet=o.min>0||DETK.some(k=>dget(o,k)>0);
  if(!hasDet&&scope==='all')return '';
  const peers=peerList(p,scope);
  const axes=(gk?RADAR_G:RADAR_F).map(a=>({l:a[0],p:pctIn(peers,a[1],a[1](o),!!a[2])}));
  const sel=`<label class="sel"><span class="sr">범위</span><select id="dsscope">${scs.map(x=>`<option value="${x[0]}"${x[0]===scope?' selected':''}>${x[1]}</option>`).join('')}</select></label>`;
  const noMin=!(o.min>0);
  const secs=FSEC.map(sec=>{
    const rows=sec[1].filter(r=>!(gk&&(r[1]==='gl'||r[1]==='as'||r[1]==='sh'||r[1]==='sot'||r[1]==='pg'))&&dget(o,r[1])>0).map(r=>{
      const k=r[1],tot=dget(o,k),rate=rateOf(o,k),pc=rate==null?null:pctIn(peers,x=>rateOf(x,k),rate,r[2]<0);
      const rs=rate==null?'-':(rate>=10?rate.toFixed(1):rate.toFixed(2));
      return `<div class="fmr"><div class="fml"><span>${r[0]}</span><b>${rs}</b></div><div class="fmb" role="presentation"><i style="width:${pc==null?0:Math.max(2,pc)}%"></i></div><div class="fms"><span>합계 ${fmt(tot)}${k==='cs'||k==='ga'?' · 경기당':' · 90분당'}</span><span>${pc==null?'-':'상위 '+Math.max(1,100-pc)+'%'}</span></div></div>`;
    }).join('');
    return rows?`<div class="fmsec"><h4>${sec[0]}</h4>${rows}</div>`:'';
  }).join('');
  return `<div class="sec"><div class="dsh"><h3>세부 스탯</h3>${sel}</div>
  ${radarSVG(axes)}
  <div class="hint" style="text-align:center">같은 포지션(${GN[grp(p)]}) 다른 선수 ${peers.length}명과 비교한 백분위 · 90분당 기준${peers.length<3?' · 비교할 선수가 3명 이상 등록되면 표시됩니다':''}${noMin?' · 출전 시간이 입력되지 않아 일부 값은 계산할 수 없습니다':''}</div>
  ${secs}</div>`;
}

const CLUB_SKIP=['FC','AS','AC','SC','SSC','RB','CD','CF','SS','US','UD','RC','AFC','1.','알'];
function clubShort(name){
  const n=String(name||'').trim();if(!n)return '';
  if(CLUB_SHORT[n])return CLUB_SHORT[n];
  let w=n.replace(/\([^)]*\)/g,'').split(/\s+/).filter(Boolean);
  while(w.length>1&&CLUB_SKIP.indexOf(w[0])>=0)w.shift();
  while(w.length>1&&(CLUB_SKIP.indexOf(w[w.length-1])>=0||/^\d+$/.test(w[w.length-1])))w.pop();
  let s=w[0]||n;
  return s.length>6?s.slice(0,6):s;
}
function valPts(p){
  const m=new Map();
  clubsOf(p).forEach(c=>(c.seasons||[]).forEach(s=>{
    const v=num(has(s._v)?s._v:s.val),a=+s.a;if(!(v>0)||!(a>0))return;
    const o=m.get(a);if(!o||v>=o.v)m.set(a,{a:a,v:v,club:c.club,o:num(has(s._o)?s._o:s.ovr)});
  }));

}
const niceStep=m=>{const e=Math.pow(10,Math.floor(Math.log10(m/5)));for(const f of [1,2,2.5,5,10]){if(Math.ceil(m/(f*e))<=5)return f*e}return 10*e};
function smoothPath(P,lo,hi){
  if(P.length<2)return '';
  const cl=y=>Math.max(lo,Math.min(hi,y));
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${cl(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${cl(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }

}

  <label class="sr" for="q">선수 검색</label><input id="q" type="search" placeholder="이름, 국적, 포지션, 클럽으로 검색" value="${esc(S.q)}" autocomplete="off"></div>
  <div class="chips" role="group" aria-label="포지션">${chip('grp','all','전체',S.players.length)}${Object.keys(GN).map(k=>chip('grp',k,GN[k],gc[k]||0)).join('')}<button class="chip fvc" data-act="favf" aria-pressed="${!!S.favOnly}">★ 즐겨찾기<span class="cn">${nf}</span></button></div>
  <div class="chips" role="group" aria-label="대륙" style="padding-top:8px">${chip('cont','all','모든 대륙',S.players.length)}${conts.map(c=>chip('cont',c,c,cc[c]||0)).join('')}</div>
  <div class="toolbar"><label class="sel">정렬<select id="sort">${Object.keys(SORTS).map(k=>`<option value="${k}"${S.sort===k?' selected':''}>${SORTS[k][0]}</option>`).join('')}</select></label><span class="tbr" id="tbr"></span><span class="tact"><button type="button" class="sqb" data-act="nav" data-arg="register" aria-label="선수 등록하기" title="선수 등록하기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" class="upb" data-act="import" aria-label="데이터 불러오기" title="데이터 불러오기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M4 15v3.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V15"/></svg></button></span></div>
  <div id="list" class="list"></div><div id="pager" class="pager"></div>`;

function hay(p){return [p.name,p.nation,p.cont,p.pos,GN[grp(p)]].concat(clubsOf(p).map(c=>c.club)).join(' ').toLowerCase()}
const selOn=()=>!isMob()||!!S.selMode;
function tbrHTML(){
  if(!selOn())return '';
  return `<label class="ckall"><input type="checkbox" id="selall"><span>전체 선택</span></label>${isMob()?'<button class="btn sm pri" data-act="seldone">완료</button>':''}<button class="btn sm" id="dlbtn" data-act="dlsave">데이터 저장</button>`;
}
const favIds=()=>new Set((S.meta&&S.meta.fav)||[]);
function listArr(){
  const q=S.q.trim().toLowerCase(),cmp=SORTS[S.sort][1],F=favIds();
  const arr=S.players.filter(p=>(S.grp==='all'||grp(p)===S.grp)&&(S.cont==='all'||p.cont===S.cont)&&(!S.favOnly||F.has(p.id))&&(!q||hay(p).includes(q)));
  arr.sort(cmp);return arr;
}
/* 선택한 선수 수 · 전체 선택 · 저장 버튼 표시 갱신 */
function updSel(){
  const arr=S._arr||[],sel=S.sel||{},n=S.players.filter(p=>sel[p.id]).length,all=arr.length>0&&arr.every(p=>sel[p.id]);
  const b=$('#dlbtn');if(b)b.textContent=n?`선택한 ${n}명 저장`:'데이터 저장';
  const a=$('#selall');if(a){a.checked=all;a.indeterminate=!all&&arr.some(p=>sel[p.id])}
}

  const L=$('#list');if(!L)return;
  if(!S.loaded){L.innerHTML='<div class="empty" style="grid-column:1/-1"><b>선수 데이터를 불러오는 중입니다</b>잠시만 기다려 주세요.</div>';return}
  const tb=$('#tbr');
  if(!S.players.length){if(tb)tb.innerHTML='';L.innerHTML='<div class="empty" style="grid-column:1/-1"><b>아직 등록된 선수가 없습니다</b>첫 선수를 등록해 보세요.<div class="actions" style="justify-content:center;padding-top:14px"><button class="btn pri" data-act="nav" data-arg="register">선수 등록하기</button></div></div>';S._arr=[];return}
  if(tb){const h=tbrHTML();if(tb.innerHTML!==h)tb.innerHTML=h}

  const off=S.page*PS;
  if(pg)pg.innerHTML=np>1?`<button class="btn" data-act="page" data-arg="-1"${S.page===0?' disabled':''}>← 이전</button><span>${S.page+1} / ${np}</span><button class="btn" data-act="page" data-arg="1"${S.page>=np-1?' disabled':''}>다음 →</button>`:'';
  const so=selOn();
  L.innerHTML=arr.slice(off,off+PS).map((p,i)=>`<div class="rw${so&&S.sel[p.id]?' on':''}">${so?`<label class="ck" title="선택"><input type="checkbox" data-sel="${esc(p.id)}"${S.sel[p.id]?' checked':''} aria-label="${esc(p.name)} 선택"></label>`:''}<button class="row" data-act="open" data-arg="${esc(p.id)}"><span class="rk">${off+i+1}</span><span class="av">${initial(p)}</span>
  <span class="nm"><b>${esc(p.name)}</b><small>${esc(p.pos)} · ${esc(p.nation)} · ${esc(p.cont)}</small></span>
  <span class="rt"><span class="ovr ${ovrCls(p.ovr)}">${fmt(p.ovr)}</span><small>${esc(sub(p))}</small></span></button></div>`).join('')+(S.players.length<3?`<div class="addhint"><span>선수를 더 등록해 보세요.</span><button class="btn pri sm" data-act="nav" data-arg="register">선수 등록하기</button></div>`:'');

/* ---------- detail ---------- */
function metricsFor(p){
  const g=grp(p),r=num(p.rating).toFixed(2);
  if(g==='GK')return[['클린시트',fmt(p.cs),1],['클린시트율',(per(p.cs,p.games)*100).toFixed(1)+'%'],['통산 실점',fmt(p.ga)],['경기당 실점',per(p.ga,p.games).toFixed(2)],['골든글러브',fmt(p.gg)],['평균 평점',r,1]];
  if(g==='DF')return[['통산 경기',fmt(p.games)],['평균 평점',r,1],['트로피',fmt(p.trophies)],['발롱도르',fmt(p.bd)],['통산 골',fmt(p.goals)],['통산 어시스트',fmt(p.assists)]];
  return[['통산 골',fmt(p.goals),1],['통산 어시스트',fmt(p.assists)],['공격포인트',fmt(ap(p)),1],['경기당 공격P',per(ap(p),p.games).toFixed(2)],['경기당 골',per(p.goals,p.games).toFixed(2)],['평균 평점',r]];
}
const awChips=s=>(s.aw||[]).map(a=>`<span class="tag ind">${esc(awLabel(a))}</span>`).join('');
const natMiss=se=>!num(se.g)&&!num(se.gl)&&!num(se.as)&&!num(se.rt)&&!num(se.cs)&&!num(se.ga)&&!(se.aw||[]).length&&!(se.tr||[]).length;
const trChips=s=>(s.tr||[]).map(t=>`<span class="tag${t==='강등'?' neg':''}">${esc(tl(t))}</span>`).join('');
const dash=v=>has(v)&&num(v)!==0?fmt(v):'-';
function capText(c){const a=[],cp=roleRuns(c,'_cap'),vc=roleRuns(c,'_vice');if(cp)a.push('주장 '+cp+'세');if(vc)a.push('부주장 '+vc+'세');return a}
const ntTags=se=>{const t=ntOf(se);return (t!=='A'?`<span class="tag ind">${NT_NAME[t]}</span>`:'')+(isWild(se)?'<span class="tag">와일드카드</span>':'')};
const roleTags=se=>(se._cap?'<span class="tag ind">주장</span>':se._vice?'<span class="tag ind">부주장</span>':'');
/* 합계 상세 스탯 (카테고리별) */
function detGroups(totals,p){
  const rows=[['주요 통계',[['평점',p.rt?num(p.rt).toFixed(2):null],['경기',p.g],['출전 시간',totals.min],['득점',p.gl],['어시스트',p.as],['기회 창출',totals.kp],['경고',totals.yc],['퇴장',totals.rd]]],
   ['슈팅',[['득점',p.gl],['패널티 득점',totals.pg],['슛',totals.sh],['유효 슈팅',totals.sot]]],
   ['패스',[['어시스트',p.as],['성공한 패스',totals.pp],['정확한 긴 패스',totals.lp],['기회 창출',totals.kp],['큰 기회 만듦',totals.bc],['성공한 크로스',totals.cr]]],
   ['점유율',[['드리블 성공',totals.dr],['볼 경합 성공',totals.du],['공중 볼 경합 성공',totals.ad],['터치',totals.tc],['상대편 박스 내 터치',totals.tb],['볼 뺏김',totals.dl],['획득한 파울',totals.fw]]],
   ['수비',[['태클',totals.tk],['가로채기',totals.ic],['막힌 슛',totals.bs],['반칙',totals.fc],['볼 회수',totals.rc],['공격 지역 볼 탈취',totals.pw],['드리블 허용',totals.db],['걷어내기',totals.cl],['클린 시트',p.cs],['출전 시 실점',p.ga]]]];
  const any=rows.some(g=>g[1].some(x=>num(x[1])>0&&['득점','어시스트','경기','평점','클린 시트','출전 시 실점'].indexOf(x[0])<0));
  if(!any)return '';
  return rows.map(g=>`<div class="card"><h3>${g[0]}</h3><div class="kv">${g[1].map(x=>`<div><span>${x[0]}</span><b>${x[1]==null?'-':(typeof x[1]==='string'?x[1]:fmt(x[1]))}</b></div>`).join('')}</div></div>`).join('');
}
function careerCard(c,gk,cont){
  const s=cst(c),ss=c.seasons||[];
  const sub=[c.kind==='nat'?'국가대표':(c.league||''),c.ages?c.ages+'세':'',s.shirt&&s.shirt!=='-'?'No.'+s.shirt:''].filter(Boolean).join(' · ');
  const L=gk?['경기','클린시트','실점']:['경기','골','어시'],V=gk?[s.g,s.cs,s.ga]:[s.g,s.gl,s.as];
  const cell=(se,k,carried)=>{const v=carried!=null?carried:se[k];const car=carried!=null&&!has(se[k]);return has(v)&&String(v)!==''?`<span${car?' class="cf" title="전년도 값 자동 적용"':''}>${esc(k==='val'?fmtM(v):v)}</span>`:'-'};
  const isNat=c.kind==='nat';
  const tbl=ss.length?`<div class="tw"><table class="tb"><thead><tr><th>나이</th><th>OVR</th>${isNat?'':'<th>몸값</th>'}<th>번호</th><th>경기</th>${gk?'<th>클린</th><th>실점</th>':'<th>골</th><th>어시</th>'}<th>평점</th><th>수상 · 트로피</th></tr></thead><tbody>${ss.map(se=>`<tr><td>${se.a}</td><td>${cell(se,'ovr',se._o)}</td>${isNat?'':`<td>${cell(se,'val',se._v)}</td>`}<td>${cell(se,'shirt',se._s)}</td><td>${dash(se.g)}</td>${gk?`<td>${dash(se.cs)}</td><td>${dash(se.ga)}</td>`:`<td>${dash(se.gl)}</td><td>${dash(se.as)}</td>`}<td>${num(se.rt)?num(se.rt).toFixed(1):'-'}</td><td class="chp">${isNat&&natMiss(se)?'<span class="tag">미소집</span>':''}${isNat?ntTags(se):''}${roleTags(se)}${awChips(se)}${trChips(se)}</td></tr>`).join('')}</tbody></table></div>`:'';
  const lt=(c.lt||[]).filter(t=>num(t.c)>0),caps=capText(c);
  const det=ss.length?detGroups(s.det,{rt:s.rt,g:s.g,gl:s.gl,as:s.as,cs:s.cs,ga:s.ga}):'';
  return `<div class="card"><div class="ch"><div><h3>${esc(c.club)}</h3><small>${esc(sub)}</small></div>${rchip(s.rt)}</div>
  <div class="st"><div><b>${fmt(V[0])}</b><span>${L[0]}</span></div><div><b>${fmt(V[1])}</b><span>${L[1]}</span></div><div><b>${fmt(V[2])}</b><span>${L[2]}</span></div></div>
  ${(!s.any&&ss.length)?'<div class="hint">연도별 경기·골·어시 기록이 아직 없어 기존 합계를 표시합니다.</div>':''}
  ${caps.length?`<div class="tags">${caps.map(t=>`<span class="tag ind">${esc(t)}</span>`).join('')}</div>`:''}
  ${lt.length?`<div class="tags">${lt.map(t=>`<span class="tag ind">${esc(tl(t.n))} ${t.c}회 (연도 미상)</span>`).join('')}</div>`:''}
  ${tbl}${det?`<details><summary class="hint sm">상세 스탯 합계 보기</summary><div class="detgrid">${det}</div></details>`:''}
  ${(c.ex&&c.ex.length)?`<div class="tags">${c.ex.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}${c.notes?`<div class="hint">${esc(c.notes).split(' / ').join('<br>')}</div>`:''}</div>`;
}
function detailHTML(p,preview){
  const gk=grp(p)==='GK';

    ${p.memo?`<div class="sec"><h3>메모</h3><div class="card" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.memo)}</div></div>`:''}`;
  }else if(S.tab==='clubs'){
    body=`<div class="sec">${clubsOf(p).map(c=>careerCard(c,gk)).join('')||'<div class="empty">등록된 클럽 경력이 없습니다.</div>'}</div>`;
  }else if(S.tab==='nat'){
    body=`<div class="sec">${nats(p).filter(c=>(c.seasons||[]).length||(c.lt||[]).length||num((c.agg||{}).g)).map(c=>careerCard(c,gk)).join('')||'<div class="empty">등록된 국가대표 경력이 없습니다.</div>'}</div>`;
  }else{
    const m=p.trophyMap||{},keys=Object.keys(m).sort((a,b)=>m[b]-m[a]);
    const byAge={};
    (p.careers||[]).forEach(c=>(c.seasons||[]).forEach(se=>{
      const a=+se.a,tr=(se.tr||[]).filter(t=>TR_REC.indexOf(t)<0),aw=se.aw||[];

      tr.forEach(t=>{B.tr[t]=(B.tr[t]||0)+1});aw.forEach(x=>{const l=awLabel(x);B.aw[l]=(B.aw[l]||0)+1});
      if(B.clubs.indexOf(cn)<0)B.clubs.push(cn);
    }));
    const ageRows=Object.keys(byAge).map(Number).sort((x,y)=>x-y).map(a=>{const B=byAge[a];
      const chips=Object.keys(B.tr).map(t=>`<span class="tag${TR_NAT.indexOf(t)>=0?' ind':''}">🏆 ${esc(tl(t))}${B.tr[t]>1?' ×'+B.tr[t]:''}</span>`).join('')+Object.keys(B.aw).map(l=>`<span class="tag ind">${esc(l)}${B.aw[l]>1?' ×'+B.aw[l]:''}</span>`).join('');
