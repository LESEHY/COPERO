/* ---------- 입력 검증: 저장 전 막아야 하는 오류 ---------- */
function validateDraft(d){
  CYC=natCycle(d);
  const errs=[],keys=new Set();
  const add=(k,m)=>{if(k)keys.add(k);if(m)errs.push(m)};
  const mn=has(d.ovrMin)?num(d.ovrMin):null,mx=has(d.ovr0)?num(d.ovr0):null;
  if(mn!=null&&(mn<0||mn>99))add('ovrMin','최소 OVR은 0~99 사이로 입력하세요.');
  if(mx!=null&&mx>99)add('ovr0','최대 OVR은 99 이하로 입력하세요.');
  if(mn!=null&&mx!=null&&mn>mx){add('ovrMin',`최소 OVR(${mn})이 최대 OVR(${mx})보다 높습니다.`);add('ovr0','')}
  if(d.tot)['g','gl','as','cs','ga'].forEach(k=>{if(has(d.tot[k])&&!(num(d.tot[k])>=0&&/^\d+$/.test(String(d.tot[k]).trim())))add('tot.'+k,'통산 스탯은 0 이상의 정수로 입력하세요.')});
  const vn=has(d.valMin)?num(d.valMin):null,vx=has(d.valMax)?num(d.valMax):null;
  if(vn!=null&&(vn<VMIN||vn>VMAX))add('valMin','최소 몸값은 €100K(0.1) ~ €350M(350) 사이로 입력하세요. (단위: €M)');
  if(vx!=null&&(vx<VMIN||vx>VMAX))add('valMax','최대 몸값은 €100K(0.1) ~ €350M(350) 사이로 입력하세요. (단위: €M)');
  if(vn!=null&&vx!=null&&vn>vx){add('valMin',`최소 몸값(${vn})이 최대 몸값(${vx})보다 큽니다.`);add('valMax','')}
  if(!errs.length&&(vn!=null||vx!=null))d.careers.forEach(c=>c.seasons.forEach(s=>{if(c.kind==='nat'||!has(s.val)||isAuto(s,'val'))return;const v=num(s.val);
    if(vn!=null&&v<vn)add('', `${c.club} ${s.a}세 몸값(${fmtM(v)})이 최소 몸값(${fmtM(vn)})보다 낮습니다.`);
    if(vx!=null&&v>vx)add('', `${c.club} ${s.a}세 몸값(${fmtM(v)})이 최대 몸값(${fmtM(vx)})보다 높습니다.`)}));
  d.careers.forEach((c,ci)=>{
    const nt=c.kind==='nat';
    c.seasons.forEach((s,si)=>{
      const pf='careers.'+ci+'.seasons.'+si+'.',lb=`${nt?'국가대표':c.club} ${s.a}세`,g=num(s.g);
      if(!nt&&has(s.ovr)){
        const v=num(s.ovr);
        const fl=mn!=null?(mn>=80?75:mn):null;
        if(v>99)add(pf+'ovr',`${lb}: OVR은 99를 넘을 수 없습니다.`);
        else if(fl!=null&&v<fl)add(pf+'ovr',`${lb}: OVR ${v}은(는) 허용 하한 ${fl}보다 낮아 저장할 수 없습니다.${mn>=80?' (최소 OVR이 80 이상이면 75까지 내려갈 수 있습니다)':''}`);
        else if(mx!=null&&v>mx)add(pf+'ovr',`${lb}: OVR ${v}은(는) 최대 OVR ${mx}보다 높아 저장할 수 없습니다.`);
      }
      if(!nt&&has(s.val)){const vv=num(s.val);if(vv>350)add(pf+'val',`${lb}: 몸값은 최대 €350M(350)까지 입력할 수 있습니다.`);else if(vv<VMIN)add(pf+'val',`${lb}: 몸값은 최소 €100K(0.1)부터 입력할 수 있습니다.`)}
      if(!nt&&g>70)add(pf+'g',`${lb}: 클럽 경기수는 1년에 최대 70경기입니다.`);
      if(nt){const cap=natCapOf(s),tm=ntOf(s);
        if(g>cap)add(pf+'g',`${lb}: 이 시즌 대표팀 경기수는 최대 ${cap}경기입니다. (월드컵·대륙 대회 시즌 20경기 · 네이션스리그/청소년 대회 시즌 14경기 · 그 외 10경기)${natIntl(s)?'':' 국제대회 시즌이라면 ‘기타’에서 ‘국제대회 참가’를 켜 주세요.'}`);
        if(tm==='U20'&&+s.a>20)add(pf+'nt',`${lb}: U-20 대표팀은 20세 이하만 선택할 수 있습니다.`);
        (s.tr||[]).forEach(x=>{if(TR_NAT.indexOf(x)>=0&&!natTrOK(x,tm))add(pf+'tr',`${lb}: ${x}은(는) ${NT_NAME[tm]}에서 선택할 수 없는 트로피입니다. (${tm==='A'?'A대표팀은 월드컵·대륙 대회·네이션스리그':'U-20/U-23은 올림픽·아시안게임'}만 가능)`)});
      }
      if(has(s.min)&&num(s.min)>0){
        const m=num(s.min),mxg=nt?(natIntl(s)?120:100):120;
        if(!(g>0))add(pf+'min',`${lb}: 경기수가 0인데 출전 시간이 입력되어 있습니다.`);
        else if(m<g)add(pf+'min',`${lb}: 출전 시간은 1경기당 최소 1분입니다. (${g}경기 → ${g}분 이상)`);
        else if(m>g*mxg)add(pf+'min',`${lb}: 출전 시간이 경기수에 비해 너무 큽니다. (1경기 최대 ${mxg}분 → ${g*mxg}분 이하)`);
      }
    });
  });
  return{errs:errs,keys:keys};
}
/* 합계 입력과 연도별 합이 맞는지 안내 */
function aggCheck(c,gk){
  const ag=c.agg||{},keys=gk?['g','cs','ga','rt']:['g','gl','as','rt'],LB={g:'경기',gl:'골',as:'어시',cs:'클린시트',ga:'실점',rt:'평점'};
  const act=keys.filter(k=>has(ag[k])&&(k==='rt'?num(ag[k])>0:true)&&(c.aau||[]).indexOf(k)<0);
  if(!act.length||!c.seasons.some(s=>keys.some(k=>has(s[k]))))return '';
  const diff=[];
  act.forEach(k=>{
    let sum,tgt=num(ag[k]);
    if(k==='rt'){const r=c.seasons.map(s=>num(s.rt)).filter(v=>v>0);sum=r.length?r.reduce((a,b)=>a+b,0)/r.length:0;if(Math.abs(sum-tgt)>=.005)diff.push(`${LB[k]} ${Math.round(sum*100)/100}/${tgt}`)}
    else{sum=c.seasons.reduce((t,s)=>t+num(s[k]),0);if(sum!==tgt)diff.push(`${LB[k]} ${sum}/${tgt}`)}
  });
  return diff.length?`<div class="hint" style="color:var(--bad)">연도별 합이 입력한 합계와 다릅니다 (연도별/합계): ${diff.join(' · ')} — ‘자동 생성’ 또는 ‘재생성’을 누르면 합계에 맞춰 다시 나눕니다.</div>`:`<div class="hint" style="color:var(--good,#2a9d6f)">✓ 연도별 합이 입력한 합계와 정확히 일치합니다.</div>`;
}

async function save(){
  const d=S.draft;S.formErr='';
  if(!d.name.trim())S.formErr='이름을 입력하세요.';
  else if(!d.nation.trim())S.formErr='국적을 선택하세요.';
  if(!S.formErr){
    for(let i=0;i<d.careers.length&&!S.formErr;i++){
      const c=d.careers[i],e=ageConflict(d,i);
      if(e)S.formErr=(c.kind==='nat'?'국가대표':c.club)+': '+e;
      else{
        const oob=c.seasons.find(s=>seasonHas(s)&&(+s.a<AGE_MIN||+s.a>AGE_MAX));
        if(oob)S.formErr=`${c.kind==='nat'?'국가대표':c.club} ${oob.a}세: 나이는 ${AGE_MIN}~${AGE_MAX}세만 가능합니다. 해당 나이 칸을 삭제해 주세요.`;
      }
    }
    if(!S.formErr){const ve=validateDraft(d).errs;if(ve.length)S.formErr=ve[0]+(ve.length>1?` (외 ${ve.length-1}건)`:'')}
  }
  if(S.formErr){render();return}
  if(!DB||!S.col){S.formErr='데이터베이스에 연결되지 않았습니다. 로그인 상태를 확인하세요.';render();return}
  S.saving=true;
  try{
    const doc=buildDoc();delete doc.trophyMap;delete doc.det;delete doc.capN;let id=d.id;
    doc.careers.forEach(c=>c.seasons.forEach(s=>{delete s._o;delete s._co;delete s._v;delete s._cv;delete s._s;delete s._cs}));
    {const pr=id&&S.raw&&S.raw[id];const pj=pr?pr.proj:projCur();if(pj)doc.proj=pj}
    const clean=JSON.parse(JSON.stringify(doc));
    if(id)await DB.doc(S.col+'/'+id).set(clean);else{const ref=await DB.collection(S.col).add(clean);id=ref.id}
    const local=derive(Object.assign({id:id},JSON.parse(JSON.stringify(clean))));
    S.all=(S.all||S.players).filter(p=>p.id!==id).concat([local]);S.raw=S.raw||{};S.raw[id]=clean;applyProj();
    S.saving=false;clearDraftSlot(S.draft&&S.draft.id?S.draft.id:'new');S.draft=null;S.preview=false;S.pid=id;S.view='detail';S.tab='overview';toast('저장했습니다. 등록한 선수 화면으로 이동했습니다.');render();window.scrollTo(0,0);
  }catch(e){S.saving=false;S.formErr='저장하지 못했습니다. '+((e&&e.message)||'');render()}
}

}

const STO=()=>S.guest?sessionStorage:localStorage;

const draftEmpty=d=>!d.id&&!d.name&&!d.nation&&!has(d.ovr0)&&!has(d.ovrMin)&&!has(d.valMin)&&!has(d.valMax)&&!(d.tot&&['g','gl','as','cs','ga'].some(k=>has(d.tot[k])))&&!(d.subpos||[]).length&&!d.memo&&!d.height&&!d.weight&&!d.foot&&!Object.keys(d.awx||{}).length&&!d.careers.some(c=>c.kind!=='nat'||c.seasons.length||c.ages||num((c.stints[0]||{}).s)||(c.lt||[]).length);

function saveDraftNow(){
  clearTimeout(svT);if(!S.draft||S.view!=='register')return;

  let skip=draftEmpty(d);
  if(!skip&&d.id){const pl=byId(d.id);if(pl){try{skip=JSON.stringify(draftFrom(pl))===JSON.stringify(d)}catch(e){}}}
  if(skip){if(m[k]){delete m[k];writeSlots(m)}return}
  m[k]={d:d,rtab:S.rtab,cc:S.cc,cl:S.cl,t:Date.now()};writeSlots(m);
  const el=$('#autosv');if(el){const t=new Date();el.textContent='✓ 자동 저장됨 · '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}

 autonat:['국가대표 자동 생성 (스탯)',[
  '<b>국가대표 전용</b> 기능입니다. 클럽 값(OVR·몸값·스탯)은 바뀌지 않습니다. 국제대회가 있는 시즌은 1년 최대 20경기, 없는 시즌은 최대 10경기로 생성됩니다. 국제대회 시즌은 월드컵·대륙 대회 트로피가 있는 시즌을 기준으로 실제 일정처럼 자동 설정됩니다(예: 23세에 월드컵 → 24세는 아시안컵·네이션스리그 등이 있던 시기). 시즌의 ‘기타 → 국제대회 참가’에서 직접 바꿀 수도 있습니다. 국가대표 OVR은 같은 나이의 클럽 OVR과 동일합니다. 합계를 입력했다면 모든 시즌의 합이 합계와 정확히 같아집니다.',
  '‘자동 생성’은 자동 생성된 값을 새로 만들고(직접 입력한 값은 유지), ‘지우기’는 국가대표 경력 전체(직접 입력한 내용 포함)를 지웁니다(되돌리기로 복구). ‘되돌리기’ · ‘복구’ · ‘고정’은 클럽과 똑같이 동작합니다.']],
 pos:['대표 포지션 · 서브 포지션',['대표 포지션은 목록에서 직접 고릅니다. 서브 포지션은 아래 경기장에서 포지션을 눌러 선택/해제합니다. (빨강 = 대표, 파랑 = 서브)','클럽·국가대표의 나이별 칸에서 시즌별 포지션을 고르면 그 포지션이 서브 포지션에 자동으로 추가됩니다. 시즌별 포지션을 고르지 않으면 대표 포지션으로 처리되며, 자동 스탯도 그 시즌의 포지션 기준으로 만들어집니다.']],
 ovr:['OVR 범위',['OVR은 <b>최소 OVR ~ 최대 OVR</b> 범위 안에서만 자동 생성되고, 시즌별로 직접 입력하는 OVR도 이 범위를 벗어나면 저장할 수 없습니다. 자동 생성 시 최대 OVR은 선수 생활 중 한 번 반드시 달성되지만, 최소 OVR은 달성하지 않아도 됩니다. 최소 OVR은 <b>시작 OVR(첫 시즌 OVR)</b>입니다. 비워 두면 자동 생성 때 확률에 따라 정해지고, 그 아래로는 내려가지 않습니다. 단, 최소 OVR이 80 이상이면 나이가 많고 부진할 때 75까지 내려갈 수 있습니다. OVR은 어떤 경우에도 99를 넘지 않습니다. 최대 OVR에 도달한 뒤 성적이 좋으면 최대 3시즌까지 유지될 수 있습니다(1시즌째 높은 확률 → 2시즌째 보통 → 3시즌째 낮은 확률). 최소 OVR은 선수 상세 화면에 표시되지 않습니다.']],
 val:['몸값 범위',['<b>최소/최대 몸값</b>(단위 €M, 예: 0.5 = €500K, 120 = €120M)을 입력하면 자동 생성되는 몸값이 그 범위 안에서만 만들어집니다. 직접 입력한 몸값이 범위를 벗어나면 저장할 수 없고, 비워 두면 자동으로 정해집니다. 몸값은 최소 €1K(0.001) ~ 최대 €350M(350)이며, 선수의 최대 몸값은 연도별 몸값 중 가장 높은 값이 자동 반영됩니다.']],
 name:['이름 자동 부여',['국적에 맞는 이름을 무작위로 만들어 줍니다. 누를 때마다 바뀌며, 직접 입력해도 됩니다.']],
 clubpick:['클럽 선택',['국가 → 리그 → 클럽 순으로 고르세요. 선수가 거친 클럽을 모두 선택할 수 있습니다. 클럽을 모두 고른 뒤에는 ‘숨기기’로 목록을 접어 두면 스크롤을 줄일 수 있습니다.']],
 clubcareer:['클럽 경력 입력',['클럽마다 나이 범위를 입력하면 나이별로 OVR · 몸값 · 등번호 · 경기 · 골 · 어시(골키퍼는 클린시트 · 실점) · 평점과 개인 수상, 팀 우승 트로피, 상세 스탯을 기록할 수 있습니다. 클럽 경기수는 1년에 최대 70경기입니다.','시즌마다 <b>포지션</b>을 고르면 그 시즌의 자동 스탯이 해당 포지션 기준으로 만들어지고(고르지 않으면 대표 포지션), 선택한 포지션은 선수 정보의 서브 포지션에 자동으로 추가됩니다.','<b>고정</b>은 시즌 또는 클럽 단위로 켤 수 있으며, 고정된 곳의 입력된 값은 자동 생성·지우기를 눌러도 바뀌지 않습니다(상세 스탯 제외). <b>숨기기</b>는 화면에서만 접어 두는 기능이라 자동 생성에는 그대로 포함됩니다. 클럽의 모든 나이를 숨기면 클럽도 자동으로 숨겨집니다.']],
 natcareer:['국가대표 경력 입력',['대표팀은 1개만 입력할 수 있고, 아무것도 입력하지 않으면 저장되지 않습니다. 국적의 대륙에서 참가할 수 없는 대회는 숨겨집니다. 나이별 칸에서 시즌별 포지션 · 고정 · 숨기기를 클럽과 똑같이 사용할 수 있습니다.','시즌마다 대표팀(A대표팀 · U-23 · U-20)을 고를 수 있습니다. U-20은 20세 이하만 선택할 수 있고, 24세 이상이 U-23에 뽑히면 ‘와일드카드’ 표시가 붙습니다. 선택한 대표팀에 맞는 트로피(A대표팀: 월드컵·대륙컵·네이션스리그 / U-23·U-20: 올림픽·아시안게임)만 표시됩니다.']],
 tot:['클럽 통산 스탯',['모든 클럽에서 뛴 통산 경기수 · 골 · 어시스트(골키퍼는 경기수 · 클린시트 · 실점)를 직접 입력할 수 있는 칸입니다. 비워 두면 아무 영향이 없습니다.','입력한 뒤 ‘자동 생성’을 누르면 모든 클럽 시즌의 합이 입력한 통산과 <b>정확히 같아지도록</b> 시즌별 스탯이 나눠집니다. 직접 입력한 시즌 값과 고정된 값은 그대로 두고, 클럽별 합계를 입력한 클럽은 그 값이 우선입니다. 국가대표 스탯은 통산에 포함되지 않습니다.']]
};
function infoHTML(){
  const I=INFO[S.info];if(!I)return '';
  return `<div class="cfm" role="dialog" aria-modal="true" aria-labelledby="inft"><div class="box scr"><b id="inft" style="font-size:17px">${I[0]}</b><div class="infob">${I[1].map(p=>`<p>${p}</p>`).join('')}</div><div class="actions" style="padding-top:14px;justify-content:flex-end"><button class="btn pri" data-act="infoclose">확인</button></div></div></div>`;
}
/* ---------- 왼쪽 메뉴 (드로어) ---------- */
function drawUpd(){
  const pi=document.querySelector('.dritem[data-arg=projects]');if(pi){pi.classList.toggle('dis',!!S.guest);if(S.guest)pi.textContent='프로젝트 (로그인 필요)';else pi.innerHTML='프로젝트 - <span class="drsub">'+esc(projName())+'</span>';pi.title=pi.textContent}
  const ft=$('#drfoot');if(!ft)return;
  const au=window.__auth,logged=!!(au&&au.logged),nm=S.uname||(au&&au.name)||'',em=(au&&au.email)||'';
  const ini=(nm||'?').trim().charAt(0).toUpperCase();
  const panel=S.profOpen?`<div class="profpanel" role="region" aria-label="계정 정보">${logged?`<div class="pr"><span>닉네임</span><b>${esc(nm||'-')}</b></div>${em?`<div class="pr"><span>이메일</span><b>${esc(em)}</b></div>`:''}<button class="btn" data-act="logout">로그아웃</button>`:`<div class="pr"><span>로그인하지 않았습니다</span></div><button class="btn pri" data-act="login">Google로 로그인</button>`}</div>`:'';
  ft.innerHTML=`${panel}<button class="prof" data-act="profile" aria-expanded="${!!S.profOpen}"><span class="pav">${logged?esc(ini):'?'}</span><span class="pnm">${logged?esc(nm||'프로필'):'로그인'}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="${S.profOpen?'M6 15l6-6 6 6':'M6 9l6 6 6-6'}"/></svg></button>`;
}
function openDrawer(on){
  on=!!on;if(!on&&!S.drawer&&!document.body.classList.contains('drawopen'))return;
  S.drawer=on;if(!on)S.profOpen=false;
  const dr=$('#drawer'),sc=$('#scrim'),mb=document.querySelector('.menubtn');
  if(!dr)return;drawUpd();
  dr.classList.toggle('open',on);sc.classList.toggle('open',on);dr.setAttribute('aria-hidden',on?'false':'true');
  document.body.classList.toggle('drawopen',on);if(mb)mb.setAttribute('aria-expanded',on);
  if(on){const x=dr.querySelector('.drx');if(x)setTimeout(()=>x.focus({preventScroll:true}),30)}else if(mb&&document.activeElement&&dr.contains(document.activeElement))mb.focus({preventScroll:true});
}
/* ---------- render ---------- */
function render(){S.inR=true;try{render0()}finally{S.inR=false}}
function render0(){render1();postRender()}
function render1(){
  const a=$('#app');
  document.querySelectorAll('.tab').forEach(t=>{const v=t.getAttribute('data-arg'),on=(v==='home'&&(S.view==='home'||S.view==='detail'))||v===S.view;if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  document.body.classList.toggle('inreg',S.view==='register'&&!S.loginNeeded);
  drawUpd();
  pmenuUpd();
  document.body.style.overflow=(S.preview&&S.view==='register')||(S.view==='register'&&(S.info||S.cdel!=null))||(S.cmp.pick&&S.view==='compare')||(S.delAsk&&S.view==='detail')?'hidden':'';
  if(S.loginNeeded){a.innerHTML=`<div class="empty" style="padding:56px 16px"><b style="font-size:20px">로그인이 필요합니다</b>Google 계정으로 로그인하면 내 선수 목록이 저장되고, 다른 기기에서도 볼 수 있습니다.${(window.__auth&&window.__auth.err)?`<div class="err" role="alert" style="margin-top:12px">${esc(window.__auth.err)}</div>`:''}<div class="actions" style="justify-content:center;padding-top:16px"><button class="btn pri" data-act="login">Google로 로그인</button></div></div>`;return}
  if(S.err){a.innerHTML=`<div class="empty"><b>데이터를 불러오지 못했습니다</b>${esc(S.err)}</div>`;return}
  if(S.view==='detail'){const p=byId(S.pid);if(p){a.innerHTML=detailHTML(p);return}if(S.loaded){S.view='home'}}
  if(S.view==='projects'&&!S.guest){a.innerHTML=projectsHTML();return}
  if(S.view==='projects')S.view='home';
  if(S.view==='compare'){a.innerHTML=compareHTML();return}
  if(S.view==='register'){if(!S.draft)startDraft(null);if(!S.cfg){a.innerHTML='<div class="empty"><b>설정을 불러오는 중입니다</b></div>';return}a.innerHTML=formHTML()+(S.preview?previewHTML():'')+cdelHTML()+infoHTML();return}
  a.innerHTML=homeHTML();renderList();
}
function go(v){capture();S.delAsk=false;if(v==='register'&&!S.draft)S.rtab='info';S.view=v;S.delArm=false;S.panel='';S.natOpen=false;S.ccOpen=false;S.preview=false;S.cmp.pick=null;if(v==='register'&&!S.draft)startDraft(null);render();window.scrollTo(0,0)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(S.view==='register'&&S.draft&&(!t||t.getAttribute('data-act')!=='nav'))capture();
  if((S.natOpen||S.ccOpen)&&!e.target.closest('.natwrap')){S.natOpen=false;S.ccOpen=false;if(!t&&S.view==='register')render()}
  if(S.pmenuOpen&&!e.target.closest('.pwrap')){S.pmenuOpen=false;pmenuUpd()}
  if(!t)return;
  const act=t.getAttribute('data-act'),arg=t.getAttribute('data-arg'),D=t.dataset;
  const d=S.draft;
  switch(act){
    case'nav':openDrawer(false);if(arg==='projects'&&S.guest){toast('프로젝트는 로그인 후 사용할 수 있습니다.');break}
      if(S.view==='register'&&S.draft){capture();saveDraftNow()}
      if(arg==='register'||(arg==='home'&&S.view==='register')){S.draft=null}
      S.pmenuOpen=false;if(arg==='home'){S.q='';S.grp='all';S.cont='all';S.page=0;S.sort='ovr';S.favOnly=false;S.selMode=false;S.sel={}}go(arg);break;
    case'f':S[D.k]=D.v;S.page=0;render();break;
    case'seldone':S.selMode=false;S.sel={};renderList();break;
    case'open':if(Date.now()-(S.lpAt||0)<700)break;
      if(isMob()&&S.selMode){const rw=t.closest('.rw'),cb=rw&&rw.querySelector('[data-sel]');if(cb){cb.checked=!cb.checked;S.sel=S.sel||{};if(cb.checked)S.sel[arg]=true;else delete S.sel[arg];rw.classList.toggle('on',cb.checked);updSel()}break}
      S.pid=arg;S.tab='overview';S.view='detail';S.delArm=false;S.delAsk=false;S.vsel=null;S.ds='all';render();window.scrollTo(0,0);break;
    case'login':if(window.__auth){S.leaving=true;setTimeout(()=>{S.leaving=false},5000);window.__auth.login()}break;
    case'logout':if(window.__auth)window.__auth.logout();break;
    case'dtab':S.tab=arg;render();break;
    case'rtab':{S.rscroll=S.rscroll||{};S.rscroll[S.rtab]=window.scrollY||0;S.rtab=arg;render();window.scrollTo(0,S.rscroll[arg]||0);break}
    case'page':S.page=Math.max(0,(S.page||0)+(+arg));renderList();{const t=$('#list');if(t)t.scrollIntoView({block:'start'})}break;
    case'cmp':S.b=arg;if(S.a===arg)S.a=null;S.view='compare';render();window.scrollTo(0,0);break;
    case'swap':{const x=S.a;S.a=S.b;S.b=x;render();break}
    case'cmpopen':S.cmp.pick=arg;S.cmp.q='';render();{const q=$('#cmpq');if(q)q.focus()}break;
    case'cmpclose':S.cmp.pick=null;render();break;
    case'cmppick':if(S.cmp.pick==='a')S.a=arg;else S.b=arg;S.cmp.pick=null;render();break;
    case'cmpset':S.cmp[D.k]=D.v;render();break;
    case'edit':S.rtab='info';startDraft(arg);S.panel='';S.natOpen=false;S.ccOpen=false;S.preview=false;S.view='register';render();window.scrollTo(0,0);break;
    case'del':S.delAsk=true;render();break;
    case'delno':S.delAsk=false;render();break;
    case'delyes':S.delAsk=false;DB.doc(S.col+'/'+arg).delete().then(()=>{S.all=(S.all||[]).filter(p=>p.id!==arg);S.players=S.players.filter(p=>p.id!==arg);clearDraftSlot(arg);toast('삭제했습니다');S.view='home';render()}).catch(()=>{toast('삭제하지 못했습니다.');render()});break;
    case'vsel':vSelect(t);break;
    case'dlsave':saveData();break;
    case'padd':S.projNew='프로젝트 '+projNextN();render();break;
    case'pnewno':S.projNew=null;render();break;
    case'pnewok':{const i=$('#pnew'),v=i?i.value.trim():'';if(!v){toast('프로젝트 이름을 입력하세요.');break}projAdd(v);break}
    case'pmenu':if(projList().length<2){S.pmenuOpen=false;S.q='';S.grp='all';S.cont='all';S.page=0;S.sort='ovr';S.favOnly=false;S.selMode=false;S.sel={};go('home');break}S.pmenuOpen=!S.pmenuOpen;pmenuUpd();break;
    case'popen':S.pmenuOpen=false;pmenuUpd();setCur(arg);go('home');toast('‘'+projName()+'’을(를) 열었습니다.');break;
    case'pedit':S.projEdit=arg;render();break;
    case'pcancel':S.projEdit=null;render();break;
    case'psave':projSave(arg);break;
    case'pdel':S.projDel=arg;render();break;
    case'pdelno':S.projDel=null;render();break;
    case'pdelyes':projDelete(arg);break;
    case'fav':toggleFav(arg);break;
    case'favf':S.favOnly=!S.favOnly;S.page=0;render();break;
    case'import':{const fi=$('#impfile');if(fi)fi.click();openDrawer(false);break}
    case'gmove':moveGuest();break;
    case'gskip':skipGuest();break;
    case'importseed':importSeed();break;
    case'skipseed':skipSeed();break;
    case'randname':{d.iau=(d.iau||[]).filter(x=>x!=='name');if(!d.nation){toast('국적을 먼저 선택하세요.');break}const taken=new Set(S.players.filter(p=>p.id!==d.id).map(p=>String(p.name).toUpperCase()));d.name=randomName(d.nation,taken);render();break}
    case'subpos':{d.iau=(d.iau||[]).filter(x=>x!=='pos');const a=d.subpos||(d.subpos=[]),i=a.indexOf(arg);if(i>=0)a.splice(i,1);else if(arg!==d.pos)a.push(arg);render();break}
    case'sfix':{const c=d.careers[+D.ci],s=c&&c.seasons[+D.si];if(s){if(s.fx)delete s.fx;else s.fx=true}keepScroll(c,()=>render());break}
    case'cfix':{const c=d.careers[+arg];if(c){c.fx=!c.fx}keepScroll(c,()=>render());break}
    case'chide':{const c=d.careers[+arg],k=c.kind==='nat'?'nat':c.club;S.hid=S.hid||{};S.hidS=S.hidS||{};
      const allH=c.seasons.length>0&&c.seasons.every(x=>S.hidS[k+'|'+x.a]),isH=!!S.hid[k]||allH;
      if(isH){S.hid[k]=false;if(allH)c.seasons.forEach(x=>{delete S.hidS[k+'|'+x.a]})}else S.hid[k]=true;
      keepScroll(c,()=>render());break}
    case'shide':{const c=d.careers[+D.ci],s=c&&c.seasons[+D.si];if(s){const k=(c.kind==='nat'?'nat':c.club)+'|'+s.a;S.hidS=S.hidS||{};if(S.hidS[k])delete S.hidS[k];else S.hidS[k]=true}keepScroll(c,()=>render());break}
    case'hpick':S.hidePick=!S.hidePick;render();break;
    case'menu':openDrawer(true);break;
    case'menuclose':openDrawer(false);break;
    case'profile':S.profOpen=!S.profOpen;drawUpd();break;
    case'foot':d.foot=d.foot===arg?'':arg;d.iau=(d.iau||[]).filter(x=>x!=='foot');render();break;
    case'natopen':S.natOpen=!S.natOpen;S.ccOpen=false;S.natQ='';render();if(S.natOpen){const q=$('#natq');if(q)q.focus()}break;
    case'natpick':d.nation=arg;d.iau=(d.iau||[]).filter(x=>x!=='nation');S.natOpen=false;S.natQ='';render();break;
    case'ccopen':S.ccOpen=!S.ccOpen;S.natOpen=false;render();break;

  const n=projNextN(),id='p'+Date.now().toString(36);name=String(name||'').trim().slice(0,30)||('프로젝트 '+n);

async function projDelete(id){
  const l=projList();if(l.length<2){toast('프로젝트는 최소 1개가 필요합니다.');return}
  const ids=(S.all||[]).filter(p=>pjOf(p)===id).map(p=>p.id);
  S.projDel=null;
  try{
    for(const pid of ids)await DB.doc(S.col+'/'+pid).delete();
    const m=Object.assign({},S.meta);m.projects=l.filter(x=>x.id!==id);S.meta=m;
    S.all=(S.all||[]).filter(p=>pjOf(p)!==id||false);
    if(projCur()===id)setCur(m.projects[0].id);else applyProj();
    render();toast('프로젝트를 삭제했습니다.');await saveMeta();
  }catch(e){toast('삭제하지 못했습니다: '+((e&&e.message)||''));render()}
}

  const nw=S.projNew!=null;
  return `<button class="back" data-act="nav" data-arg="home">← 선수 검색</button>
  <div class="phd"><h2>프로젝트</h2><button class="btn pri sm" data-act="padd">+ 새 프로젝트</button></div>
  <p class="muted" style="margin:0 0 12px">프로젝트마다 선수가 따로 저장됩니다. 프로젝트 안에서 등록한 선수는 그 프로젝트에 자동으로 저장돼요.</p>
  <div class="plist">${l.map(x=>{const ed=S.projEdit===x.id;return `<div class="prow${x.id===cur?' cur':''}${ed?' ed':''}">${ed
    ?`<input id="pren" class="pin" data-pid="${esc(x.id)}" value="${esc(x.name)}" maxlength="30" aria-label="프로젝트 이름" autocomplete="off"><span class="pact"><button class="btn sm pri" data-act="psave" data-arg="${esc(x.id)}">저장</button><button class="btn sm" data-act="pcancel">취소</button></span>`
    :`<button class="pname" data-act="popen" data-arg="${esc(x.id)}"><b>${esc(x.name)}</b><small>선수 ${cnt(x.id)}명${x.id===cur?' · 사용 중':''}</small></button><span class="pact"><button class="btn sm" data-act="pedit" data-arg="${esc(x.id)}">수정</button><button class="btn sm dng" data-act="pdel" data-arg="${esc(x.id)}"${l.length<2?' disabled title="프로젝트는 최소 1개가 필요합니다"':''}>삭제</button></span>`}</div>`}).join('')}</div>
  ${nw?`<div class="cfm" role="dialog" aria-modal="true" aria-labelledby="pnt"><div class="box"><b id="pnt" style="font-size:17px">새 프로젝트</b><p class="muted" style="margin:6px 0 10px">프로젝트 이름을 입력하세요. 새 프로젝트는 선수가 없는 상태로 시작합니다.</p><input id="pnew" class="pin" style="width:100%" value="${esc(S.projNew)}" maxlength="30" aria-label="새 프로젝트 이름" autocomplete="off"><div class="actions" style="padding-top:16px;justify-content:flex-end"><button class="btn" data-act="pnewno">취소</button><button class="btn pri" data-act="pnewok">만들기</button></div></div></div>`:''}
  ${del?`<div class="cfm" role="alertdialog" aria-modal="true" aria-labelledby="pdt"><div class="box"><b id="pdt" style="font-size:17px">정말로 삭제하시겠습니까?</b><p class="muted" style="margin:8px 0 0">‘${esc(del.name)}’ 프로젝트와 안에 저장된 선수 ${cnt(del.id)}명이 모두 삭제되며 되돌릴 수 없습니다.</p><div class="actions" style="padding-top:16px;justify-content:flex-end"><button class="btn" data-act="pdelno">취소</button><button class="btn dng" data-act="pdelyes" data-arg="${esc(del.id)}">삭제</button></div></div></div>`:''}`;
}
/* ---------- 비로그인(게스트) 저장소: 이 브라우저 탭에만 임시로 유지되며, 서버에는 저장하지 않는다 ---------- */
const GKEY='copero.guest.v1';
function memDB(){
  const store={},subs=[];
  try{Object.assign(store,JSON.parse(sessionStorage.getItem(GKEY)||'{}')||{})}catch(e){}
  const seedApp=window.__SEED_APP||{config:{countries:[]},players:{}};
  const cl=x=>JSON.parse(JSON.stringify(x));
  const persist=()=>{try{sessionStorage.setItem(GKEY,JSON.stringify(store))}catch(e){}};
  const notify=()=>setTimeout(()=>subs.slice().forEach(fn=>{try{fn()}catch(e){}}),0);
  const docsOf=m=>Object.keys(m).map(id=>({id:id,data:()=>cl(m[id])}));
  return{
    collection(col){
      if(col==='players')return{onSnapshot(cb){setTimeout(()=>cb({docs:docsOf(seedApp.players||{})}),0);return()=>{}}};
      return{
        onSnapshot(cb){const fn=()=>cb({docs:docsOf(store)});subs.push(fn);setTimeout(fn,0);return()=>{}},
        async add(doc){const id='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);store[id]=cl(doc);persist();notify();return{id:id}}
      };
    },
    doc(path){
      const id=path.split('/').pop();
      if(path==='config/app')return{onSnapshot(cb){setTimeout(()=>cb({exists:true,data:()=>cl(seedApp.config||{countries:[]})}),0)}};
      return{
        async set(doc){store[id]=cl(doc);persist();notify()},
        async delete(){delete store[id];persist();notify()}
      };
    }
  };
}
window.addEventListener('beforeunload',e=>{
  if(!S.guest||S.leaving)return;
  if(!S.players.length&&!(S.view==='register'&&S.draft&&!draftEmpty(S.draft)))return;
  const m='웹을 종료할 경우 데이터는 저장되지 않습니다. 저장하시려면 로그인하세요.';
  e.preventDefault();e.returnValue=m;return m;
});
/* ---------- 데이터 저장 · 불러오기 · 즐겨찾기 ---------- */
function stamp(){const t=new Date(),p=n=>String(n).padStart(2,'0');return t.getFullYear()+p(t.getMonth()+1)+p(t.getDate())+'_'+p(t.getHours())+p(t.getMinutes())}
async function saveData(){
  const sel=S.players.filter(p=>S.sel&&S.sel[p.id]),list=sel.length?sel:S.players;
  if(!list.length){toast('저장할 선수가 없습니다.');return}
  const pl=list.map(p=>({id:p.id,data:(S.raw||{})[p.id]})).filter(x=>x.data);
  const fv=favIds();
  const pack={app:'COPERO',v:1,saved:new Date().toISOString(),players:pl,fav:pl.filter(x=>fv.has(x.id)).map(x=>x.id),clubs:((S.meta&&S.meta.clubs)||[])};
  try{
    const dl=await window.claude.use('downloads');
    if(!dl){toast('이 화면에서는 파일 저장을 사용할 수 없습니다.');return}
    await dl.save({filename:'COPERO_선수데이터_'+stamp()+'.json',data:JSON.stringify(pack),mime:'application/json'});
    toast('선수 '+pl.length+'명의 데이터를 파일로 저장했습니다.'+(sel.length?'':' (선택한 선수가 없어 전체를 저장했습니다)'));
  }catch(e){toast('저장하지 못했습니다.')}
}
async function importPack(text){
  let pack;try{pack=JSON.parse(text)}catch(e){toast('올바른 COPERO 데이터 파일이 아닙니다.');return false}
  const arr=Array.isArray(pack)?pack:(pack&&pack.app==='COPERO'&&Array.isArray(pack.players)?pack.players:null);
  if(!arr){toast('올바른 COPERO 데이터 파일이 아닙니다.');return false}
  if(!DB||!S.col){toast('지금은 데이터를 불러올 수 없습니다.');return false}
  let add=0,dup=0,bad=0;const allRaw=Object.assign({},S.raw||{}),cp=projCur(),newFav=[];
  const strip=r=>{const c=Object.assign({},r);delete c.proj;return JSON.stringify(c)};
  const inCur=new Set(Object.keys(allRaw).filter(id=>(allRaw[id].proj||projList()[0].id)===cp).map(id=>strip(allRaw[id])));
  const oldFav=new Set((pack.fav)||[]);
  try{
    for(const x of arr){
      let raw=x&&x.data&&typeof x.data==='object'?x.data:null;
      if(!raw||!raw.name||!Array.isArray(raw.careers)){bad++;continue}
      if(inCur.has(strip(raw))){dup++;continue}
      raw=Object.assign({},raw,{proj:cp});
      let id=x.id;
      if(id&&!allRaw[id]&&String(id).charAt(0)!=='_'){await DB.doc(S.col+'/'+id).set(raw)}
      else{const ref=await DB.collection(S.col).add(raw);id=ref.id}
      allRaw[id]=raw;inCur.add(strip(raw));add++;if(oldFav.has(x.id))newFav.push(id);
    }
    const cl=(pack.clubs||[]).filter(c=>c&&c.l&&c.n),cur=((S.meta&&S.meta.clubs)||[]).slice();let ch=false;
    cl.forEach(c=>{if(!cur.some(y=>y.l===c.l&&y.n===c.n)){cur.push({l:c.l,n:c.n});ch=true}});
    const fav=((S.meta&&S.meta.fav)||[]).slice();newFav.forEach(i=>{if(fav.indexOf(i)<0){fav.push(i);ch=true}});
    if(ch){S.meta=Object.assign({},S.meta,{clubs:cur,fav:fav});applyCfg();await DB.doc(S.col+'/_meta').set(JSON.parse(JSON.stringify(S.meta)))}
  }catch(e){toast('불러오는 중 오류가 발생했습니다: '+((e&&e.message)||''));return false}
  toast(add?`선수 ${add}명을 불러왔습니다.`+(dup?` (이미 있는 ${dup}명은 건너뜀)`:''):dup?'이미 모두 등록된 선수입니다.':'불러올 선수가 없습니다.'+(bad?' (형식이 맞지 않는 항목 '+bad+'개)':''));
  return add>0;
}
function toggleFav(id){
  const cur=((S.meta&&S.meta.fav)||[]).slice(),i=cur.indexOf(id);
  if(i>=0)cur.splice(i,1);else cur.push(id);
  S.meta=Object.assign({},S.meta,{fav:cur});
  const n=S.players.filter(p=>cur.indexOf(p.id)>=0).length,cn=document.querySelector('.fvc .cn');if(cn)cn.textContent=n;
  renderList();
  const fb=document.querySelector('.favd');if(fb){const on=cur.indexOf(id)>=0;fb.setAttribute('aria-pressed',on);fb.textContent=on?'★':'☆'}
  if(DB&&S.col)Promise.resolve(DB.doc(S.col+'/_meta').set(JSON.parse(JSON.stringify(S.meta)))).catch(()=>toast('즐겨찾기를 저장하지 못했습니다.'));
}
async function moveGuest(){
  let gj=null;try{gj=JSON.parse(sessionStorage.getItem(GKEY)||'null')}catch(e){}
  if(!gj){S.guestMove=0;render();return}
  const pl=Object.keys(gj).filter(k=>k.charAt(0)!=='_').map(k=>({id:k,data:gj[k]}));
  const m=gj._meta||{};
  const ok=await importPack(JSON.stringify({app:'COPERO',v:1,players:pl,fav:m.fav||[],clubs:m.clubs||[]}));
  if(ok||!pl.length){try{sessionStorage.removeItem(GKEY)}catch(e){}S.guestMove=0;render()}
}
function skipGuest(){try{sessionStorage.removeItem(GKEY)}catch(e){}S.guestMove=0;render()}
/* ---------- boot: 로그인한 사용자별 저장 공간 ---------- */
(async function boot(){
  render();
  if(window.__auth){await window.__auth.ready;if(!window.__auth.logged)S.guest=true}
  if(S.guest){DB=memDB();S.uid='guest';S.uname=''}
  else{try{DB=await window.claude.use('db')}catch(e){DB=null}}
  let U=null;
  if(!S.guest){try{U=await window.claude.use('user')}catch(e){}}
  if(U){try{S.uid=await U.id()}catch(e){}
    try{const me=await U.me();S.uname=(me&&me.name)||''}catch(e){}}
  if(!DB){S.err='claude.ai에 로그인한 상태로 발행된 링크를 열어야 선수 데이터를 저장하고 불러올 수 있습니다.';S.loaded=true;render();return}
  if(!S.uid){S.err='이 계정에서는 개인 저장 공간을 사용할 수 없습니다. claude.ai 계정으로 로그인해 주세요.';S.loaded=true;render();return}
  S.col=S.guest?'data/guest':'data/users/'+S.uid;
  if(!S.guest){try{const gj=JSON.parse(sessionStorage.getItem(GKEY)||'null');const n=gj?Object.keys(gj).filter(k=>k.charAt(0)!=='_').length:0;if(n)S.guestMove=n}catch(e){}}
  render();
  const fail=e=>{S.err=(e&&e.message)||'연결에 실패했습니다.';S.loaded=true;render()};
  const upd=()=>{if(S.guest){S.importAvail=0;return}S.importAvail=(!S.meta||!S.meta.imported)&&S.seed&&S.seed.length&&S.players.length===0?S.seed.length:((!S.meta||!S.meta.imported)&&S.seed&&S.seed.length?S.seed.length:0);};
  DB.collection(S.col).onSnapshot(snap=>{
    const mine=[];let meta=null;
    S.raw={};snap.docs.forEach(d=>{if(d.id==='_meta'){meta=d.data()}else if(d.id.charAt(0)!=='_'){const raw=JSON.parse(JSON.stringify(d.data()));S.raw[d.id]=raw;mine.push(derive(Object.assign({id:d.id},JSON.parse(JSON.stringify(raw)))))}});
    S.meta=meta?JSON.parse(JSON.stringify(meta)):(S.meta||{});S.all=mine;S.cur=pickCur();applyProj();S.loaded=true;applyCfg();upd();
    if(S.view==='home')render();else if(S.view!=='register')render();
  },fail);
  DB.doc('config/app').onSnapshot(s=>{
    const first=!S.cfg;S.cfg0=s.exists?JSON.parse(JSON.stringify(s.data())):{countries:[]};applyCfg();
    if(first&&S.view==='register')render();
  },fail);
  try{
    DB.collection('players').onSnapshot(snap=>{
      S.seed=snap.docs.map(d=>({id:d.id,data:JSON.parse(JSON.stringify(d.data()))}));upd();if(S.view==='home')render();
    },()=>{S.seed=[]});
  }catch(e){S.seed=[]}
  window.__S=S;
})();
})();
</script>
